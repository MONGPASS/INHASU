<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--seed-semantic-color-paper-default);font-family:var(--seed-font-family);color:var(--seed-scale-color-gray-900)}.sw{display:flex;gap:6px}.sw>div{flex:1}.chip{height:44px;border-radius:6px}.lbl{margin-top:6px;font-size:10px;color:var(--seed-scale-color-gray-600);letter-spacing:-0.01em}.row{display:flex;align-items:baseline;gap:12px;padding:3px 0}.tok{font-size:10px;color:var(--seed-scale-color-gray-500);font-family:var(--seed-font-family-mono)}</style></head><body><div style="display:flex;gap:20px;align-items:center;padding:10px 4px"><div style="height:40px;padding:0 16px;display:inline-flex;align-items:center;border-radius:6px;background:#36D1A7;color:#fff;font-size:14px;font-weight:bold;box-shadow:0px 0px 0px 2px #075E4E">채팅하기</div><div style="height:40px;padding:0 16px;display:inline-flex;align-items:center;border-radius:6px;background:var(--seed-scale-color-gray-100);font-size:14px;font-weight:bold;box-shadow:0px 0px 0px 2px #075E4E">공유</div><span class="tok">--seed-focus-ring</span></div></body></html>
