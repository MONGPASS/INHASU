<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--seed-semantic-color-paper-default);font-family:var(--seed-font-family);color:var(--seed-scale-color-gray-900)}.sw{display:flex;gap:6px}.sw>div{flex:1}.chip{height:44px;border-radius:6px}.lbl{margin-top:6px;font-size:10px;color:var(--seed-scale-color-gray-600);letter-spacing:-0.01em}.row{display:flex;align-items:baseline;gap:12px;padding:3px 0}.tok{font-size:10px;color:var(--seed-scale-color-gray-500);font-family:var(--seed-font-family-mono)}</style></head><body><div class="sw"><div><div class="chip" style="background:var(--seed-semantic-color-paper-default);box-shadow:inset 0 0 0 1px var(--seed-semantic-color-divider-2)"></div><div class="lbl">default</div></div><div><div class="chip" style="background:var(--seed-semantic-color-paper-contents);box-shadow:inset 0 0 0 1px var(--seed-semantic-color-divider-2)"></div><div class="lbl">contents</div></div><div><div class="chip" style="background:var(--seed-semantic-color-paper-background);box-shadow:inset 0 0 0 1px var(--seed-semantic-color-divider-2)"></div><div class="lbl">background</div></div><div><div class="chip" style="background:var(--seed-semantic-color-paper-sheet);box-shadow:inset 0 0 0 1px var(--seed-semantic-color-divider-2)"></div><div class="lbl">sheet</div></div><div><div class="chip" style="background:var(--seed-semantic-color-paper-dialog);box-shadow:inset 0 0 0 1px var(--seed-semantic-color-divider-2)"></div><div class="lbl">dialog</div></div><div><div class="chip" style="background:var(--seed-semantic-color-paper-floating);box-shadow:inset 0 0 0 1px var(--seed-semantic-color-divider-2)"></div><div class="lbl">floating</div></div><div><div class="chip" style="background:var(--seed-semantic-color-paper-accent);box-shadow:inset 0 0 0 1px var(--seed-semantic-color-divider-2)"></div><div class="lbl">accent</div></div></div></body></html>
