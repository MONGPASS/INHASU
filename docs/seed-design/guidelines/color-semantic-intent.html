<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--seed-semantic-color-paper-default);font-family:var(--seed-font-family);color:var(--seed-scale-color-gray-900)}.sw{display:flex;gap:6px}.sw>div{flex:1}.chip{height:44px;border-radius:6px}.lbl{margin-top:6px;font-size:10px;color:var(--seed-scale-color-gray-600);letter-spacing:-0.01em}.row{display:flex;align-items:baseline;gap:12px;padding:3px 0}.tok{font-size:10px;color:var(--seed-scale-color-gray-500);font-family:var(--seed-font-family-mono)}</style></head><body><div class="sw"><div><div class="chip" style="background:var(--seed-semantic-color-primary)"></div><div class="chip" style="background:var(--seed-semantic-color-primary-low);margin-top:4px;height:22px"></div><div class="lbl">primary</div></div><div><div class="chip" style="background:var(--seed-semantic-color-secondary)"></div><div class="chip" style="background:var(--seed-semantic-color-secondary-low);margin-top:4px;height:22px"></div><div class="lbl">secondary</div></div><div><div class="chip" style="background:var(--seed-semantic-color-success)"></div><div class="chip" style="background:var(--seed-semantic-color-success-low);margin-top:4px;height:22px"></div><div class="lbl">success</div></div><div><div class="chip" style="background:var(--seed-semantic-color-warning)"></div><div class="chip" style="background:var(--seed-semantic-color-warning-low);margin-top:4px;height:22px"></div><div class="lbl">warning</div></div><div><div class="chip" style="background:var(--seed-semantic-color-danger)"></div><div class="chip" style="background:var(--seed-semantic-color-danger-low);margin-top:4px;height:22px"></div><div class="lbl">danger</div></div><div><div class="chip" style="background:var(--seed-semantic-color-accent)"></div><div class="chip" style="background:var(--seed-semantic-color-accent-low);margin-top:4px;height:22px"></div><div class="lbl">accent</div></div></div></body></html>
