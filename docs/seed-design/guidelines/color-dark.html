<!-- @dsCard group="Colors" viewport="700x130" name="Dark scope" subtitle="the same semantic names under [data-seed-scale-color=dark]" -->
<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--seed-semantic-color-paper-default);font-family:var(--seed-font-family);color:var(--seed-scale-color-gray-900)}.sw{display:flex;gap:6px}.sw>div{flex:1}.chip{height:44px;border-radius:6px}.lbl{margin-top:6px;font-size:10px;color:var(--seed-scale-color-gray-600);letter-spacing:-0.01em}.row{display:flex;align-items:baseline;gap:12px;padding:3px 0}.tok{font-size:10px;color:var(--seed-scale-color-gray-500);font-family:var(--seed-font-family-mono)}</style></head><body><div data-seed-scale-color="dark" style="padding:12px;border-radius:8px;background:var(--seed-semantic-color-paper-default)"><div class="sw"><div><div class="chip" style="background:var(--seed-semantic-color-primary)"></div><div class="lbl" style="color:var(--seed-semantic-color-ink-text-low)">primary</div></div><div><div class="chip" style="background:var(--seed-semantic-color-secondary)"></div><div class="lbl" style="color:var(--seed-semantic-color-ink-text-low)">secondary</div></div><div><div class="chip" style="background:var(--seed-semantic-color-success)"></div><div class="lbl" style="color:var(--seed-semantic-color-ink-text-low)">success</div></div><div><div class="chip" style="background:var(--seed-semantic-color-warning)"></div><div class="lbl" style="color:var(--seed-semantic-color-ink-text-low)">warning</div></div><div><div class="chip" style="background:var(--seed-semantic-color-danger)"></div><div class="lbl" style="color:var(--seed-semantic-color-ink-text-low)">danger</div></div><div><div class="chip" style="background:var(--seed-semantic-color-accent)"></div><div class="lbl" style="color:var(--seed-semantic-color-ink-text-low)">accent</div></div></div></div></body></html>
