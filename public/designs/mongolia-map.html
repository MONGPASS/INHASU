const labelKo = s => LABEL_KO[(s || "").trim()] || s;
const norm = s => s.replace(/[\s·,]/g, "").toLowerCase();
function lookup(name) {
  const k = norm(name);
  if (GAZETTEER[k]) return GAZETTEER[k];
  const hit = Object.keys(GAZETTEER).find(g => k.includes(g) || g.includes(k));
  return hit ? GAZETTEER[hit] : null;
}

const params = new URLSearchParams(location.search);
const raw = (params.get("stops") || "울란바토르|울란바토르;체체를렉 초원|체체를렉 초원;쳉헤르 온천|쳉헤르 온천;테를지 국립공원|테를지 국립공원").split(";");
const missing = [];
const stops = [];
const COORD_RE = /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/;
raw.map(s => s.trim()).filter(Boolean).forEach(entry => {
  const parts = entry.split("|").map(x => (x || "").trim());
  const name = parts[0] || "", desc = parts[1] || "";
  let img = parts[2] || "", coordStr = parts[3] || "";
  // 사진 없이 좌표만 넣은 경우 (지역명|설명|위도,경도)
  if (!coordStr && COORD_RE.test(img)) { coordStr = img; img = ""; }
  let coords = null;
  if (COORD_RE.test(coordStr)) {
    const [a, b] = coordStr.split(",").map(Number);
    // 위도,경도 / 경도,위도 어느 순서로 넣어도 몽골 범위(위도 41~53)로 자동 판별
    coords = (a >= 41 && a <= 53) ? [b, a] : [a, b];
  } else {
    coords = lookup(name);
  }
  if (!coords) { missing.push(name); return; }
  stops.push({ name, desc, img, lon: coords[0], lat: coords[1] });
});
stops.forEach((s, i) => { s.no = String(i + 1).padStart(2, "0"); });

const W = 760, H = 990, R = 56, PIN = 17;
const MAP_TOP = 358, MAP_BOTTOM = 702;
const stage = d3.select("#stage");

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topology => {
  const countries = topojson.feature(topology, topology.objects.countries).features;
  const mongolia = countries.find(f => f.properties.name === "Mongolia");

  const projection = d3.geoMercator().fitExtent([[60, MAP_TOP + 6], [700, MAP_BOTTOM - 6]], mongolia);
  const path = d3.geoPath(projection);

  const svg = stage.append("svg").attr("viewBox", `0 0 ${W} ${H}`)
    .attr("role", "img").attr("aria-label", "몽골 지도와 여정 경로");

  const defs = svg.append("defs");
  defs.append("clipPath").attr("id", "band").append("rect")
    .attr("x", 0).attr("y", MAP_TOP).attr("width", W).attr("height", MAP_BOTTOM - MAP_TOP);

  const geo = svg.append("g").attr("clip-path", "url(#band)");
  geo.append("g").selectAll("path")
    .data(countries.filter(f => f.properties.name !== "Mongolia"))
    .join("path").attr("d", path)
    .attr("fill", "#F5FFFC").attr("stroke", "#DFFFF4").attr("stroke-width", 1);
  geo.append("path").datum(mongolia).attr("d", path)
    .attr("fill", "#C8FFEF").attr("stroke", "#91FEE0").attr("stroke-width", 1.5);

  stops.forEach(s => {
    const [px, py] = projection([s.lon, s.lat]);
    s.px = px; s.py = py;
  });

  // 겹치는 핀은 서로 밀어내 자리 확보 (번호는 각각 유지)
  // MIN은 핀이 겹쳐 읽기 어려울 때만 최소한으로 밀어내는 거리 —
  // 크게 잡으면 실제 지리 위치가 왜곡되므로 핀 크기(직경 34px)보다 약간 큰 값 유지
  const pins = stops.map(s => { const p = { x: s.px, y: s.py, label: s.no, members: [s] }; s.pin = p; return p; });
  const MIN = 46;
  for (let it = 0; it < 300; it++) {
    for (let a = 0; a < pins.length; a++) {
      for (let b = a + 1; b < pins.length; b++) {
        const A = pins[a], B = pins[b];
        let dx = B.x - A.x, dy = B.y - A.y;
        let d = Math.hypot(dx, dy);
        if (d < 0.01) { dx = 1; dy = 0.4; d = 1.08; }
        if (d < MIN) {
          const push = (MIN - d) / 2 / d;
          A.x -= dx * push; A.y -= dy * push;
          B.x += dx * push; B.y += dy * push;
        }
      }
    }
  }

  // 카드는 지도 위/아래 슬롯에 배치 — 연결선이 경로와 교차하지 않도록 핀의 상하 위치를 따름
  const midY = (MAP_TOP + MAP_BOTTOM) / 2;
  const top = stops.filter(s => s.pin.y <= midY).sort((a, b) => a.pin.x - b.pin.x);
  const bottom = stops.filter(s => s.pin.y > midY).sort((a, b) => a.pin.x - b.pin.x);
  while (top.length > 3 && bottom.length < 3) bottom.push(top.pop());
  while (bottom.length > 3 && top.length < 3) top.push(bottom.pop());
  const colsFor = n => n <= 1 ? [W / 2] : n === 2 ? [210, 550] : [150, 380, 610];
  const place = (row, y) => {
    const xs = colsFor(row.length);
    row.forEach((s, i) => { s.bx = xs[i]; s.by = y; });
  };
  place(top, 202);
  place(bottom, 790);

  // 카드 ↔ 핀 얇은 연결선
  svg.append("g").selectAll("line").data(stops).join("line").attr("class", "connector")
    .each(function (d) {
      const vx = d.bx - d.pin.x, vy = d.by - d.pin.y, len = Math.hypot(vx, vy) || 1;
      d3.select(this)
        .attr("x1", d.pin.x + (vx / len) * (PIN + 6)).attr("y1", d.pin.y + (vy / len) * (PIN + 6))
        .attr("x2", d.bx - (vx / len) * (R + 5)).attr("y2", d.by - (vy / len) * (R + 5));
    })
    .attr("stroke", "#06C4A0").attr("stroke-width", 1.2).attr("opacity", 0.55);

  // 이동 경로: 베지어 곡선 + 중간 화살표
  const legs = [];
  stops.forEach(s => { if (!legs.length || legs[legs.length - 1] !== s.pin) legs.push(s.pin); });

  const route = svg.append("g");
  const segs = [];
  for (let i = 0; i < legs.length - 1; i++) {
    const a = legs[i], b = legs[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy) || 1;
    const ux0 = dx / dist, uy0 = dy / dist;
    const trim = PIN + 4;
    const x1 = a.x + ux0 * trim, y1 = a.y + uy0 * trim;
    const x2 = b.x - ux0 * trim, y2 = b.y - uy0 * trim;
    const L = Math.hypot(x2 - x1, y2 - y1) || 1;
    const ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy, ny = ux;
    const bow = Math.min(Math.max(L * 0.3, 22), 80);
    const c1x = x1 + ux * L * 0.28 + nx * bow, c1y = y1 + uy * L * 0.28 + ny * bow;
    const c2x = x2 - ux * L * 0.28 + nx * bow, c2y = y2 - uy * L * 0.28 + ny * bow;

    const seg = route.append("path")
      .attr("d", `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`)
      .attr("fill", "none").attr("stroke", "#029F85").attr("stroke-width", 2.4)
      .attr("stroke-linecap", "round");

    const node = seg.node(), total = node.getTotalLength();
    const pm = node.getPointAtLength(total / 2);
    const pn = node.getPointAtLength(Math.min(total, total / 2 + 1));
    const ang = Math.atan2(pn.y - pm.y, pn.x - pm.x) * 180 / Math.PI;
    const arrow = route.append("path")
      .attr("d", "M-6,-6 L7,0 L-6,6 Z")
      .attr("fill", "#029F85")
      .attr("transform", `translate(${pm.x},${pm.y}) rotate(${ang})`);
    segs.push({ seg, arrow, total });
  }

  // 이동 거리(지표면 거리 기준)
  let totalKm = 0;
  for (let i = 0; i < stops.length - 1; i++) {
    totalKm += d3.geoDistance([stops[i].lon, stops[i].lat], [stops[i + 1].lon, stops[i + 1].lat]) * 6371;
  }

  // 민트 원형 핀
  const pinOuter = svg.append("g").selectAll("g").data(pins).join("g")
    .attr("transform", d => `translate(${d.x},${d.y})`);
  const pin = pinOuter.append("g")
    .style("transform-box", "fill-box").style("transform-origin", "center");
  pin.append("rect")
    .attr("x", d => -(Math.max(d.label.length * 9 + 18, PIN * 2)) / 2).attr("y", -PIN)
    .attr("width", d => Math.max(d.label.length * 9 + 18, PIN * 2)).attr("height", PIN * 2)
    .attr("rx", PIN)
    .attr("fill", "#06C4A0").attr("stroke", "#fff").attr("stroke-width", 3);
  pin.append("text").attr("y", 6).attr("text-anchor", "middle")
    .attr("font-size", 15).attr("font-weight", 800).attr("fill", "#fff")
    .text(d => d.label);

  const bub = stage.selectAll(".bubble").data(stops).join("div").attr("class", "bubble")
    .style("left", d => d.bx + "px").style("top", d => d.by + "px");
  bub.filter(d => d.img).append("img").attr("src", d => d.img).attr("alt", d => d.name);
  bub.filter(d => !d.img).append("div").text(d => d.no);

  const cap = stage.selectAll(".cap").data(stops).join("div").attr("class", "cap")
    .style("left", d => d.bx + "px").style("top", d => (d.by + R + 12) + "px");
  cap.append("div").attr("class", "pill").text(d => labelKo(d.desc || d.name));


  if (missing.length) {
    stage.append("div").attr("class", "miss")
      .text("좌표를 찾지 못한 지역: " + missing.join(", ") + " — 「지역명|표시문구|사진URL|위도,경도」 형식으로 좌표를 직접 입력하세요");
  }

  // 상단 HUD: 이동 거리 · 구간 수
  const hud = stage.append("div").attr("class", "hud");
  const kmEl = hud.append("div").attr("class", "hud-km")
    .text(Math.round(totalKm).toLocaleString("ko-KR") + " km");
  hud.append("div").attr("class", "hud-sub")
    .text(`방문지 ${stops.length}곳 · 이동 ${Math.max(stops.length - 1, 0)}구간`);

  // 루트 드로잉 애니메이션 — CSS 애니메이션(초기 상태는 항상 완성된 지도)
  const STEP = 1.15, DRAW = 1.6;
  segs.forEach((s, i) => {
    s.seg.style("--len", s.total).style("stroke-dasharray", s.total);
    s.delay = i * STEP + 0.55;
  });
  let kmTimer = null;
  function animate() {
    segs.forEach(s => {
      s.seg.style("animation", "none");
      s.arrow.style("animation", "none");
    });
    pin.style("animation", "none");
    bub.style("animation", "none");
    cap.style("animation", "none");
    svg.selectAll(".connector").style("animation", "none");
    void document.getElementById("stage").offsetWidth;

    pin.style("animation", (d, i) => `popIn 0.7s cubic-bezier(.2,1.5,.4,1) ${i * STEP}s both`);
    bub.style("animation", (d, i) => `bubIn 0.75s ease-out ${i * STEP + 0.3}s both`);
    cap.style("animation", (d, i) => `fadeIn 0.7s ease-out ${i * STEP + 0.48}s both`);
    svg.selectAll(".connector").style("animation", (d, i) => `lineIn 0.7s ease-out ${i * STEP + 0.38}s both`);
    segs.forEach(s => {
      s.seg.style("animation", `dash ${DRAW}s ease-in-out ${s.delay}s both`);
      s.arrow.style("animation", `fadeIn 0.5s ease-out ${s.delay + DRAW * 0.6}s both`);
    });

    const span = (Math.max(segs.length, 1) * STEP + DRAW) * 1000;
    const t0 = Date.now();
    if (kmTimer) clearInterval(kmTimer);
    const write = v => { kmEl.node().textContent = Math.round(v).toLocaleString("ko-KR") + " km"; };
    write(0);
    kmTimer = setInterval(() => {
      const t = Math.min((Date.now() - t0) / span, 1);
      write(totalKm * (1 - Math.pow(1 - t, 3)));
      if (t >= 1) { clearInterval(kmTimer); kmTimer = null; }
    }, 40);
    setTimeout(() => { if (kmTimer) { clearInterval(kmTimer); kmTimer = null; } write(totalKm); }, span + 300);
  }
  animate();
  const cycle = (Math.max(segs.length, 1) * STEP + DRAW) * 1000 + 3200;
  setInterval(animate, cycle);

  const fit = () => {
    const s = document.documentElement.clientWidth / W;
    const el = document.getElementById("stage");
    el.style.transform = `scale(${s})`;
    document.body.style.height = (H * s) + "px";
  };
  fit();
  window.addEventListener("resize", fit);
});
</script>
</body>
</html>
