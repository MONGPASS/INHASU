<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="/admin-legacy-redirect.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리소스 관리 · 몽골리아 은하수</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306c4a0'/%3E%3Cpath d='M20 42 30 24l7 12 5-7 8 13z' fill='white'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<script src="presets.js"></script>
<style>
  /* ── Claude Design "05-2 배정 자원 - 등록 정보" (Seed 디자인 토큰 값) ── */
  :root {
    --paper:#ffffff; --bg:#f2f3f6; --contents:#f7f8fa;
    --ink:#212124; --low:#868b94; --g100:#f2f3f6; --g200:#eaebee; --g300:#dcdee3; --g400:#d1d3d8; --g900:#212124;
    --div1:rgba(0,23,88,.05); --div2:#eaebee; --div3:#dcdee3;
    --primary:#36d1a7; --primary-hover:#12b28c; --mint700:#067661;
    --danger:#ec404c; --danger-low:rgba(241,83,90,.05);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Pretendard, system-ui, "Malgun Gothic", sans-serif; background:var(--bg); color:var(--ink); font-size:14px; -webkit-font-smoothing:antialiased; }
  button, input, textarea, select { font-family:inherit; }
  svg { display:block; flex:none; }

  /* 단독 접속(옛 도구) 좌측 메뉴 — 통합 관리자 안에서는 admin-embed.js가 숨긴다 */
  .shell { display:flex; min-height:100vh; }
  .side { width:232px; flex:0 0 232px; background:#fff; border-right:1px solid var(--div2); display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; }
  .side-brand { display:flex; align-items:center; gap:10px; padding:4px 8px 20px; }
  .side-brand .logo { width:38px; height:38px; border-radius:11px; background:var(--primary-hover); color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .side-brand b { font-size:15px; font-weight:800; display:block; line-height:1.2; }
  .side-brand small { font-size:11.5px; color:var(--low); font-weight:600; }
  .mi { display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:11px; color:var(--low); font-size:14px; font-weight:600; text-decoration:none; margin-bottom:2px; }
  .mi:hover { background:var(--g100); color:var(--ink); }
  .mi.on { background:var(--ink); color:#fff; }

  .content { flex:1; min-width:0; display:flex; flex-direction:column; gap:16px; padding:20px 32px 48px; }
  .page-head { padding:8px 0 4px; }
  .page-head h1 { font-size:26px; line-height:135%; font-weight:700; letter-spacing:-.02em; }
  html.admin-embedded .page-head { display:none; }

  /* 상단 도구줄: 종류 · 검색 · 보기 · 추가 */
  .rg-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .rg-seg { display:flex; gap:2px; padding:3px; border-radius:8px; background:var(--g100); }
  .rg-seg.sm { border-radius:6px; }
  .tab, .cat-tab, .rg-view { display:inline-flex; align-items:center; gap:6px; flex:none; height:36px; padding:0 14px; border:0; border-radius:6px; background:transparent; color:var(--low); font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .tab:hover, .cat-tab:hover, .rg-view:hover { color:var(--ink); }
  .tab.on, .cat-tab.on, .rg-view.on { background:var(--paper); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .tab .cnt, .cat-tab .cnt { font-size:12px; font-weight:700; color:var(--low); }
  .cat-tab.on .cnt { color:var(--mint700); }
  .rg-view { height:34px; padding:0 10px; font-size:13px; }
  .rg-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .rg-add { display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 16px; border:0; border-radius:6px; background:var(--primary); font-size:14px; font-weight:700; color:#fff; cursor:pointer; white-space:nowrap; }
  .rg-add:hover { background:var(--primary-hover); }

  /* 숙소 지역 탭 (영구 저장 카테고리) */
  .lodge-cats { align-self:flex-start; max-width:100%; overflow-x:auto; }
  .lodge-cats[hidden] { display:none; }
  .cat-tab .edit { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-left:2px; border-radius:4px; color:var(--low); }
  .cat-tab .edit:hover { background:var(--g100); color:var(--ink); }
  .cat-tab.addcat { color:var(--mint700); }

  /* 종류(등급·유형) 칩 */
  .rg-chips { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:4px; height:32px; padding:0 12px; border:0; border-radius:999px; background:var(--paper); box-shadow:inset 0 0 0 1px var(--div2); font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .chip .cnt { font-size:12px; font-weight:700; color:var(--low); }
  .chip.on { background:var(--g900); color:#fff; box-shadow:none; }
  .chip.on .cnt { color:rgba(255,255,255,.7); }
  .rg-count { margin-left:auto; font-size:13px; color:var(--low); }

  /* 카드 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px; }
  .res-card { display:flex; flex-direction:column; border-radius:12px; background:var(--paper); overflow:hidden; cursor:pointer; transition:box-shadow .14s; }
  .res-card.is-warn { box-shadow:inset 0 0 0 1px var(--div2); }
  .res-card:hover { box-shadow:0 4px 16px rgba(33,33,36,.08); }
  .thumb { position:relative; aspect-ratio:4/3; background:var(--g100); display:flex; align-items:center; justify-content:center; color:var(--low); overflow:hidden; }
  .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .thumb .noimg { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; }
  .thumb .type { position:absolute; left:10px; bottom:10px; height:24px; padding:0 8px; border-radius:4px; display:inline-flex; align-items:center; background:var(--paper); font-size:12px; font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.16); pointer-events:none; }
  .res-card .body { display:flex; flex-direction:column; gap:6px; padding:14px 16px 12px; }
  .res-card .nm { display:flex; align-items:baseline; gap:6px; min-width:0; }
  .res-card .nm b { font-size:16px; line-height:135%; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .res-card .nm span { font-size:13px; color:var(--low); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .res-card .intro { min-height:40px; font-size:13px; line-height:150%; color:var(--low); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .intro.warn, .rg-row .warn { color:var(--danger); }
  .res-card .foot { display:flex; align-items:center; gap:8px; margin-top:auto; padding:10px 16px; border-top:1px solid var(--div1); }
  .st { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; white-space:nowrap; color:var(--low); }
  .st i { width:6px; height:6px; border-radius:999px; background:var(--g400); }
  .st.on { color:var(--ink); }
  .st.on i { background:var(--primary); }
  .res-card .edit-btn { margin-left:auto; height:30px; padding:0 12px; border:0; border-radius:4px; background:var(--g100); font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; }
  .res-card .edit-btn:hover { background:var(--g200); }
  .res-add { min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--g300); border-radius:12px; background:transparent; font-size:14px; font-weight:700; color:var(--low); cursor:pointer; }
  .res-add:hover { border-color:var(--primary); color:var(--mint700); }

  /* 목록 */
  .rg-list { border-radius:12px; background:var(--paper); overflow:hidden; }
  .rg-head, .rg-row { display:grid; grid-template-columns:44px minmax(140px,1.2fr) 150px minmax(100px,.8fr) minmax(160px,2fr) 130px 16px; column-gap:16px; align-items:center; }
  .rg-head { height:40px; padding:0 20px; font-size:12px; font-weight:700; color:var(--low); background:var(--contents); }
  .rg-row { width:100%; min-height:68px; padding:10px 20px; border:0; border-top:1px solid var(--div1); background:transparent; text-align:left; cursor:pointer; color:inherit; font-size:13px; }
  .rg-row:hover { background:var(--g100); }
  .rg-row .ph { position:relative; width:44px; height:44px; border-radius:8px; overflow:hidden; background:var(--g100); display:flex; align-items:center; justify-content:center; color:var(--low); }
  .rg-row .ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .rg-row .nm { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .rg-row .nm b { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rg-row .nm span, .rg-row .c3, .rg-row .in { font-size:12px; color:var(--low); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rg-row .c3, .rg-row .in { font-size:13px; }
  .type-l { justify-self:start; height:24px; padding:0 8px; border-radius:4px; display:inline-flex; align-items:center; font-size:12px; font-weight:700; white-space:nowrap; }
  .rg-list-wrap { overflow-x:auto; border-radius:12px; }
  .rg-list-wrap .rg-list { min-width:880px; }

  .rg-empty { display:flex; flex-direction:column; align-items:center; gap:8px; padding:56px 0; border-radius:12px; background:var(--paper); font-size:14px; color:var(--low); }
  .rg-empty div { display:flex; gap:6px; }
  .rg-empty button { height:32px; padding:0 12px; border:0; border-radius:6px; background:var(--g100); font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; }

  /* 편집 패널 */
  .overlay { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s; }
  .overlay.on { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; z-index:41; width:min(460px,100vw); display:flex; flex-direction:column; background:var(--paper); box-shadow:-8px 0 24px rgba(0,0,0,.12); transform:translateX(105%); transition:transform .2s ease-out; }
  .drawer.on { transform:none; }
  .dh { display:flex; align-items:center; gap:8px; height:60px; padding:0 20px; border-bottom:1px solid var(--div1); flex:none; }
  .dh h2 { font-size:17px; font-weight:700; }
  .dh .x { margin-left:auto; width:36px; height:36px; border:0; border-radius:6px; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .dh .x:hover { background:var(--g100); }
  .db { flex:1; overflow:auto; display:flex; flex-direction:column; gap:20px; padding:20px; }
  .sec { display:flex; flex-direction:column; gap:8px; }
  .sec-t, label.f > .f-l { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink); }
  .f-l em { font-style:normal; font-size:12px; font-weight:500; color:var(--low); }
  .f-l .n { margin-left:auto; font-size:12px; font-weight:500; color:var(--low); }
  label.f { display:flex; flex-direction:column; gap:6px; }
  .db input:not([type=file]):not([type=hidden]), .db select, .db textarea { width:100%; min-height:44px; padding:0 12px; border:0; border-radius:6px; box-shadow:inset 0 0 0 1px var(--div3); font-size:15px; color:var(--ink); outline:0; background:var(--paper); }
  .db textarea { min-height:120px; padding:12px; line-height:150%; resize:vertical; }
  .db textarea.sm { min-height:72px; }
  .db input:focus, .db select:focus, .db textarea:focus { box-shadow:inset 0 0 0 1.5px var(--ink); }
  .hintline { font-size:12px; color:var(--low); line-height:150%; }

  .ph-grid { display:grid; grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr; gap:6px; aspect-ratio:3/2; }
  .ph-grid.single { grid-template-columns:1fr; grid-template-rows:1fr; aspect-ratio:16/10; }
  .ph-slot { position:relative; border:0; border-radius:8px; overflow:hidden; background:var(--g100); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--low); font-size:12px; font-weight:600; cursor:pointer; min-height:0; }
  .ph-slot.main { grid-row:1 / 3; font-size:13px; }
  .ph-grid.single .ph-slot.main { grid-row:auto; }
  .ph-slot.empty { box-shadow:inset 0 0 0 1.5px var(--g300); background:var(--contents); }
  .ph-slot.empty:hover, .ph-slot.drag { box-shadow:inset 0 0 0 1.5px var(--primary); color:var(--mint700); }
  .ph-slot img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ph-slot .ph-tag { position:absolute; left:8px; top:8px; height:22px; padding:0 7px; border-radius:4px; display:inline-flex; align-items:center; background:rgba(33,33,36,.72); color:#fff; font-size:11px; font-weight:700; }
  .ph-slot .ph-btn { position:absolute; height:24px; border:0; border-radius:4px; background:rgba(33,33,36,.72); color:#fff; font-size:11px; font-weight:700; cursor:pointer; }
  .ph-slot .ph-btn.off { right:6px; top:6px; width:24px; font-size:14px; line-height:1; }
  .ph-slot .ph-btn.up { left:6px; bottom:6px; padding:0 8px; }
  .ph-slot .busy { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.8); color:var(--ink); font-size:12px; font-weight:700; }
  .ph-archive summary { font-size:12px; font-weight:700; color:var(--low); cursor:pointer; }
  #lodgeArchive { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  #lodgeArchive button { width:72px; height:54px; padding:0; border:0; border-radius:6px; overflow:hidden; cursor:pointer; background:var(--g100); }
  #lodgeArchive button:disabled { opacity:.4; cursor:not-allowed; }
  #lodgeArchive img { width:100%; height:100%; object-fit:cover; display:block; }

  .chipset { display:flex; gap:6px; flex-wrap:wrap; }
  .chipset + input { margin-top:2px; }
  .qr-row { display:flex; gap:10px; align-items:center; }
  .qr-row #qrBox { flex:none; width:72px; height:72px; border-radius:8px; background:var(--contents); box-shadow:inset 0 0 0 1.5px var(--g300); display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; font-size:11px; font-weight:700; color:var(--low); text-align:center; }
  .qr-row #qrBox img { width:100%; height:100%; object-fit:contain; }

  .df { display:flex; gap:8px; padding:12px 20px; border-top:1px solid var(--div1); flex:none; }
  .df .del { height:48px; padding:0 16px; border:0; border-radius:6px; background:transparent; font-size:15px; font-weight:700; color:var(--danger); cursor:pointer; }
  .df .del:hover { background:var(--danger-low); }
  .df .save { flex:1; height:48px; border:0; border-radius:6px; background:var(--primary); font-size:16px; font-weight:700; color:#fff; cursor:pointer; }
  .df .save:hover { background:var(--primary-hover); }
  .df .save:disabled { opacity:.5; cursor:wait; }

  @keyframes rgToast { from { transform:translate(-50%,8px) scale(.9); opacity:0; } to { transform:translate(-50%,0) scale(1); opacity:1; } }
  .toast { position:fixed; left:50%; bottom:28px; z-index:60; transform:translateX(-50%); padding:12px 16px; border-radius:10px; background:var(--g900); font-size:14px; font-weight:700; color:#fff; opacity:0; pointer-events:none; }
  .toast.on { opacity:1; animation:rgToast .3s cubic-bezier(.2,1.4,.4,1); }
  @media (max-width:820px) { .side { display:none; } .content { padding:20px 16px 40px; } .rg-right { margin-left:0; } }
</style>
<script src="/lodging.f3c00aad8ec7.js"></script>
<script src="/admin-embed.js"></script>
</head>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const IS_LOCAL = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
const ADMIN_TOKEN = sessionStorage.getItem("leaders_admin_token") || "";

/* ── 선 아이콘(디자인의 AdminIcon과 같은 모양) ── */
const ICON_PATHS = {
  guides: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  lodges: '<path d="M3.5 21 14 3"/><path d="M20.5 21 10 3"/><path d="M15.5 21 12 15l-3.5 6"/><path d="M2 21h20"/>',
  vehicles: '<path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  grid: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  rows: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
};
const ic = (name, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;

/* ── 리소스 종류 정의 ── */
const TYPES = {
  guides: {
    label: "가이드", short: "가이드", one: "가이드",
    sub: r => r.nameEn || "", type: r => r.role || "",
    typeTitle: "유형", typeOptions: ["가이드", "전문 가이드", "드라이빙 가이드", "가이드 겸 드라이버", "전문 가이드 + 기사"],

/* 종류 표시 색(디자인 TC) — 공백을 무시하고 맞춘다. 모르는 값은 회색. */
const TONE_OF = { "가이드":"carrot", "전문가이드":"blue", "드라이빙가이드":"yellow", "가이드겸드라이버":"purple", "전문가이드+기사":"blue",
  "고급게르":"carrot", "일반게르":"gray", "호텔":"purple", "5성급":"purple", "4성급":"blue", "게스트하우스":"yellow" };
const TONES = { carrot:["#ECFDF7","#067661"], blue:["#EDF6FC","#0178AD"], yellow:["#E2F8F4","#059176"], purple:["#F4F5FD","#5755BD"], gray:["#f2f3f6","#868b94"] };
const toneOf = t => TONES[TONE_OF[String(t || "").replace(/\s+/g, "")] || "gray"];

const requestedResourceType = new URLSearchParams(location.search).get("resourceType");
let activeType = ["guides", "lodges", "vehicles"].includes(requestedResourceType) ? requestedResourceType : "guides";
let LIB = {};        // 현재 탭의 라이브러리 (작업 사본)
let editKey = null;
let LODGE_CATS = [];           // 숙소 지역 카테고리 목록 (순서·빈 카테고리 보존)
let activeLodgeCat = "__all"; // "__all" | "__none" | 카테고리명
const LODGE_UNCAT = "미분류";
let typeFilter = "";
let VIEW = "card";
try { if (localStorage.getItem("leaders_resource_view") === "list") VIEW = "list"; } catch (e) {}

let toastT;
function toast(m){ const el = $("toast"); el.textContent = m; el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 2200); }

function load() {
  LIB = JSON.parse(JSON.stringify(TYPES[activeType].get()));
  if (activeType === "lodges") {
    LODGE_CATS = window.getLodgeCats().slice();
    // 예전에 지역만 저장된 숙소도 카테고리 목록에 자동으로 포함합니다.
    Object.values(LIB).forEach(r => {
      const cat = lodgeCatOf(r);
      if (cat && !LODGE_CATS.includes(cat)) LODGE_CATS.push(cat);
    });
    if (activeLodgeCat !== "__all" && activeLodgeCat !== "__none" && !LODGE_CATS.includes(activeLodgeCat)) activeLodgeCat = "__all";
  }
  renderTabs(); renderGrid();
}
async function persist() {
  const saves = [TYPES[activeType].save(LIB)];
  if (activeType === "lodges") saves.push(window.saveLodgeCats(LODGE_CATS));
  const results = await Promise.all(saves);
  return results.find(r => r && !r.ok) || results[0];

/* ── 종류 탭 · 보기 · 추가 버튼 ── */
function renderTabs() {

/* ── 숙소 지역 카테고리 ── */
function lodgeCatOf(r) { return String((r && r.region) || "").trim(); }
function lodgeCatCount(cat) { return Object.entries(LIB).filter(([, r]) => lodgeCatOf(r) === cat).length; }

function renderLodgeCats() {
  const bar = $("lodgeCats");
  if (activeType !== "lodges") { bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  const visible = Object.entries(LIB);
  const total = visible.length;
  const noneCnt = visible.filter(([, r]) => !lodgeCatOf(r)).length;
  let html = `<button type="button" class="cat-tab ${activeLodgeCat === "__all" ? "on" : ""}" data-cat="__all">${ic("pin", 14)}전체 <span class="cnt">${total}</span></button>`;
  LODGE_CATS.forEach(cat => {
    const on = activeLodgeCat === cat;
    html += `<button type="button" class="cat-tab ${on ? "on" : ""}" data-cat="${esc(cat)}">${ic("pin", 14)}${esc(cat)} <span class="cnt">${lodgeCatCount(cat)}</span>` +
      (on ? `<span class="edit" data-act="ren" title="지역 이름 바꾸기">${ic("pencil", 13)}</span><span class="edit" data-act="del" title="지역 삭제">${ic("trash", 13)}</span>` : "") +
      `</button>`;
  });
  if (noneCnt) html += `<button type="button" class="cat-tab ${activeLodgeCat === "__none" ? "on" : ""}" data-cat="__none">${ic("pin", 14)}${LODGE_UNCAT} <span class="cnt">${noneCnt}</span></button>`;
  html += `<button type="button" class="cat-tab addcat" id="addLodgeCatBtn">${ic("plus", 14)}지역 추가</button>`;
  bar.innerHTML = html;
  bar.querySelectorAll(".cat-tab[data-cat]").forEach(el => {
    el.onclick = e => {
      const act = e.target.closest(".edit")?.dataset.act;
      if (act === "ren") { renameLodgeCat(el.dataset.cat); return; }
      if (act === "del") { deleteLodgeCat(el.dataset.cat); return; }
      activeLodgeCat = el.dataset.cat; typeFilter = ""; renderLodgeCats(); renderGrid();
    };
  });
  $("addLodgeCatBtn").onclick = addLodgeCat;
}

async function addLodgeCat() {
  const name = (prompt("새 카테고리(숙소 지역) 이름을 입력하세요 (예: 테를지)") || "").trim();
  if (!name) return;
  if (name === LODGE_UNCAT) return toast(`"${LODGE_UNCAT}"은(는) 사용할 수 없는 이름입니다`);
  if (LODGE_CATS.includes(name)) {
    activeLodgeCat = name; renderLodgeCats(); renderGrid(); return toast("이미 있는 카테고리입니다");
  }
  LODGE_CATS.push(name);
  await window.saveLodgeCats(LODGE_CATS);
  activeLodgeCat = name; renderLodgeCats(); renderGrid();
  toast(`"${name}" 카테고리가 추가되었습니다`);
}

async function renameLodgeCat(cat) {
  const name = (prompt("카테고리(숙소 지역) 이름 변경", cat) || "").trim();
  if (!name || name === cat) return;
  if (name === LODGE_UNCAT || LODGE_CATS.includes(name)) return toast("사용할 수 없거나 이미 있는 이름입니다");
  LODGE_CATS = LODGE_CATS.map(c => c === cat ? name : c);
  Object.values(LIB).forEach(r => { if (lodgeCatOf(r) === cat) r.region = name; });
  activeLodgeCat = name;
  const res = await persist();
  renderLodgeCats(); renderGrid();
  toast(res.ok ? "카테고리 이름이 변경되었습니다" : "카테고리 이름 변경 — 이 브라우저에만 반영됨");
}

async function deleteLodgeCat(cat) {
  const count = Object.values(LIB).filter(r => lodgeCatOf(r) === cat).length;
  if (!confirm(`"${cat}" 카테고리를 삭제할까요?` + (count ? `\n이 카테고리의 숙소 ${count}개는 "${LODGE_UNCAT}"로 이동합니다. (숙소는 삭제되지 않습니다)` : ""))) return;
  LODGE_CATS = LODGE_CATS.filter(c => c !== cat);
  Object.values(LIB).forEach(r => { if (lodgeCatOf(r) === cat) r.region = ""; });
  activeLodgeCat = "__all";
  const res = await persist();
  renderLodgeCats(); renderGrid();
  toast(res.ok ? "카테고리가 삭제되었습니다" : "카테고리 삭제 — 이 브라우저에만 반영됨");
}

/* ── 이번 달 이용 현황: 배정 API(상품·견적 예약 공통)에서 이름이 같은 배정을 센다 ── */
const INACTIVE = ["cancelled", "on_hold", "취소", "예약취소", "보류"];
const normName = v => String(v || "").replace(/\s+/g, "").toLowerCase();
let USAGE = null, usageState = "loading";
async function loadUsage() {
  try {
    const res = await fetch("/api/admin/assignments", { credentials: "same-origin", cache: "no-store" });
    const j = res.ok ? await res.json() : null;
    if (!j || !Array.isArray(j.items)) throw new Error("assignments unavailable");
    const now = new Date(), ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    const first = `${ym}-01`, last = `${ym}-31`;
    const U = { guides: {}, lodges: {}, vehicles: {} };
    const add = (bucket, name, key) => { const k = normName(name); if (k) (bucket[k] = bucket[k] || new Set()).add(key); };
    j.items.forEach(b => {
      if (!b || INACTIVE.includes(String(b.status || ""))) return;
      const s = String(b.startDate || "").slice(0, 10), e = String(b.endDate || b.startDate || "").slice(0, 10);
      if (!s || s > last || e < first) return;
      const a = b.assignment || {}, key = b.key || `${b.source}:${b.id}`;
      add(U.guides, a.guide && a.guide.name, key);
      add(U.vehicles, a.vehicle && a.vehicle.type, key);
      (Array.isArray(a.accommodations) ? a.accommodations : []).forEach(n => add(U.lodges, n && n.accommodation && n.accommodation.name, key));
    });
    USAGE = U; usageState = "ok";
  } catch (e) { usageState = "fail"; }
  renderGrid();
}
function usageLine(name) {
  if (usageState === "loading") return { on: false, text: "이용 현황 확인 중" };
  if (usageState !== "ok") return { on: false, text: "" };
  const n = (USAGE[activeType][normName(name)] || { size: 0 }).size;
  if (activeType === "guides") return { on: !!n, text: n ? `이번 달 ${n}팀` : "이번 달 배정 없음" };
  return { on: !!n, text: n ? `이번 달 ${n}회` : "이번 달 이용 없음" };
}

/* ── 이미지: 리사이즈 → WebP → (실서버)R2 업로드 / (로컬)base64 ── */
function fileToImage(file, maxW, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(async (blob) => {
          if (!blob) return rej(new Error("이미지 변환 실패"));
          if (IS_LOCAL) {
            const r2 = new FileReader();
            r2.onload = () => res(r2.result); r2.onerror = rej; r2.readAsDataURL(blob);
            return;
          }
          if (!ADMIN_TOKEN) return rej(new Error("관리자 로그인이 필요합니다. 관리자 페이지에서 로그인 후 이용해 주세요."));
          try {
            const fd = new FormData();
            fd.append("file", blob, "resource.webp");
            const up = await fetch("/api/upload?folder=images", { method: "POST", body: fd, headers: { "x-admin-token": ADMIN_TOKEN } });
            const j = await up.json().catch(() => ({}));
            if (up.status === 401) throw new Error("관리자 인증이 만료됐어요. 관리자 페이지에서 다시 로그인해 주세요.");
            if (!j.ok || !j.url) throw new Error(j.error || "업로드 실패");
            res(j.url);
          } catch (e) { rej(e); }
        }, "image/webp", quality);
      };
      img.onerror = () => rej(new Error("이미지를 읽을 수 없어요"));
      img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

const fld = (label, control, hint = "") => `<label class="f"><span class="f-l">${label}${hint ? `<em>${hint}</em>` : ""}</span>${control}</label>`;
/* 종류 칩: 누르면 입력값이 바뀌고(다시 누르면 비움), 직접 입력도 그대로 저장된다. */
function chipField(id, title, options, value, opts = {}) {
  const list = [...new Set([...options, ...opts.extra || [], value].filter(v => typeof v === "string" && v.trim()))];
  const chips = list.map(t => `<button type="button" class="chip ${value === t ? "on" : ""}" data-chip="${esc(t)}">${esc(t)}</button>`).join("");
  const input = opts.hidden ? `<input type="hidden" id="${id}" value="${esc(value || "")}">`
    : `<input id="${id}" value="${esc(value || "")}" placeholder="${esc(opts.placeholder || "직접 입력")}">`;
  return `<div class="sec"><span class="sec-t">${title}${opts.hint ? `<em style="font-style:normal;font-size:12px;font-weight:500;color:var(--low)">${opts.hint}</em>` : ""}</span><div class="chipset" data-for="${id}">${chips}</div>${input}</div>`;
}
function wireChips() {
  document.querySelectorAll("#drawer .chipset[data-for]").forEach(set => {
    const input = $(set.dataset.for);
    const sync = () => set.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.chip === input.value.trim()));
    set.querySelectorAll(".chip").forEach(b => b.onclick = () => { input.value = input.value.trim() === b.dataset.chip ? "" : b.dataset.chip; sync(); });
    if (input.type !== "hidden") input.addEventListener("input", sync);
  });
}
const introField = (label, value, hint, placeholder) => `<label class="f"><span class="f-l">${label}${hint ? `<em>${hint}</em>` : ""}<span class="n" id="descN">${String(value || "").length}자</span></span><textarea id="f_desc" placeholder="${esc(placeholder || "")}">${esc(value || "")}</textarea></label>`;
const usedValues = (type, pick) => Object.values(TYPES[type].get()).map(pick).filter(v => typeof v === "string" && v.trim());

function fieldRows(type, r) {
  if (type === "guides") return `
    ${fld("영문·현지 이름", `<input id="f_nameEn" value="${esc(r.nameEn||"")}" placeholder="예: Bilguun">`, "확정 일정표에 보여요")}
    ${fld("전화번호", `<input id="f_phone" value="${esc(r.phone||"")}" placeholder="+976 8000-0000">`, "현지 연락처 · 확정 일정표에 보여요")}
    ${chipField("f_role", "유형", TYPES.guides.typeOptions, r.role || "", { extra: usedValues("guides", g => g.role), hint: "확정 일정표에 보여요", placeholder: "목록에 없으면 직접 입력" })}
    <div class="sec"><span class="sec-t">카카오톡 QR<em style="font-style:normal;font-size:12px;font-weight:500;color:var(--low)">선택 · 확정 일정표에 보여요</em></span>
      <div class="qr-row">
        <div id="qrBox">${r.qr ? `<img src="${esc(r.qr)}" alt="카카오톡 QR">` : `<span>QR 업로드<br>(클릭)</span>`}</div>
        <input id="f_qr" value="${esc(r.qr||"")}" placeholder="또는 이미지 URL 직접 입력" style="flex:1;">
      </div>
      <input type="file" id="fileQr" accept="image/*" style="display:none">
    </div>
    ${introField("소개", r.desc, "확정 일정표에 보여요", "고객 확정 안내에 보이는 소개예요. 2~3문장이면 충분해요.")}`;
  if (type === "lodges") return `
    ${fld("지역", `<select id="f_region">${lodgeRegionOptions(r.region)}</select>`, "예약관리 숙소 배정에서 이 지역으로 묶여요")}
    ${chipField("f_grade", "등급", TYPES.lodges.typeOptions, r.grade || "", { extra: usedValues("lodges", l => l.grade), hidden: true, hint: "확정 일정표에 보여요" })}
    ${fld("시설 태그", `<input id="f_tags" value="${esc(r.tags||"")}" placeholder="예: 샤워 · 전기">`)}
    ${introField("기존 소개", r.desc, "보관용·일정표 미표시", "")}
    ${[['address','주소'],['phone','숙소 대표 전화번호'],['roomAmenities','객실 비품'],['sharedFacilities','호텔 공용시설'],['operatingNotes','운영 참고 (보관용·일정표 미표시)'],['officialSources','공식 출처']].map(([k,label]) => `<label class="f"><span class="f-l">${label}</span><textarea class="sm" id="f_${k}" rows="2" placeholder="${k === 'roomAmenities' ? '객실 비품을 입력해 주세요' : k === 'officialSources' ? '웹사이트 주소를 한 줄에 하나씩 입력해 주세요' : ''}">${esc(r[k]||"")}</textarea></label>`).join('')}`;
  return `
    ${fld("차량 번호", `<input id="f_plate" value="${esc(r.plate||"")}" placeholder="예: 12가 3401">`, "내부용")}
    ${fld("기사 이름", `<input id="f_driver" value="${esc(r.driver||"")}" placeholder="예: Bat">`, "가이드 일정표에 보여요")}
    ${fld("기사 연락처", `<input id="f_phone" value="${esc(r.phone||"")}" placeholder="+976 8000-0000">`, "가이드 일정표에 보여요")}
    ${chipField("f_seats", "탑승 인원", [], r.seats || "", { extra: usedValues("vehicles", v => v.seats), hint: "확정 일정표에 보여요", placeholder: "예: 6인" })}
    ${fld("수하물", `<input id="f_luggage" value="${esc(r.luggage||"")}" placeholder="대형 캐리어 4개 적재 가능">`, "확정 일정표에 보여요")}
    ${introField("차량 특징", r.desc, "확정 일정표에 보여요", "예: 몽골 장거리 이동에 적합한 차량입니다.")}`;
}
/* 숙소 지역 선택지 — 지역 카테고리 목록과 기존 숙소의 지역을 함께 보여줍니다. */
function lodgeRegionOptions(current) {
  const cur = String(current || "").trim();
  const used = Object.values(TYPES.lodges.get())
    .map(r => String((r && r.region) || "").trim()).filter(Boolean);
  const list = [...new Set([...LODGE_CATS, ...used, ...(cur ? [cur] : [])])];
  return `<option value="" ${cur ? "" : "selected"}>지역 미지정</option>` +
    list.map(v => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(v)}</option>`).join("") +
    `<option value="__new">＋ 새 지역 추가…</option>`;
}

function readFields(type, r) {
  const v = id => $(id) ? $(id).value.trim() : "";
  if (type === "guides") { r.nameEn=v("f_nameEn"); r.role=v("f_role"); r.phone=v("f_phone"); r.qr=v("f_qr"); r.desc=v("f_desc"); }
  else if (type === "lodges") { r.region=v("f_region") === "__new" ? "" : v("f_region"); r.grade=v("f_grade"); r.tags=v("f_tags"); r.desc=v("f_desc"); Lodging.fields.forEach(k => r[k]=v("f_"+k)); }
  else { r.seats=v("f_seats"); r.luggage=v("f_luggage"); r.plate=v("f_plate"); r.driver=v("f_driver"); r.phone=v("f_phone"); r.desc=v("f_desc"); }
  return r;
}

function openEdit(key) {
  editKey = key;
  const T = TYPES[activeType];
  const isNew = key === null;
  const defaultRegion = isNew && activeType === "lodges" && !["__all", "__none"].includes(activeLodgeCat) ? activeLodgeCat : "";
  const r = isNew ? { img:"", region:defaultRegion } : JSON.parse(JSON.stringify(LIB[key]));
  const isLodge = activeType === "lodges", isVehicle = activeType === "vehicles";
  /* 사진: 가이드는 대표 1장, 숙소·차량은 대표 포함 3장(확정 일정표 표시 수). 차량의 4번째 이후 사진과 숙소 보관 사진은 그대로 둔다. */
  const maxPhotos = activeType === "guides" ? 1 : 3;
  let photos, extraPhotos = [], photoPool = [];
  if (isLodge) {
    photos = Lodging.photos(r).slice(0, 3);
    photoPool = [...new Set([r.img, ...(Array.isArray(r.imgs) ? r.imgs : []), ...photos].filter(Boolean))];
  } else if (isVehicle) {
    const all = [...new Set([r.img, ...(Array.isArray(r.imgs) ? r.imgs : [])].filter(Boolean))];
    photos = all.slice(0, 3); extraPhotos = all.slice(3);
  } else photos = r.img ? [r.img] : [];
  let uploading = 0, busySlot = -1, pickSlot = 0;
  const shown = src => Lodging.imageUrl(src) || src;
  const nameLabel = activeType === "guides" ? "이름" : isLodge ? "숙소 이름" : "차량 이름";
  const namePh = activeType === "guides" ? "예: 빌궁" : isLodge ? "예: 테를지 스타캠프" : "예: 스타렉스";
  const photoHint = activeType === "guides" ? "사진을 끌어다 놓으면 바로 바뀌어요. 고객 확정 안내에 보여요."
    : "사진을 끌어다 놓으면 바로 바뀌어요. 첫 사진이 대표 사진이고, 확정 일정표에는 최대 3장이 보여요.";

  $("drawer").innerHTML = `
    <div class="dh"><h2>${isNew ? `새 ${T.short} 추가` : `${T.short} 편집`}</h2><button type="button" class="x" id="dX" aria-label="닫기">${ic("x", 18)}</button></div>
    <div class="db">
      <div class="sec">
        <span class="sec-t">사진</span>
        <div class="ph-grid ${maxPhotos === 1 ? "single" : ""}" id="lodgePhotos"></div>
        <input type="file" id="photoFile" accept="image/*" multiple hidden>
        <span class="hintline">${photoHint}${extraPhotos.length ? ` 추가 사진 ${extraPhotos.length}장은 그대로 보관돼요.` : ""}</span>
        ${isLodge ? `<details class="ph-archive"><summary>보관 사진에서 선택</summary><div id="lodgeArchive"></div></details>` : ""}
      </div>
      ${fld(nameLabel, `<input id="f_name" value="${esc(key||"")}" placeholder="${namePh}">`)}
      ${fieldRows(activeType, r)}
    </div>
    <div class="df">
      ${isNew ? "" : `<button type="button" class="del" id="dDel">삭제하기</button>`}
      <button type="button" class="save" id="dSave">${isNew ? "추가하기" : "저장하기"}</button>
    </div>`;
  $("drawer").classList.add("on"); $("overlay").classList.add("on");
  $("dX").onclick = closeDrawer;
  wireChips();
  const desc = $("f_desc");
  if (desc && $("descN")) desc.addEventListener("input", () => { $("descN").textContent = `${desc.value.length}자`; });

  /* 사진 칸: 빈 칸을 누르거나 끌어다 놓으면 올리고, 채운 칸은 앞으로(대표로)·빼기 */
  const renderPhotos = () => {
    $("lodgePhotos").innerHTML = Array.from({ length: maxPhotos }, (_, i) => {
      const main = i === 0 ? " main" : "", busy = busySlot === i ? `<span class="busy">업로드 중…</span>` : "";
      if (photos[i]) return `<div class="ph-slot${main}" data-slot="${i}"><img src="${esc(shown(photos[i]))}" alt="${i === 0 ? "대표 사진" : `추가 사진 ${i}`}">` +
        (i === 0 ? `<span class="ph-tag">대표</span>` : `<button type="button" class="ph-btn up" data-photo-up="${i}">앞으로</button>`) +
        `<button type="button" class="ph-btn off" data-photo-off="${i}" aria-label="사진 빼기">×</button>${busy}</div>`;
      return `<div class="ph-slot empty${main}" data-slot="${i}" role="button" tabindex="0">${ic("image", i === 0 ? 24 : 18)}<span>${i === 0 ? "대표 사진" : "추가 사진"}</span>${busy}</div>`;
    }).join("");
    $("lodgePhotos").querySelectorAll(".ph-slot").forEach(slot => {
      const i = Number(slot.dataset.slot);
      slot.onclick = e => { if (e.target.closest(".ph-btn") || uploading) return; pickSlot = Math.min(i, photos.length); $("photoFile").click(); };
      slot.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); slot.click(); } };
      slot.ondragover = e => { e.preventDefault(); slot.classList.add("drag"); };
      slot.ondragleave = () => slot.classList.remove("drag");
      slot.ondrop = e => { e.preventDefault(); slot.classList.remove("drag"); uploadInto([...(e.dataTransfer?.files || [])], Math.min(i, photos.length)); };
    });
    $("lodgePhotos").querySelectorAll("[data-photo-off]").forEach(b => b.onclick = () => { photos.splice(Number(b.dataset.photoOff), 1); renderPhotos(); });
    $("lodgePhotos").querySelectorAll("[data-photo-up]").forEach(b => b.onclick = () => { const i = Number(b.dataset.photoUp); [photos[i-1], photos[i]] = [photos[i], photos[i-1]]; renderPhotos(); });
    if (isLodge) {
      $("lodgeArchive").innerHTML = photoPool.filter(src => !photos.includes(src) && Lodging.imageUrl(src)).map(src => `<button type="button" data-photo-select="${esc(src)}" ${photos.length >= 3 ? "disabled" : ""}><img src="${esc(src)}" alt="보관 사진 선택"></button>`).join("")
        || `<span class="hintline">보관된 다른 사진이 없어요.</span>`;
      $("lodgeArchive").querySelectorAll("[data-photo-select]").forEach(b => b.onclick = () => { if (photos.length < 3) photos.push(b.dataset.photoSelect); renderPhotos(); });
    }
  };
  const uploadInto = async (files, slot) => {
    files = files.filter(f => /^image\//.test(f.type || ""));
    if (!files.length || uploading) return;
    const replacing = slot < photos.length;
    const room = maxPhotos - photos.length + (replacing ? 1 : 0);
    if (files.length > room) { toast(`사진은 최대 ${maxPhotos}장이에요. 먼저 사진을 빼 주세요.`); files = files.slice(0, room); }
    if (!files.length) return;
    uploading++; busySlot = slot; $("dSave").disabled = true; renderPhotos();
    try {
      for (const [n, f] of files.entries()) {
        const src = await fileToImage(f, 1200, 0.82);
        if (isLodge && !photoPool.includes(src)) photoPool.push(src);
        if (n === 0 && replacing) photos[slot] = src; else photos.push(src);
      }
    } catch (err) { toast("⚠ " + err.message); }
    finally { uploading--; busySlot = -1; $("dSave").disabled = false; $("photoFile").value = ""; renderPhotos(); }
  };
  $("photoFile").onchange = e => uploadInto([...e.target.files], pickSlot);
  renderPhotos();

  /* 숙소 지역: "＋ 새 지역 추가…"를 고르면 바로 카테고리를 만들어 선택합니다. */
  const regionSel = $("f_region");
  if (regionSel) {
    let lastRegion = regionSel.value;
    regionSel.onchange = () => {
      if (regionSel.value !== "__new") { lastRegion = regionSel.value; return; }
      const name = (prompt("새 지역 이름을 입력하세요 (예: 서부몽골)") || "").trim();
      if (!name || name === LODGE_UNCAT) { regionSel.value = lastRegion; if (name === LODGE_UNCAT) toast(`"${LODGE_UNCAT}"은(는) 사용할 수 없는 이름입니다`); return; }
      if (!LODGE_CATS.includes(name)) { LODGE_CATS.push(name); window.saveLodgeCats(LODGE_CATS); renderLodgeCats(); }
      if (![...regionSel.options].some(o => o.value === name)) {
        regionSel.add(new Option(name, name), regionSel.options.length - 1);
      }
      regionSel.value = name; lastRegion = name;
    };
  }

  /* 가이드 카카오톡 QR 업로드 — 사진과 같은 파이프라인(WebP 축소 후 서버 저장) */
  const qrBox = $("qrBox");
  if (qrBox) {
    const qrPreview = () => {
      const u = $("f_qr").value.trim();
      qrBox.innerHTML = u ? `<img src="${esc(u)}" alt="카카오톡 QR">` : `<span>QR 업로드<br>(클릭)</span>`;
    };
    qrBox.onclick = () => $("fileQr").click();
    $("f_qr").addEventListener("input", qrPreview);
    $("fileQr").onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      qrBox.innerHTML = `<span>업로드 중…</span>`;
      try { $("f_qr").value = await fileToImage(f, 480, 0.9); }
      catch (err) { toast("⚠ " + err.message); }
      qrPreview();
      $("fileQr").value = "";
    };
  }

  $("dSave").onclick = async () => {
    const name = $("f_name").value.trim();
    if (!name) return toast("이름을 입력해 주세요");
    if (uploading) return toast("사진을 올리는 중이에요. 잠시 후 다시 눌러 주세요.");
    if ((isNew || name !== editKey) && LIB[name]) return toast("이미 같은 이름이 있어요");
    const rec = readFields(activeType, { ...r });
    if (isLodge) {
      if (rec.officialSources.split(/\r?\n/).some(u => u.trim() && !Lodging.webUrl(u))) return toast("공식 출처는 http/https URL을 한 줄에 하나씩 입력해 주세요.");
      rec.representativePhotos = [...photos];
      rec.img = photos[0] || "";
      rec.imgs = [...new Set([...photoPool, ...photos])];
    } else if (isVehicle) {
      rec.img = photos[0] || "";
      rec.imgs = [...new Set([...photos, ...extraPhotos])];
    } else rec.img = photos[0] || "";
    $("dSave").disabled = true;
    const beforeSave = JSON.parse(JSON.stringify(LIB));
    if (!isNew && name !== editKey) delete LIB[editKey];
    LIB[name] = rec;
    const res = await persist();
    if (!res.ok && !res.local) {
      LIB = beforeSave;
      localStorage.setItem("leaders_" + activeType, JSON.stringify(LIB));
      $("dSave").disabled = false;
      toast("⚠ 저장 실패: " + (res.error || ""));
      return;
    }
    if (isNew && activeType === "lodges" && rec.region) activeLodgeCat = rec.region;
    renderTabs(); renderGrid(); closeDrawer();
    toast(res.ok ? (isNew ? `${name} 추가했어요` : "저장했어요") : res.local ? `"${name}" 저장 — 이 브라우저에만 저장됨` : "⚠ 저장 실패: " + (res.error || ""));
  };

  const del = $("dDel");
  if (del) del.onclick = async () => {
    if (!confirm(`"${editKey}"을(를) 삭제할까요?`)) return;
    const removed = editKey;
    delete LIB[editKey];
    const res = await persist();
    renderTabs(); renderGrid(); closeDrawer();
    toast(res.ok ? `${removed} 삭제했어요` : "삭제됨 — 이 브라우저에만 반영");
  };
}
function closeDrawer(){ $("drawer").classList.remove("on"); $("overlay").classList.remove("on"); }
$("overlay").onclick = closeDrawer;
$("addBtn").onclick = () => openEdit(null);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("drawer").classList.contains("on")) closeDrawer(); });

/* ── 시작: 서버 라이브러리 동기화 후 렌더 ── */
(async () => { try { await window.cloudReady; } catch (e) {} load(); loadUsage(); })();
</script>
</body>
</html>
