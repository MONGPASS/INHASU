<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>가이드 시트 · 몽골리아 은하수</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306c4a0'/%3E%3Cpath d='M20 42 30 24l7 12 5-7 8 13z' fill='white'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
/* ══════════ 가이드 시트 — 담당 가이드 전달용 A4 인쇄 문서 ══════════
   디자인 정본: Claude Design ‘몽골리아 은하수 문서 리디자인’ (가이드 일정표 1 · 개요 / 2 · 일자별 / 현금영수증 2부, Montage 토큰)
   1페이지: 공항 픽업·샌딩 · 숙소 정보 · 고객 명단 · 현지 수배 · 결제·잔금
   2페이지: 일자별 일정 / 잔금이 있으면 현금영수증 2부 / 마지막: 가이드 피켓(기존 그대로) */
:root{
  --mint:#0CEFD3; --mint-bg:#E7FDFB; --mint-soft:#CEFCF6; --teal:#067365; --teal-dark:#045148; --teal-dot:#079483;
  --ink:#222222; --sub:#46474C; --mute:#6B6E75; --line:#E1E2E4; --line-soft:#ECEDEF; --fill:#F6F6F6; --paper:#F7F8F8;
  --gray-bg:#F2F3F6; --gray-ink:#595A60; --red:#D42A3B; --red-bg:#FEF6F7; --cut:#B9BCC2;
  /* 기존 가이드 피켓 페이지 색 */
  --brand:#06C4A0; --picket-line:#E3F0EB; --picket-mute:#8CA39D;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#E9ECEF; }
body{ font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:var(--ink); line-height:1.5; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.hint{ max-width:794px; margin:14px auto 0; padding:11px 16px; background:#fff; border:1px solid var(--line); border-radius:12px; font-size:13px; color:var(--sub); display:flex; align-items:center; justify-content:space-between; gap:12px; }
.hint button{ flex:none; background:var(--ink); color:#fff; border:0; border-radius:10px; padding:8px 18px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
.ic{ display:inline-block; flex:none; vertical-align:middle; }

/* 공통 A4 한 장 */
.sheet{ position:relative; width:794px; min-height:1123px; margin:14px auto; background:#fff; box-shadow:0 8px 30px rgba(0,0,0,.08);
  padding:40px 48px 28px; display:flex; flex-direction:column; gap:14px; overflow:hidden;
  -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.sheet.p2{ padding:40px 48px 28px; gap:14px; }
.sheet .topbar{ position:absolute; left:0; top:0; right:0; height:8px; background:var(--mint); }

/* 머리글 */
.gs-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding-bottom:16px; border-bottom:2px solid var(--ink); }
.gs-brand{ display:flex; align-items:center; gap:14px; }
.gs-brand img{ width:50px; height:50px; object-fit:contain; display:block; flex:none; }
.gs-brand .sep{ width:1px; align-self:stretch; margin:6px 0; background:var(--line); }
.gs-brand .eyebrow{ font-size:11px; line-height:1.2; font-weight:700; letter-spacing:.16em; color:var(--teal); }
.gs-brand .name{ font-size:15px; line-height:1.2; font-weight:700; letter-spacing:-.015em; }
.gs-title{ display:flex; align-items:center; gap:10px; }
.gs-title h1{ font-size:24px; line-height:1.2; font-weight:700; letter-spacing:-.023em; }

/* 배지 (Montage ContentBadge) */
.badge{ display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:6px; font-size:12px; font-weight:600; white-space:nowrap; }
.badge.xs{ height:20px; padding:0 6px; border-radius:5px; font-size:11px; }
.b-progress{ background:var(--gray-bg); color:var(--gray-ink); }
.b-new{ background:var(--mint-bg); color:var(--teal); }
.b-alert{ background:var(--red-bg); color:var(--red); }

/* 상품 요약 */
.hero{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
.hero-l{ min-width:0; display:flex; flex-direction:column; gap:6px; }
.hero-title{ font-size:38px; line-height:1.1; font-weight:700; letter-spacing:-.03em; word-break:keep-all; }
.hero-sub{ font-size:15px; color:var(--sub); }
.hero-r{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
.hero-dates{ display:flex; align-items:center; gap:10px; font-size:22px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
.hero-dates small{ font-size:15px; color:var(--mute); }
.hero-dates .ic{ color:var(--mute); }
.intensity{ display:flex; align-items:center; gap:8px; }
.intensity span{ font-size:12px; font-weight:600; color:var(--mute); }
.intensity .dots{ display:flex; gap:4px; }
.intensity .dots i{ width:8px; height:8px; border-radius:999px; background:var(--line); }
.intensity .dots i.on{ background:var(--ink); }
.intensity b{ font-size:12px; font-weight:700; }

/* 섹션 머리 */
.sec{ display:flex; flex-direction:column; gap:12px; }
.sec-h{ display:flex; align-items:center; gap:8px; }
.sec-h .ic{ color:var(--teal); }
.sec-h h2{ font-size:15px; line-height:1.3; font-weight:700; white-space:nowrap; }
.sec-h .rule{ flex-grow:1; height:1px; background:var(--line-soft); }
.sec-h .aside{ font-size:12px; color:var(--mute); white-space:nowrap; }

/* 공항 픽업·샌딩 */
.fl-row{ display:flex; gap:12px; }
.fl-card{ flex:1 1 0; display:flex; flex-direction:column; gap:6px; padding:14px 18px; border:1px solid var(--line); border-radius:16px; }
.fl-card .k{ display:flex; align-items:center; gap:6px; }
.fl-card .k .ic{ color:var(--teal); }
.fl-card .k b{ font-size:13px; font-weight:600; color:var(--sub); }
.fl-card .k small{ margin-left:auto; font-size:12px; color:var(--mute); }
.fl-card .v{ font-size:20px; line-height:1.3; font-weight:700; letter-spacing:-.012em; }
.fl-card .s{ font-size:12px; color:var(--mute); }
.fl-card .s.on{ color:var(--sub); font-weight:600; }
.pickup-lodge{ font-size:12px; color:var(--mute); }
.pickup-lodge b{ color:var(--ink); font-weight:600; }

/* 숙소 정보 */
.box{ border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.lodge-row{ display:grid; grid-template-columns:120px minmax(0,1fr) 232px; align-items:center; gap:16px; padding:6px 18px; }
.lodge-row + .lodge-row{ border-top:1px solid var(--line-soft); }
.lodge-day{ display:flex; align-items:center; gap:10px; }
.night{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:24px; border-radius:6px; background:var(--mint-bg); font-size:12px; font-weight:700; color:var(--teal); }
.lodge-day b{ font-size:13px; font-weight:600; white-space:nowrap; }
.lodge-day b small{ font-size:13px; font-weight:500; color:var(--mute); }
.lodge-plan{ min-width:0; font-size:13px; line-height:1.35; color:var(--sub); }
.lodge-plan b{ font-weight:700; color:var(--ink); }
.lodge-assign{ display:flex; align-items:center; gap:8px; min-width:0; height:30px; padding:0 10px; border-bottom:1.5px dashed var(--line); }
.lodge-assign span{ flex-shrink:0; font-size:11px; font-weight:600; color:var(--mute); }
.lodge-assign b{ flex-grow:1; min-width:0; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lodge-assign b.none{ color:var(--mute); }
.lodge-assign b small{ font-size:11px; font-weight:600; color:var(--mute); margin-left:4px; }
.box-empty{ padding:16px; text-align:center; color:var(--mute); font-size:13px; }

/* 고객 명단 (Montage Table) */
table{ width:100%; border-collapse:collapse; font-size:14px; }
th{ padding:6px 12px; text-align:left; vertical-align:middle; color:var(--sub); font-weight:600; font-size:13px; background:var(--paper); border-bottom:1px solid var(--line); }
td{ padding:6px 12px; text-align:left; vertical-align:middle; height:34px; border-bottom:1px solid var(--line-soft); }
tbody tr:last-child td{ border-bottom:0; }
th.c,td.c{ text-align:center; }
td.num{ color:var(--mute); }
td.pp{ font-weight:600; }

/* 현지 수배 · 결제 */
.two{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.panel{ display:flex; flex-direction:column; padding:16px 20px 8px; border-radius:16px; background:var(--fill); }
.panel-h{ display:flex; align-items:center; gap:6px; padding-bottom:10px; }
.panel-h .ic{ color:var(--teal); }
.panel-h b{ font-size:14px; font-weight:700; }
.panel-h small{ margin-left:auto; font-size:12px; color:var(--mute); }
.kv{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line-soft); }
.kv > span{ flex:none; font-size:13px; color:var(--mute); }
.kv > b{ font-size:14px; font-weight:700; text-align:right; }
.kv > b.none{ color:var(--mute); }
.kv .amt{ display:flex; align-items:center; gap:8px; }
.kv .amt b{ font-size:14px; }
.panel .note{ padding:6px 0; border-top:1px solid var(--line-soft); font-size:12px; color:var(--mute); }

/* 업무 메모 · 여행자 특이사항 */
.memo{ padding:14px 18px; border:1px solid var(--line); border-radius:16px; }
.memo ul{ list-style:none; display:flex; flex-direction:column; gap:2px; }
.memo li{ display:flex; gap:8px; font-size:13px; line-height:19px; white-space:pre-wrap; }
.memo li:before{ content:""; flex:none; width:4px; height:4px; margin-top:8px; border-radius:999px; background:var(--teal-dot); }

/* 바닥글 */
.gs-foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; line-height:1.4; color:var(--mute); }
.gs-foot b{ font-weight:700; color:var(--sub); }
.gs-foot .pg{ font-weight:600; color:var(--sub); white-space:nowrap; }

/* 2페이지: 일자별 일정 */
.p2-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
.p2-head .lt{ display:flex; align-items:baseline; gap:10px; min-width:0; }
.p2-head .lt b{ font-size:22px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
.p2-head .lt span{ font-size:14px; color:var(--sub); }
.days{ border:1px solid var(--line); border-radius:20px; overflow:hidden; }
.day{ display:grid; grid-template-columns:76px minmax(0,1fr) 164px 124px; gap:16px; padding:14px 20px; break-inside:avoid; page-break-inside:avoid; }
.day + .day{ border-top:1px solid var(--line); }
.day-n{ display:flex; flex-direction:column; gap:6px; }
.day-n i{ width:40px; height:40px; border-radius:12px; background:var(--mint); display:flex; align-items:center; justify-content:center; font-style:normal; font-size:18px; font-weight:700; }
.day-n i.end{ background:var(--fill); }
.day-n b{ font-size:13px; line-height:1.3; font-weight:700; white-space:nowrap; }
.day-n b small{ font-size:13px; font-weight:500; color:var(--mute); }
.day-main{ display:flex; flex-direction:column; gap:8px; min-width:0; }
.day-title{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.day-title h3{ font-size:16px; line-height:1.3; font-weight:700; letter-spacing:-.01em; }
.chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; background:var(--fill); font-size:12px; font-weight:600; color:var(--sub); white-space:nowrap; }
.items{ list-style:none; display:flex; flex-direction:column; gap:2px; }
.items li{ display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:19px; }
.items li:before{ content:""; flex:none; width:4px; height:4px; margin-top:8px; border-radius:999px; background:var(--teal-dot); }
.items li.dim{ color:var(--mute); }
.items li.dim:before{ background:var(--line); }
.items li.em{ font-weight:600; color:var(--teal-dark); }
.day-col{ display:flex; flex-direction:column; gap:6px; padding-left:16px; border-left:1px solid var(--line-soft); }
.day-col .lbl{ font-size:12px; font-weight:600; color:var(--mute); }
.day-col .stay{ font-size:14px; line-height:1.35; font-weight:700; }
.day-col .stay.none{ color:var(--mute); }
.stay-sub{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; margin-top:-2px; }
.stay-sub small{ font-size:12px; line-height:1.35; color:var(--mute); }
.tags{ display:flex; flex-wrap:wrap; gap:4px 8px; }
.tag{ display:inline-flex; align-items:center; gap:2px; font-size:12px; font-weight:600; color:var(--teal-dark); white-space:nowrap; }
.tag .ic{ color:var(--teal); }
.tag.off{ color:var(--mute); text-decoration:line-through; }
.tag.off .ic{ color:var(--mute); }
.day-col.meals{ gap:4px; }
.meal{ display:flex; gap:8px; font-size:13px; line-height:19px; }
.meal span{ flex:none; width:14px; font-weight:700; color:var(--mute); }
.meal em{ font-style:normal; }
.meal em.none{ color:var(--mute); }

/* 현금영수증 2부 — 왼쪽 고객용, 오른쪽 회사 보관용 */
.cash-page{ position:relative; width:794px; height:1123px; margin:14px auto; background:#fff; box-shadow:0 8px 30px rgba(0,0,0,.08); padding:40px 44px 36px; display:flex; flex-direction:column; gap:18px; overflow:hidden; }
.cash-page .topbar{ position:absolute; left:0; top:0; right:0; height:8px; background:var(--mint); }
.cash-top{ display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--mute); }
.cash-top b{ color:var(--sub); }
.cash-pair{ flex-grow:1; display:flex; align-items:flex-start; justify-content:space-between; }
.receipt{ width:334px; display:flex; flex-direction:column; filter:drop-shadow(0 1px 0 var(--line)); }
.receipt svg.edge{ display:block; }
.receipt svg.edge.bottom{ transform:scaleY(-1); }
.rc-body{ background:var(--paper); padding:18px 26px 22px; display:flex; flex-direction:column; }
.rc-copy{ display:flex; justify-content:center; }
.rc-copy span{ display:inline-flex; gap:6px; align-items:center; padding:4px 12px; border-radius:999px; background:var(--mint); font-size:12px; font-weight:700; }
.rc-copy span small{ font-size:12px; font-weight:600; letter-spacing:.08em; opacity:.85; }
.rc-copy.company span{ background:var(--ink); color:#fff; }
.rc-brand{ display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:16px; text-align:center; }
.rc-brand img{ width:64px; height:64px; object-fit:contain; display:block; }
.rc-brand b{ margin-top:6px; font-size:15px; font-weight:700; letter-spacing:-.015em; }
.rc-brand small{ font-size:12px; line-height:1.5; color:var(--mute); }
.rc-dash{ border-top:1.5px dashed var(--cut); margin:14px 0; }
.rc-title{ display:flex; flex-direction:column; align-items:center; gap:2px; }
.rc-title h2{ font-size:24px; line-height:1.2; font-weight:800; letter-spacing:.3em; margin-right:-.3em; }
.rc-title small{ font-size:11px; font-weight:700; letter-spacing:.32em; color:var(--mute); margin-right:-.32em; }
.rc-rows{ display:flex; flex-direction:column; gap:4px; }
.rc-row{ display:flex; align-items:baseline; gap:6px; font-size:13px; line-height:22px; }
.rc-row span{ color:var(--mute); white-space:nowrap; }
.rc-row i{ flex-grow:1; border-bottom:1.5px dotted #C4C7CC; transform:translateY(-4px); }
.rc-row b{ font-weight:600; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; max-width:190px; overflow:hidden; text-overflow:ellipsis; }
.rc-amount{ margin-top:16px; padding:12px 0 10px; border-top:3px double var(--ink); border-bottom:3px double var(--ink); }
.rc-amount div{ display:flex; align-items:baseline; justify-content:space-between; }
.rc-amount span{ font-size:14px; font-weight:700; }
.rc-amount b{ font-size:30px; line-height:1.1; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.rc-amount p{ text-align:right; font-size:12px; color:var(--sub); margin-top:2px; }
.rc-confirm{ margin-top:14px; text-align:center; font-size:13px; font-weight:600; color:var(--sub); }
.rc-signs{ display:flex; flex-direction:column; gap:14px; }
.rc-sign{ position:relative; display:flex; flex-direction:column; gap:6px; }
.rc-sign .who{ display:flex; justify-content:space-between; font-size:12px; color:var(--mute); }
.rc-sign .who b{ font-weight:600; color:var(--sub); }
.rc-sign .line{ height:34px; border-bottom:1.5px solid var(--ink); display:flex; align-items:flex-end; justify-content:flex-end; font-size:12px; color:var(--mute); padding-bottom:4px; }
.rc-sign .seal{ position:absolute; right:40px; top:14px; width:40px; height:40px; border-radius:50%; border:1.5px dashed var(--cut); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--mute); }
.rc-date{ display:flex; justify-content:space-between; font-size:12px; color:var(--mute); }
.rc-date span:last-child{ letter-spacing:.04em; }
.rc-thanks{ display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--sub); }
.cut{ flex-grow:1; align-self:stretch; display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0; }
.cut i{ flex-grow:1; border-left:1.5px dashed var(--mute); }
.cut span{ writing-mode:vertical-rl; font-size:11px; font-weight:700; letter-spacing:.2em; color:var(--mute); }

/* 마지막 페이지: 가이드 피켓(A4 가로) — 기존 그대로 유지 */
.sheet.picket-sheet{ width:860px; min-height:0; padding:34px 38px 30px; border-radius:14px; display:block; overflow:visible; }
.picket-bar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
.picket-bar b{ font-size:15px; font-weight:800; }
.picket-bar small{ margin-left:6px; color:var(--picket-mute); font-size:12px; font-weight:600; }
.picket-bar button{ flex:none; background:var(--brand); color:#fff; border:0; border-radius:9px; padding:8px 16px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
.picket-bar button:disabled{ opacity:.45; cursor:default; }
.picket-frame{ aspect-ratio:297/210; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:8px; box-shadow:0 0 0 1px var(--picket-line); color:var(--picket-mute); font-size:13px; font-weight:600; }
.picket-frame img{ display:block; width:100%; height:100%; }

@media print{
  html,body{ background:#fff; }
  .hint{ display:none !important; }
  .sheet{ width:210mm; min-height:296mm; margin:0; box-shadow:none; }
  .sheet + .sheet, .sheet + .cash-page{ page-break-before:always; break-before:page; }
  .cash-page{ width:210mm; height:296mm; margin:0; box-shadow:none; overflow:hidden; page-break-before:always; }
  @page{ size:A4; margin:0; }
  .picket-sheet{ page:picket; width:auto; margin:0; padding:0 !important; page-break-before:always; break-before:page; }
  .picket-bar{ display:none !important; }
  .picket-frame{ width:297mm; height:209.5mm; aspect-ratio:auto; border-radius:0; box-shadow:none; }
}
@page picket{ size:A4 landscape; margin:0; }
</style>
</head>
<body>
<div class="hint" id="printHint">
  <span><b>인쇄하기</b>에서 프린터 또는 <b>PDF로 저장</b>을 선택하세요. 여백은 <b>없음</b>으로, 배경 그래픽은 <b>켜기</b>로 설정하세요. 잔금이 등록된 예약은 현금영수증 2부도 포함됩니다.</span>
  <button onclick="window.print()">인쇄하기</button>
</div>
<div id="root"></div>

<script src="booking.js"></script>
<script src="guide-picket.js"></script>
<script type="module">
/* ══════════ 데이터 로드 ══════════
   출처 1) 예약관리 "📋 가이드 시트" 버튼 → 인쇄 창의 sessionStorage + ?adminPrint=1&id=예약ID
   출처 2) ?id=<요청ID> 직접 접속 → /api/requests/:id (관리자 토큰 필요, 마스킹 없는 원본)
   고객용 /api/my/:token 은 생년월일·연락처가 마스킹되어 가이드 시트에는 쓰지 않는다. */
const P = new URLSearchParams(location.search);
const _adminPrint = P.get("adminPrint") === "1";
const _autoPrint = P.get("print") === "1";
const _id = P.get("id") || "";
const ADMIN_TOKEN = sessionStorage.getItem("leaders_admin_token") || "";
const adminHeaders = ADMIN_TOKEN ? { "x-admin-token": ADMIN_TOKEN } : {};

const REC = await (async () => {
  if (_adminPrint) {
    // 이전 버전에서 이미 열린 인쇄 창은 예약 ID 없는 일회성 키를 사용한다.
    try {
      const storage = _id ? sessionStorage : localStorage;
      const payload = JSON.parse(storage.getItem("leaders_guide_sheet_print") || "null");
      storage.removeItem("leaders_guide_sheet_print");
      if (payload?.booking && (!_id || String(payload.id) === _id)) return payload;
    } catch (e) {}
  }
  if (_id) {
    try {
      const res = await fetch("/api/requests/" + encodeURIComponent(_id), { cache:"no-store", headers:adminHeaders });
      const j = await res.json();
      if (res.ok && j.ok && j.item) return { ...j.item, id:_id };
    } catch (e) {}
  }
  return null;
})();

/* 숙소 리소스 라이브러리 — 배정 숙소의 등급·지역 표시에 사용 (없어도 동작) */
const LODGE_LIB = await (async () => {
  try {
    const r = await fetch("/api/data/lodges", { cache:"no-store", headers:adminHeaders });
    const j = await r.json();
    return (j.ok && j.data) ? j.data : {};
  } catch (e) { return {}; }
})();

/* 차량 리소스 라이브러리 — 예전 배정에 기사 이름·연락처가 없을 때 같은 차종의 등록 기사로 보충 (없어도 동작) */
const VEHICLE_LIB = await (async () => {
  try {
    const r = await fetch("/api/data/vehicles", { cache:"no-store", headers:adminHeaders });
    const j = await r.json();
    return (j.ok && j.data) ? j.data : {};

const flightDate = d => d ? `${fmtDot(d)} (${WD[d.getDay()]})` : "날짜 미입력";

const inDate = parseDate(fl.inDate || REC.depart);

/* 숙소: 1박~(N-1)박. 계획은 일정표(목적지·숙소 종류), 배정 숙소는 배정 목록(assign.lodges) */

});

/* ══════════ 2페이지: 일자별 일정 ══════════ */
const itemLi = t => {
  if (t.startsWith("(")) return `<li class="dim"><span>${esc(t)}</span></li>`;

const tagHtml = raw => {

const dayRow = (d, i) => {

  const isLast = i === days.length - 1;
  const tags = Array.isArray(stay.tags) ? stay.tags.filter(Boolean) : [];
  const move = [noBr(d.move), noBr(d.dist).replace(/^\((.*)\)$/, "$1")].filter(Boolean).join(" · ");
  return `<div class="day">
    <div class="day-n"><i class="${isLast && !stayName ? "end" : ""}">${esc(d.d || i + 1)}</i><b>${mdWd(date)}</b></div>
    <div class="day-main">
      <div class="day-title"><h3>${esc(noBr(d.dest)) || "—"}</h3>${move ? `<span class="chip">${ic("clock", 12)}${esc(move)}</span>` : ""}</div>
      ${items.length ? `<ul class="items">${items.map(itemLi).join("")}</ul>` : `<ul class="items"><li class="dim"><span>일정 미입력</span></li></ul>`}
    </div>
    <div class="day-col"><div class="lbl">숙소</div>${stayHtml ? `${stayHtml}${tags.length ? `<div class="tags">${tags.map(tagHtml).join("")}</div>` : ""}` : `<div class="stay none">숙박 없음</div>`}</div>
    <div class="day-col meals"><div class="lbl">식사</div>${mealHtml("조", meals[0])}${mealHtml("중", meals[1])}${mealHtml("석", meals[2])}</div>
  </div>`;
};

const page2 = days.length ? `
<div class="sheet p2">
  ${head(true)}
  <div class="p2-head">
    <div class="lt"><b>일자별 일정</b><span>${[productName, rangeTxt].filter(Boolean).map(esc).join(" · ")}</span></div>
    ${intensityHtml}
  </div>
  ${memoHtml}
  <div class="days">${days.map(dayRow).join("")}</div>
  ${foot(2)}
</div>` : "";

/* ══════════ 현금영수증 2부 (잔금이 있을 때) ══════════ */
const cash = cashReceiptPayload(REC, BK);
const cashDot = value => { const d = parseDate(value); return d ? fmtDot(d) : (value || "—"); };
const cashPeriod = () => {
  const s = parseDate(cash.depart), e = parseDate(cash.returnDate);
  if (!s) return "—";
  return e ? `${fmtDot(s)} – ${e.getFullYear() === s.getFullYear() ? fmtMd(e) : fmtDot(e)}` : fmtDot(s);
};
const zig = Array.from({ length: 69 }, (_, i) => `L${i * 5} ${i % 2 ? 0 : 10}`).join(" ").replace(/^L/, "M");
const edge = bottom => `<svg class="edge${bottom ? " bottom" : ""}" aria-hidden="true" width="100%" height="10" viewBox="0 0 340 10" preserveAspectRatio="none"><path d="${zig} Z" fill="#F7F8F8"/></svg>`;
const rcRow = (label, value) => `<div class="rc-row"><span>${label}</span><i></i><b title="${esc(value)}">${esc(value)}</b></div>`;
const cashCopy = company => {
  const guideName = [cash.guideName, cash.guideNameEn].filter(Boolean).join(" ") || "—";
  return `<article class="receipt">
    ${edge(false)}
    <div class="rc-body">
      <div class="rc-copy${company ? " company" : ""}"><span>${company ? "회사 보관용<small>COMPANY COPY</small>" : "고객용<small>CUSTOMER COPY</small>"}</span></div>
      <div class="rc-brand"><img src="img/brand/mongolia-milkyway-logo-dark.png" alt="몽골리아 은하수 여행 로고"><b>몽골리아 은하수 여행</b><small>mongoliasky.co.kr<br>+976 8010 7766 · bolor1@hanmail.net</small></div>
      <div class="rc-dash"></div>
      <div class="rc-title"><h2>거래명세서</h2><small>CASH RECEIPT</small></div>
      <div class="rc-dash"></div>
      <div class="rc-rows">
        ${rcRow("영수증 번호", cash.receiptNo)}
        ${rcRow("발행일", cashDot(cash.issueDate))}
        ${rcRow("받은 분", `${cash.customerName || "—"} 님${cash.pax ? ` · ${cash.pax}명` : ""}`)}
        ${rcRow("상품", [cash.productName, packageName].filter(Boolean).join(" "))}
        ${rcRow("투어 기간", cashPeriod())}
        ${rcRow("결제", "현금 (KRW) · 몽골 현지")}
        ${rcRow("적요", cash.description)}
      </div>
      <div class="rc-amount"><div><span>받은 금액</span><b>₩${Number(cash.amount).toLocaleString("ko-KR")}</b></div><p>금 ${koreanAmount(cash.amount)} 원정</p></div>
      <div class="rc-confirm">위 금액을 현금으로 정히 영수합니다.</div>
      <div class="rc-dash"></div>
      <div class="rc-signs">
        <div class="rc-sign"><div class="who"><b>고객 서명</b><span>${esc(cash.customerName || "—")} 님</span></div><div class="line">(서명)</div></div>
        <div class="rc-sign"><div class="who"><b>수령인 · 담당 가이드</b><span>${esc(guideName)}</span></div><div class="line">(서명)</div><div class="seal">인</div></div>
        <div class="rc-date"><span>수령일</span><span>______ 년 ____ 월 ____ 일</span></div>
      </div>
      <div class="rc-dash"></div>
      <div class="rc-thanks"><svg aria-hidden="true" width="120" height="10" viewBox="0 0 120 10"><polyline points="0,10 10,0 20,10 30,0 40,10 50,0 60,10 70,0 80,10 90,0 100,10 110,0 120,10" fill="none" stroke="#079483" stroke-width="2.5" stroke-linejoin="round"/></svg><span>이용해 주셔서 감사합니다 · Thank you</span></div>
    </div>
    ${edge(true)}
  </article>`;
};
const cashPage = Number(cash.amount) > 0 ? `<div class="cash-page"><div class="topbar"></div>
  <div class="cash-top"><span><b>현금영수증 2부</b> · 왼쪽은 고객에게 전달, 오른쪽은 회사 보관</span><span>${esc(cash.receiptNo)}</span></div>
  <div class="cash-pair">${cashCopy(false)}<div class="cut"><i></i><span>절취선 · CUT HERE</span><i></i></div>${cashCopy(true)}</div>
</div>` : "";

/* ══════════ 마지막 페이지: 가이드 피켓 (기존 그대로) ══════════ */
const picketPage = `<div class="sheet picket-sheet"><div class="picket-bar"><b>가이드 피켓<small>A4 가로 · 공항 미팅용</small></b><button type="button" id="picketSave" disabled>🖼 PNG 저장</button></div><div class="picket-frame" id="picketFrame">피켓을 만드는 중…</div></div>`;
root.innerHTML = page1 + page2 + cashPage + picketPage;
/* 가이드 피켓 — 고객 이름·여행 날짜·담당 가이드. 그림은 guide-picket.js(React 화면과 같은 렌더러) */
const picketInput = { customerName: noBr(REC.name || travelers[0]?.name || ""), startDate: fmtFull(departDate), endDate: fmtFull(returnDate || departDate), guideName: noBr(guide.name), guidePhone: noBr(guide.phone) };
const picketReady = (window.GuidePicket ? window.GuidePicket.toDataUrl(picketInput) : Promise.reject(new Error("피켓 도구를 불러오지 못했습니다"))).then(url => {
  const frame = document.getElementById("picketFrame"), img = new Image();
  img.alt = "가이드 피켓"; img.src = url; frame.textContent = ""; frame.appendChild(img);
  const btn = document.getElementById("picketSave"); btn.disabled = false;
  btn.addEventListener("click", () => window.GuidePicket.download(picketInput).catch(e => alert(e.message || "PNG를 만들지 못했습니다")));
}, e => { document.getElementById("picketFrame").textContent = e.message || "피켓을 만들지 못했습니다"; });
document.title = `가이드시트_${(REC.name || "예약").replace(/\s+/g, "")}_${fmtFull(departDate) || ""}`;

if (_autoPrint) {
  const imagesReady = picketReady.then(() => Promise.all([...document.images].map(img => img.complete ? Promise.resolve() : new Promise(resolve => {
    img.addEventListener("load", resolve, { once:true });
    img.addEventListener("error", resolve, { once:true });
  }))));
  imagesReady.then(() => setTimeout(() => window.print(), 150));
}
}
</script>
</body>
</html>
