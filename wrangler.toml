#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages 설정 — 몽골리아 은하수 통합 플랫폼
# (여행상품 사이트 + 맞춤 견적 시스템이 한 프로젝트로 배포됩니다)
name = "inhasu"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./dist"   # `npm run build` 결과물 (견적 정적 페이지 포함)

# D1 — 견적(requests·kv)과 상품·예약 테이블이 같은 데이터베이스를 씁니다.
[[d1_databases]]
binding = "DB"                     # 코드에서 env.DB 로 사용
database_name = "leaders-requests"
database_id = "07a07834-5bde-4980-972b-9742d72f0f82"

# R2 — 견적 쪽 파일 (고객 첨부는 비공개, images/ 만 공개)
[[r2_buckets]]
binding = "FILES"                  # 코드에서 env.FILES 로 사용
bucket_name = "leaders-files"

# R2 — 상품·후기·매거진 이미지 (/api/images/* 로 공개 서빙)
# ⚠ leaders-files 와 반드시 다른 버킷이어야 합니다 (고객 첨부가 공개되지 않도록).
[[r2_buckets]]
binding = "BUCKET"                 # 코드에서 env.BUCKET 으로 사용
bucket_name = "milkyway-assets"

[vars]
ENVIRONMENT = "production"
ADMIN_EMAIL = "arvijixmeat@gmail.com"
