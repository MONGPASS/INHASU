<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몽골리아 은하수 · 모바일 관리자</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231eb496'/%3E%3Cpath d='M20 42 30 24l7 12 5-7 8 13z' fill='white'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
/* ── Seed 디자인 토큰 (몽골리아 은하수 대시보드 디자인) ── */
:root {
  --brand: #1eb496;
  --brand-hover: #35c6ac;
  --brand-active: #189580;
  --brand-deep: #147d68;
  --brand-bg: #e9f8f5;
  --brand-bg2: #f2fbf8;
  --brand-bg3: #eefaf6;
  --g50: #f7f8fa; --g100: #f2f3f6; --g200: #eaebee; --g300: #dcdee3; --g400: #d1d3d8;
  --g500: #adb1ba; --g600: #868b94; --g700: #4d5159; --g800: #393a40; --g900: #212124;
  --red50: #fff3f2; --red100: #ffe5e3; --red200: #fcd2cf; --danger: #fa2314;
  --y50: #fff7e6; --y100: #ffe3ba; --y500: #c27f29; --y800: #6b4717;
  --overlay: #00000080;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --enter: cubic-bezier(0, 0, 0.2, 1);
  --font: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--g100); }
body { font-family: var(--font); color: var(--g900); -webkit-font-smoothing: antialiased; font-size: 14px; }
a { color: var(--brand); text-decoration: none; }
button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }
input, select, textarea { font-size: 14px; color: var(--g900); }
.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes drawerIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ── 앱 프레임 (최대 430px 중앙 정렬) ── */
#app { display: none; flex-direction: column; min-height: 100vh; width: 100%; max-width: 430px; margin: 0 auto; box-shadow: 0 0 0 1px var(--g200); background: var(--g100); }
#app.on { display: flex; }
header.appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--g200); }
.logo { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: #fff; font-size: 13px; font-weight: bold; flex: none; }
.appbar .tit { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.appbar .tit b { font-size: 15px; line-height: 135%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .tit span { font-size: 12px; line-height: 135%; color: var(--g600); }
.iconbtn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: none; background: transparent; color: var(--g700); }
main#main { flex: 1; overflow-y: auto; padding-bottom: 24px; }

/* ── 하단 탭 ── */
nav.tabbar { position: sticky; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--g200); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; height: 56px; border: none; background: transparent; color: var(--g600); font-size: 11px; }
.tabbar button.on { color: var(--brand); font-weight: bold; }
.tabbar .ic { position: relative; display: flex; }
.tabbar .badge { position: absolute; top: -4px; left: 14px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 10px; font-weight: bold; line-height: 16px; text-align: center; }

/* ── 공용 컴포넌트 ── */
.sec { background: #fff; }
.card { border: 1px solid var(--g200); border-radius: 10px; background: #fff; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--g300); background: #fff; color: var(--g700); font-size: 13px; white-space: nowrap; }
.chip.on { border-color: var(--brand); background: var(--brand); color: #fff; font-weight: bold; }
.cta { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border: none; border-radius: 6px; background: var(--brand); color: #fff; font-size: 18px; font-weight: bold; line-height: 135%; transition: transform 100ms var(--ease), background-color 100ms var(--ease); }
.cta:active { background: var(--brand-active); transform: scale(0.97); }
.btn { height: 44px; padding: 0 12px; border: 1px solid var(--g300); border-radius: 6px; background: #fff; font-size: 13px; color: var(--g700); }
.btn.mint { border: none; background: var(--brand); color: #fff; font-weight: bold; }
.btn.mint:active { background: var(--brand-active); }
.btn.line-mint { border: 1px solid var(--brand); color: var(--brand-deep); font-weight: bold; }
.btn.dashed { border: 1px dashed var(--brand); color: var(--brand-deep); }
.btn.danger { border: none; background: var(--red50); color: var(--danger); font-weight: bold; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: var(--brand-bg); font-size: 11px; font-weight: bold; color: var(--brand-deep); }
.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; font-size: 12px; color: var(--g700); }
.f input, .f select { min-width: 0; height: 46px; padding: 0 12px; border: 1px solid var(--g300); border-radius: 10px; background: #fff; }
.f textarea { padding: 12px; border: 1px solid var(--g300); border-radius: 10px; line-height: 160%; resize: vertical; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
.f2 .span2 { grid-column: 1 / -1; }
.f textarea { min-width: 0; }
.searchbox { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border: 1px solid var(--g300); border-radius: 999px; color: var(--g500); }
.searchbox input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--g200); border-radius: 10px; background: #fff; }
.stat .h { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--g700); }
.stat .h .ic { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; background: var(--brand-bg); color: var(--brand); }
.stat .n { display: flex; align-items: baseline; gap: 6px; }
.stat .n b { font-size: 28px; font-weight: bold; line-height: 1; }
.stat .n span { padding: 2px 6px; border-radius: 4px; background: var(--g100); font-size: 11px; color: var(--g700); }
.stat svg { width: 100%; height: 22px; display: block; }

/* 시트 · 오버레이 */
.dim { position: fixed; inset: 0; background: var(--overlay); animation: fadeIn 180ms var(--enter); }
/* left:0/right:0 + auto 마진으로 중앙 정렬 — transform은 sheetUp 키프레임 전용으로 비워 둔다 */
.sheet-b { position: fixed; left: 0; right: 0; margin-left: auto; margin-right: auto; width: 100%; max-width: 430px; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; animation: sheetUp 240ms var(--enter); display: flex; flex-direction: column; }
.sheet-full { position: fixed; left: 0; right: 0; margin-left: auto; margin-right: auto; width: 100%; max-width: 430px; top: 0; bottom: 0; background: #fff; animation: sheetUp 240ms var(--enter); display: flex; flex-direction: column; }
/* 시트가 열린 채로 다시 그려질 때는 등장 애니메이션을 재생하지 않는다 */
#ovl.noanim .dim, #ovl.noanim .sheet-b, #ovl.noanim .sheet-full, #ovl.noanim aside.drawer { animation: none; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 12px 14px 16px; border-bottom: 1px solid var(--g200); background: #fff; }
.sheet-head .t { flex: 1; font-size: 18px; font-weight: bold; min-width: 0; }
.xbtn { flex: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: none; border-radius: 999px; background: var(--g100); color: var(--g700); }
.sheet-body { flex: 1; overflow-y: auto; }
/* flex 세로 컨테이너에서 자식이 overflow:visible이 아니면 자동 최소 높이가 0이 되어
   내용만큼 늘지 않고 찌그러진다. 스크롤은 .sheet-body가 담당하므로 자식은 줄지 않게 고정. */
.sheet-body > * { flex-shrink: 0; }
.sheet-foot { flex: none; padding: 10px 12px 14px; border-top: 1px solid var(--g200); background: #fff; }

/* 문의 카드 */
.inq-card { display: flex; flex-direction: column; gap: 10px; margin: 0 12px 10px; padding: 14px; border: 1px solid var(--g200); border-radius: 12px; background: #fff; cursor: pointer; }
.inq-card .r1 { display: flex; align-items: center; gap: 8px; }
.inq-card .r1 b { font-size: 16px; line-height: 135%; }
.inq-card .r1 .ph { font-size: 12px; color: var(--g500); }
.inq-card .r2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.inq-card .r2 b { flex: none; font-size: 14px; }
.inq-card .r2 .rest { flex: 1; min-width: 0; font-size: 12px; color: var(--g600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inq-card .r3 { display: flex; align-items: center; gap: 6px; }
.tagchip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border: 1px solid var(--g200); border-radius: 8px; font-size: 11px; color: var(--g700); }
.stbadge { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: bold; }
.stbadge .dot { width: 5px; height: 5px; border-radius: 999px; }
.st-신규 { background: #e8f3ff; color: #1b64da; } .st-신규 .dot { background: #1b64da; }
.st-진행중 { background: var(--brand-bg); color: var(--brand-deep); } .st-진행중 .dot { background: var(--brand); }
.st-예약확정 { background: #eef2ff; color: #4338ca; } .st-예약확정 .dot { background: #4338ca; }
.st-완료 { background: var(--g100); color: var(--g700); } .st-완료 .dot { background: var(--g500); }
.st-보류 { background: var(--y50); color: var(--y800); } .st-보류 .dot { background: var(--y500); }

/* 알림 행 */
.alert-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: none; border-top: 1px solid var(--g200); background: #fff; text-align: left; }
.alert-row:active { background: var(--g50); }
.alert-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.alert-row .tx b { font-size: 14px; line-height: 140%; color: var(--g900); }
.alert-row .tx span { font-size: 12px; line-height: 145%; color: var(--g600); }
.alert-row .go { flex: none; display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: bold; color: var(--brand); }

/* 예약 카드 */
.bk-head { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 14px 16px; border: none; background: #fff; text-align: left; }
.bk-head.open { background: var(--brand-bg2); }
.bk-head .l1 { display: flex; align-items: center; gap: 8px; width: 100%; }
.bk-head .l1 .nm { font-size: 17px; font-weight: bold; }
.bk-head.open .l1 .nm { color: var(--brand-deep); }
.bk-head .l2 { display: flex; align-items: center; gap: 8px; width: 100%; }
.bk-head .l2 .pv { flex: 1; min-width: 0; font-size: 12px; color: var(--g600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cardtab { flex: 1; min-width: 0; height: 40px; border-radius: 8px; border: 1px solid var(--g200); background: #fff; font-size: 13px; color: var(--g600); }
.cardtab.on { border-color: var(--brand); background: var(--brand-bg3); font-weight: bold; color: var(--brand-deep); }
.pbar { display: block; height: 8px; border-radius: 999px; background: var(--g200); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 999px; }
.mini-chip { display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; height: 38px; border: 1px solid var(--g200); border-radius: 8px; font-size: 11px; color: var(--g700); }

/* 서랍 */
aside.drawer { position: fixed; left: 50%; margin-left: -215px; top: 0; bottom: 0; width: 300px; z-index: 60; display: flex; flex-direction: column; background: #fff; animation: drawerIn 220ms var(--enter); }
@media (max-width: 430px) { aside.drawer { left: 0; margin-left: 0; } }
.drawer nav { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.drawer nav button { display: flex; align-items: center; gap: 12px; width: 100%; height: 50px; padding: 0 16px; border: none; border-radius: 10px; background: transparent; color: var(--g700); font-size: 15px; font-weight: bold; text-align: left; }
.drawer nav button.on { background: var(--brand); color: #fff; }
.drawer .foot { flex: none; padding: 12px 10px 16px; border-top: 1px solid var(--g200); display: flex; flex-direction: column; gap: 2px; }
.drawer .foot button { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px; border: none; border-radius: 10px; background: transparent; font-size: 14px; color: var(--g700); text-align: left; }

/* 로그인 */
#login { display: none; min-height: 100vh; max-width: 430px; margin: 0 auto; box-shadow: 0 0 0 1px var(--g200); background: var(--g100); flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 0; }
#login.on { display: flex; }
.login-card { width: 100%; display: flex; flex-direction: column; gap: 14px; padding: 28px 22px; border-radius: 16px; background: #fff; border: 1px solid var(--g200); }

/* 타임라인 */
.tl-dot { flex: none; margin-top: 4px; width: 10px; height: 10px; border-radius: 999px; box-sizing: border-box; }
.tl-key { background: var(--g900); border: 1.5px solid var(--g900); }
.tl-done { background: var(--g500); border: 1.5px solid var(--g500); }
.tl-auto { background: transparent; border: 1.5px solid var(--g300); }

/* 배정 화면 */
.asec { padding: 16px; border-radius: 12px; background: #fff; }
.abadge { padding: 4px 8px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 11px; font-weight: bold; }
.abadge.gray { background: var(--g100); color: var(--g700); }
.step-dot { flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; font-size: 13px; font-weight: bold; background: var(--brand); color: #fff; }
.step-dot.todo { background: #fff; border: 1.5px solid var(--g300); color: var(--g500); }
.ready-cell { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; background: var(--brand-bg); }
.ready-cell .l { font-size: 11px; color: var(--g600); }
.ready-cell .v { font-size: 17px; font-weight: bold; }
/* min-width:0 이 없으면 input의 기본 폭(size=20 ≈ 200px)이 그리드 열을 밀어내 가로 스크롤이 생긴다 */
.mini-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 11px; color: var(--g600); }
.mini-f input, .mini-f select { min-width: 0; height: 42px; padding: 0 10px; border: 1px solid var(--g300); border-radius: 6px; background: #fff; font-size: 13px; }
.mini-f textarea { min-width: 0; padding: 10px; border: 1px solid var(--g300); border-radius: 6px; font-size: 13px; line-height: 155%; resize: vertical; }
.daycard { border: 1px solid var(--g200); border-radius: 10px; overflow: hidden; }
.daycard .dh { display: flex; align-items: center; gap: 8px; padding: 12px; background: var(--brand-bg); }
.daycard .db { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.dtag { padding: 3px 8px; border-radius: 6px; background: var(--brand); color: #fff; font-size: 11px; font-weight: bold; flex: none; }
.spot-btn { position: relative; display: flex; align-items: flex-start; gap: 8px; min-width: 0; padding: 12px 34px 12px 12px; border-radius: 10px; border: 1px solid var(--g200); background: #fff; text-align: left; }
.spot-btn.on { border-color: var(--brand); background: var(--brand-bg3); }
.spot-btn .box { flex: none; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-top: 1px; border-radius: 5px; font-size: 12px; color: #fff; background: #fff; border: 1.5px solid var(--g300); }
.spot-btn.on .box { background: var(--brand); border: none; }
.spot-btn .ord { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); display: none; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 11px; font-weight: bold; }
.spot-btn.on .ord { display: flex; }
.res-pick { display: flex; gap: 10px; padding: 12px; border-radius: 8px; background: var(--g50); }
.res-pick .thumb { flex: none; width: 40px; height: 40px; border-radius: 8px; background: var(--g200); background-size: cover; background-position: center; }

/* 견적 편집기 */
.qstep-chip { flex: none; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--g300); background: #fff; color: var(--g600); font-size: 12px; white-space: nowrap; }
.qstep-chip.cur { border-color: var(--brand); background: var(--brand-bg); color: var(--brand-deep); font-weight: bold; }
.qstep-chip.done { color: var(--brand-deep); }
.qstep-chip .num { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; font-size: 11px; font-weight: bold; background: var(--g200); color: var(--g600); }
.qstep-chip.cur .num, .qstep-chip.done .num { background: var(--brand); color: #fff; }
.qbar { flex: 1; height: 3px; border-radius: 999px; background: var(--g200); }
.qbar.on { background: var(--brand); }
.course-btn { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; padding: 14px 12px; border: 1px solid var(--g200); border-radius: 12px; background: #fff; text-align: left; }
.course-btn.on { border-color: var(--brand); background: var(--brand-bg2); }
.course-btn .mk { position: absolute; top: 10px; right: 10px; display: none; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 11px; font-weight: bold; }
.course-btn.on .mk { display: flex; }
.baltable { border: 1px solid var(--g200); border-radius: 10px; overflow: hidden; }
.baltable .hd, .baltable .rw { display: grid; grid-template-columns: 64px 1fr 1fr 34px; align-items: center; }
.baltable .hd { background: var(--g50); font-size: 12px; font-weight: bold; color: var(--g700); }
.baltable .hd span, .baltable .rw span { padding: 10px 6px; text-align: center; font-size: 13px; }
.baltable .rw { border-top: 1px solid var(--g200); }
.baltable .rw.cur { background: var(--brand-bg2); }

/* 리소스 카드 */
.res-card { display: flex; flex-direction: column; min-width: 0; border-radius: 10px; background: #fff; overflow: hidden; border: 1px solid var(--g200); text-align: left; padding: 0; }
.res-card .img { position: relative; flex: none; height: 140px; background: var(--g100); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: var(--g400); }
.res-card .img .bdg { position: absolute; top: 8px; left: 8px; max-width: calc(100% - 16px); padding: 3px 7px; border-radius: 6px; background: rgba(255,255,255,0.92); font-size: 10px; font-weight: bold; color: var(--brand-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-card .bd { display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 12px; }
.res-card .bd .nm { font-size: 13px; line-height: 140%; color: var(--g900); font-weight: bold; }
.res-card .bd .dc { font-size: 11px; line-height: 140%; color: var(--g600); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.res-card .bd .kd { font-size: 10px; font-weight: bold; color: var(--brand); }

/* 토스트 */
#toast { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); z-index: 99; max-width: 86vw; padding: 11px 18px; border-radius: 999px; background: rgba(33,33,36,0.92); color: #fff; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 200ms; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.on { opacity: 1; }
.empty { margin: 0; padding: 40px 16px; text-align: center; font-size: 13px; color: var(--g600); }

/* 확인·입력 다이얼로그 (브라우저 기본 confirm/prompt 대체) */

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   몽골리아 은하수 · 모바일 관리자 (admin-mobile.html)
   - 디자인: Claude Design "몽골리아 은하수 대시보드 (모바일)"
   - 데이터: /api/requests (D1) · /api/data/:key (콘텐츠 라이브러리)
   - 인증: sessionStorage["leaders_admin_token"] → x-admin-token 헤더
   ═══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const noBr = s => String(s || "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]*>/g, "");
const won = n => (Number(n) || 0).toLocaleString("ko-KR") + "원";
const dateOnly = iso => String(iso || "").slice(0, 10);
const dotDate = iso => dateOnly(iso).replace(/-/g, ".");
const mmdd = iso => dateOnly(iso).slice(5).replace("-", ".");
const hhmm = iso => { const d = new Date(iso); return isNaN(d) ? "" : String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const korDate = iso => { const [y,m,d] = dateOnly(iso).split("-"); return y ? `${y}년 ${Number(m)}월 ${Number(d)}일` : ""; };
const fmtDot = d => `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,"0")}. ${String(d.getDate()).padStart(2,"0")}`;
const nightsBetween = (a, b) => { if (!a || !b) return 0; const n = Math.round((new Date(b) - new Date(a)) / 86400000); return n > 0 ? n : 0; };
const clone = o => JSON.parse(JSON.stringify(o));
let toastTimer = null;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2600); }

/* ── 확인·입력 다이얼로그 ──
   브라우저 기본 confirm/prompt는 주소가 그대로 노출되고 앱 디자인과 겉돌아
   같은 역할의 모달로 대체합니다. 비동기이므로 호출부는 await로 받습니다. */
let DIALOG = null;
function appConfirm(message, opts) {
  const o = opts || {};
  return new Promise(resolve => {
    DIALOG = { kind: "confirm", message: String(message || ""), title: o.title || "", ok: o.ok || "확인", cancel: o.cancel || "취소", danger: !!o.danger, resolve };
    renderDialog();
  });
}
function appPrompt(message, opts) {
  const o = opts || {};
  return new Promise(resolve => {
    DIALOG = { kind: "prompt", message: String(message || ""), title: o.title || "", ok: o.ok || "확인", cancel: o.cancel || "취소", value: o.value || "", placeholder: o.placeholder || "", resolve };
    renderDialog();
  });
}
function renderDialog() {
  const host = $("dlg"), d = DIALOG;
  if (!d) { host.innerHTML = ""; return; }
  const okClass = d.danger ? "btn danger" : "btn mint";
  host.innerHTML = `
  <div class="wrap" onclick="if(event.target===this) App.dlgAnswer(0)">
    <div class="box" role="dialog" aria-modal="true">
      ${d.title ? `<span class="t">${esc(d.title)}</span>` : ""}
      <span class="m">${esc(d.message)}</span>
      ${d.kind === "prompt" ? `<input id="dlgInput" value="${esc(d.value)}" placeholder="${esc(d.placeholder)}" onkeydown="if(event.key==='Enter'){event.preventDefault();App.dlgAnswer(1);}">` : ""}
      <div class="btns">
        <button type="button" class="btn" onclick="App.dlgAnswer(0)">${esc(d.cancel)}</button>
        <button type="button" class="${okClass}" onclick="App.dlgAnswer(1)">${esc(d.ok)}</button>
      </div>
    </div>
  </div>`;
  if (d.kind === "prompt") { const i = $("dlgInput"); if (i) { i.focus(); i.select(); } }
}
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type }); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copyText(text) { try { await navigator.clipboard.writeText(text); return true; } catch (e) { try { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return true; } catch (e2) { return false; } } }

/* ── 아이콘 (Seed 아이콘 대응 인라인 SVG) ── */
const ICON_PATHS = {

  list: '<path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><circle cx="4.4" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.4" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.4" cy="18" r="1.1" fill="currentColor" stroke="none"/>',
  list_card: '<rect x="3.5" y="4" width="17" height="7" rx="1.6"/><rect x="3.5" y="14.4" width="7.4" height="6" rx="1.4"/><rect x="13.6" y="14.4" width="6.9" height="6" rx="1.4"/>',
  list_check: '<path d="M10.5 6.5h10M10.5 12h10M10.5 17.5h10"/><path d="M3 6.2l1.6 1.6 2.7-2.9M3 11.7l1.6 1.6 2.7-2.9M3 17.2l1.6 1.6 2.7-2.9"/>',
  more_horiz: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.6h17M8 3v4M16 3v4"/>',
  home: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
  notification: '<path d="M6 16v-5.5a6 6 0 1 1 12 0V16l1.6 2.4H4.4z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/>',
  photo: '<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="M4.5 17.5l5-4.5 3.5 3 3-2.5 3.5 3.5"/>',
  edit: '<path d="M4 20h4l11-11-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  trash: '<path d="M4.5 6.5h15M9.5 6V4.5h5V6M6.5 6.5l1 13.5h9l1-13.5M10 10.5v6M14 10.5v6"/>',
};
const icon = (name, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ""}</svg>`;

/* ── 서버 API ── */
const STATUSES = ["신규", "진행중", "예약확정", "완료", "보류"];
let ADMIN_TOKEN = sessionStorage.getItem("leaders_admin_token") || "";
let RECORDS = [];
let LOADED = false;
const recById = id => RECORDS.find(r => r.id === id) || null;

function authHeaders(extra) { return Object.assign({ "x-admin-token": ADMIN_TOKEN }, extra || {}); }
function logout() {
  sessionStorage.removeItem("leaders_admin_token"); ADMIN_TOKEN = "";
  location.reload();
}
async function apiList() {
  const res = await fetch("/api/requests", { headers: authHeaders() });
  if (res.status === 401) { logout(); throw new Error("unauthorized"); }
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "load failed");
  return j.items || [];
}
async function apiPatch(id, body) {
  const res = await fetch("/api/requests/" + encodeURIComponent(id), {
    method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body),
  });
  if (res.status === 401) { logout(); throw new Error("unauthorized"); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok || !j.ok) { const e = new Error(j.error || "http " + res.status); e.code = j.code; e.detail = j; throw e; }
  return j;
}
async function apiDelete(id) {
  const res = await fetch("/api/requests/" + encodeURIComponent(id), { method: "DELETE", headers: authHeaders() });
  const j = await res.json().catch(() => ({}));
  if (!res.ok || !j.ok) throw new Error(j.error || "http " + res.status);
  return j;
}
async function apiPost(body) {
  const res = await fetch("/api/requests", {
    method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body),
  });
  const j = await res.json().catch(() => ({}));
  if (!j.ok) throw new Error(j.error || "save failed");
  return j;
}
/* 레코드 갱신 도우미: PATCH 응답의 파생 필드를 로컬에도 반영 */
function applyPatchLocal(rec, patch, resp) {
  Object.keys(patch).forEach(k => {
    if (["notifyQuote","silentQuote","rotateCustomerLink","notifyTravelers","notifyDeposit","notifyContract","confirmDeposit","notifyTravelNotice","resetContract"].includes(k)) return;
    rec[k] = patch[k];
  });
  if (resp) {
    if (resp.status) rec.status = resp.status;
    if (resp.token) rec.token = resp.token;
    if (resp.quoteExpiresAt) rec.quoteExpiresAt = resp.quoteExpiresAt;
    if (resp.activities) rec.activities = resp.activities;
    if (rec.booking) {
      if (resp.travelerSubmission) rec.booking.travelerSubmission = resp.travelerSubmission;
      if (resp.depositRequest) rec.booking.depositRequest = resp.depositRequest;
      if (resp.contractRequest) rec.booking.contractRequest = resp.contractRequest;
      if (resp.publishStatus) rec.booking.publishStatus = resp.publishStatus;
      if (resp.preparedAt) rec.booking.preparedAt = resp.preparedAt;
    }
  }
}

/* ── 도메인 로직 (admin.html · 예약관리.html에서 이식) ── */
const isSigned = r => !!(r.booking && r.booking.contract && r.booking.contract.signedAt);
const isAccepted = r => !!(r.decision && r.decision.status === "accepted");
const paxTotal = r => (Number(r.adult) || 0) + (Number(r.child) || 0) + (Number(r.infant) || 0);
const isReservation = r => (r.status === "예약확정") || !!r.booking;

function nextAction(r) {
  const accepted = isAccepted(r);
  if (accepted && !r.booking) return { label: "예약 진행 요청", detail: "고객이 견적을 수락했습니다 · 예약관리를 시작하세요" };
  if (!r.booking) return null;
  const b = r.booking, ci = b.contractInfo || {}, paid = ci.depositStatus === "입금완료";
  const signed = !!(b.contract && b.contract.signedAt), confirmed = r.status === "예약확정";
  if (!paid && !(b.depositRequest && b.depositRequest.status === "requested")) return { label: "예약금 안내 필요", detail: "예약정보를 확인하고 예약금 안내를 보내세요" };
  if (!paid && b.depositReport && b.depositReport.status === "reported") return { label: "입금 신고 확인", detail: `고객이 입금 완료를 알렸습니다 (입금자명 ${b.depositReport.name || "-"}) · 입금 확인을 누르면 계약서·여행자 정보 요청까지 자동 진행됩니다` };
  if (!paid) return { label: "예약금 입금 대기", detail: "고객이 카톡으로 입금을 알리면 입금 확인을 누르세요" };
  if (!signed && !(b.contractRequest && b.contractRequest.status === "requested")) return { label: "계약서 요청 필요", detail: "예약금 확인 완료 · 고객에게 서명을 요청하세요" };
  if (!signed) return { label: "계약서 서명 대기", detail: "고객에게 서명 요청을 보냈습니다" };
  if (!confirmed) return { label: "예약 확정 필요", detail: "고객 서명 완료 · 내용을 확인하고 예약을 확정하세요" };
  if (b.publishStatus !== "published") return { label: "일정표 공개 준비", detail: "배정을 완료한 뒤 확정 일정표를 공개하세요" };
  return null;
}

function customerTimeline(r) {
  const ev = [];
  const b = r.booking || {};
  const acts = Array.isArray(r.activities) ? r.activities : [];
  if (r.receivedAt) ev.push({ at: r.receivedAt, who: "고객", label: "견적 문의 접수" });
  const quoteSent = r.quoteIssuedAt || (r.notify && r.notify.quoteSentAt);
  if (r.quote && quoteSent) ev.push({ at: quoteSent, who: "관리자", label: "견적서 발행" });
  acts.filter(a => a && ["quote_notification_queued", "quote_notification_skipped", "itinerary_notification_queued", "itinerary_notification_skipped"].includes(a.type))
    .forEach(a => {
      const labels = {
        quote_notification_queued: "💬 견적 확인 알림톡 발송 요청",
        quote_notification_skipped: "⚠ 견적 알림톡 미발송 · 설정/전화번호 확인",
        itinerary_notification_queued: "💬 확정일정표 확인 알림톡 발송 요청",
        itinerary_notification_skipped: "⚠ 일정표 알림톡 미발송 · 설정/전화번호 확인",
      };
      ev.push({ at: a.at, who: "자동", label: labels[a.type] });
    });
  if (r.decision && r.decision.status === "accepted" && r.decision.acceptedAt) {
    ev.push(r.decision.source === "customer"
      ? { at: r.decision.acceptedAt, who: "고객", label: "🔔 '이 견적으로 예약 진행하기' 클릭" }
      : { at: r.decision.acceptedAt, who: "관리자", label: "전화·카톡 수락 기록" });
  }
  if (b.depositRequest && b.depositRequest.status === "requested" && b.depositRequest.requestedAt)
    ev.push({ at: b.depositRequest.requestedAt, who: "자동", label: "예약금·입금 계좌 안내 표시" });
  if (b.depositReport && b.depositReport.status === "reported" && b.depositReport.reportedAt)
    ev.push({ at: b.depositReport.reportedAt, who: "고객", label: `💳 입금 완료 신고 (입금자명 ${b.depositReport.name || "-"})` });
  const paidAct = acts.filter(a => a && a.type === "payment_changed" && /예약금.*입금완료/.test(a.detail || "")).pop();
  if (paidAct) ev.push({ at: paidAct.at, who: "관리자", label: "예약금 입금 확인" });
  if (b.contractRequest && b.contractRequest.status === "requested" && b.contractRequest.requestedAt)
    ev.push({ at: b.contractRequest.requestedAt, who: "자동", label: "계약서 서명·여행자 정보 요청 발송" });
  if (b.contract && b.contract.signedAt) ev.push({ at: b.contract.signedAt, who: "고객", label: "✍ 계약서 서명 완료" });
  if (b.travelerSubmission && b.travelerSubmission.submittedAt)
    ev.push({ at: b.travelerSubmission.submittedAt, who: "고객", label: `👥 여행자 정보 제출 (${b.travelerSubmission.submittedCount || 0}명)` });
  (Array.isArray(r.changeRequests) ? r.changeRequests : []).forEach(x => {
    const at = x && (x.at || x.requestedAt);
    if (at) ev.push({ at, who: "고객", label: `일정 변경 요청 (${(x.categories || []).join(", ") || "내용 확인"})${x.status === "resolved" ? " · 처리됨" : ""}` });
  });
  if (b.confirmedAt) ev.push({ at: b.confirmedAt, who: "관리자", label: "✓ 예약 확정" });
  if (b.publishedAt) ev.push({ at: b.publishedAt, who: "관리자", label: "🎫 확정 일정표 공개" });
  return ev.filter(e => e.at && !isNaN(new Date(e.at))).sort((a, b2) => new Date(a.at) - new Date(b2.at));
}

/* 배정 현황 — 예약관리.html assignStats() 이식 */
function assignStats(bk) {
  const a = (bk && bk.assign) || {};
  const days = (bk && bk.days) || [];
  const guideOk = !!(a.guide && a.guide.name);
  const vehicleOk = !!(a.vehicle && a.vehicle.model);
  const lodgeCount = (a.lodges || []).filter(l => l && l.name).length;

  const lodgeOk = lodgeNeeded > 0 ? lodgeCount >= lodgeNeeded : lodgeCount > 0;
  const done = (guideOk ? 1 : 0) + (vehicleOk ? 1 : 0) + (lodgeOk ? 1 : 0);
  return { guideOk, vehicleOk, lodgeCount, lodgeNeeded, lodgeOk, done, total: 3, progress: done / 3 };
}
function missingList(r, bk) {

  if (!(bk.contract && bk.contract.signedAt)) miss.push("계약 미서명");

function workflowSteps(r, bk) {
  const accepted = isAccepted(r);

  const paid = ci.depositStatus === "입금완료";
  const signed = !!(bk.contract && bk.contract.signedAt);
  const confirmed = r.status === "예약확정";
  const published = bk.publishStatus === "published";
  const active = published ? 5 : !accepted ? 1 : !paid ? 2 : !signed ? 3 : !confirmed ? 4 : 5;
  const steps = [
    { label: "고객 수락", sub: accepted ? "완료" : "대기" },
    { label: "예약금", sub: paid ? "입금완료" : (bk.depositRequest && bk.depositRequest.status === "requested" ? "안내 발송됨" : "미입금") },
    { label: "계약서", sub: signed ? "서명완료" : (bk.contractRequest && bk.contractRequest.status === "requested" ? "서명 대기" : "요청 전") },
    { label: "예약 확정", sub: confirmed ? "확정됨" : "확정 전" },
    { label: "일정표", sub: published ? "공개됨" : "배정 필요" },
  ].map((s, i) => ({ ...s, state: i + 1 < active ? "done" : i + 1 === active ? "current" : "todo" }));

function sparkline(vals, color) {
  if (!vals.length) vals = [0, 0];
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const w = 100, h = 24, pad = 2;
  const pts = vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
    return `${Math.round(x * 10) / 10},${Math.round(y * 10) / 10}`;
  }).join(" ");

function weeklySeries(filterFn, weeks = 9, cumulative = false) {
  const now = Date.now(), WK = 7 * 86400000;
  const buckets = Array(weeks).fill(0);
  RECORDS.forEach(r => {
    if (filterFn && !filterFn(r)) return;
    const t = new Date(r.receivedAt).getTime(); if (isNaN(t)) return;
    const idx = weeks - 1 - Math.floor((now - t) / WK);
    if (idx >= 0 && idx < weeks) buckets[idx]++;
  });
  if (!cumulative) return buckets;
  let acc = RECORDS.filter(r => { if (filterFn && !filterFn(r)) return false; const t = new Date(r.receivedAt).getTime(); return !isNaN(t) && (now - t) / WK >= weeks; }).length;
  return buckets.map(v => (acc += v));
}

function timelineSheet(r) {

<script>
/* ═══ 예약 관리 탭 ═══ */
function bookingRecords() { return RECORDS.filter(isReservation); }
function departIn14(r) {
  if (!r.depart) return false;
  const d = Math.ceil((new Date(r.depart) - new Date(todayISO())) / 86400000);
  return d >= 0 && d <= 14;
}
function ddayOf(r) {
  if (!r.depart) return "";
  const d = Math.ceil((new Date(r.depart) - new Date(todayISO())) / 86400000);
  return d >= 0 && d <= 14 ? "D-" + (d === 0 ? "DAY" : d) : "";
}
function bkTags(r) {
  const bk = r.booking ? normBooking(r.booking) : blankBooking();
  const tags = [];
  if (!(bk.contract && bk.contract.signedAt)) tags.push("계약미서명");
  if (assignStats(bk).done < 3) tags.push("배정미완료");
  if (departIn14(r)) tags.push("출발임박");
  return tags;
}
function viewBooking() {
  const all = bookingRecords();
  const stats = {
    confirmed: all.filter(r => r.status === "예약확정").length,
    unsigned: all.filter(r => r.booking && !isSigned(r)).length,
    unassigned: all.filter(r => assignStats(normBooking(r.booking || {})).done < 3).length,
    soon: all.filter(departIn14).length,
  };
  const counts = { 전체: all.length, 계약미서명: all.filter(r => bkTags(r).includes("계약미서명")).length, 배정미완료: all.filter(r => bkTags(r).includes("배정미완료")).length, 출발임박: stats.soon };
  const chips = Object.entries(counts).map(([k, n]) => `<button type="button" class="chip ${S.bookingFilter === k ? "on" : ""}" onclick="App.setBkFilter('${k}')">${k} ${n}</button>`).join("");
  const year = new Date().getFullYear();
  const monthCounts = {};
  all.forEach(r => { const ym = dateOnly(r.depart).slice(0, 7); if (ym) monthCounts[ym] = (monthCounts[ym] || 0) + 1; });
  const months = Array.from({ length: 12 }, (_, i) => {
    const ym = year + "-" + String(i + 1).padStart(2, "0");
    const n = monthCounts[ym] || 0;
    const on = S.monthFilter === ym;
    return `<button type="button" style="flex:none; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:60px; padding:8px 12px; border-radius:8px; border:1px solid ${on ? "var(--brand)" : n ? "var(--g300)" : "var(--g200)"}; background:${on ? "var(--brand-bg)" : n ? "#fff" : "var(--g50)"}; color:${n ? "var(--g900)" : "var(--g500)"};" onclick="App.setBkMonth('${ym}')">
      <span style="font-size:13px; font-weight:bold;">${i + 1}월</span><span style="font-size:11px; opacity:.75;">${n ? n + "건" : "-"}</span>
    </button>`;
  }).join("");
  const q = S.bookingQuery.trim();
  const rows = all.filter(r => {
    if (S.bookingFilter !== "전체" && !bkTags(r).includes(S.bookingFilter)) return false;
    if (S.monthFilter && dateOnly(r.depart).slice(0, 7) !== S.monthFilter) return false;
    if (q) {
      const bk = r.booking || {};
      const hay = [r.name, r.destination, r.depart, r.return_, (bk.assign && bk.assign.vehicle && bk.assign.vehicle.model) || "", ((bk.assign && bk.assign.lodges) || []).map(l => l.name).join(" ")].join(" ");
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => String(a.depart || "9999").localeCompare(String(b.depart || "9999")));
  return `

function openAssign(id) {
  const r = recById(id); if (!r) return;
  let bk;
  if (r.booking) bk = normBooking(clone(r.booking));
  else { bk = normBooking(seedBookingFromQuote(clone(r))); }
  if (!bk.flight.inDate && r.depart) bk.flight.inDate = r.depart;
  if (!bk.flight.outDate && r.return_) bk.flight.outDate = r.return_;
  ASSIGN = { id, bk, dirty: false };
  S.assign = id; S.assignSection = "진행";
  renderOverlays();
}
App.openAssign = openAssign;
App.closeAssign = async () => {
  if (ASSIGN && ASSIGN.dirty && !await appConfirm("저장하지 않은 변경이 있어요. 닫을까요?", { ok: "닫기", danger: true })) return;
  ASSIGN = null; S.assign = null; renderOverlays(); renderMain();
};
App.assignSection = s => { S.assignSection = s; renderOverlays(); };

/* 경로 기반 값 쓰기: data-bk="assign.guide.phone" */
function bkSetPath(path, value) {
  if (!ASSIGN) return;
  const seg = path.split(".");
  let o = ASSIGN.bk;
  for (let i = 0; i < seg.length - 1; i++) {
    const k = /^\d+$/.test(seg[i]) ? Number(seg[i]) : seg[i];
    if (o[k] == null) o[k] = /^\d+$/.test(seg[i + 1]) ? [] : {};
    o = o[k];
  }
  const last = seg[seg.length - 1];
  o[/^\d+$/.test(last) ? Number(last) : last] = value;
  ASSIGN.dirty = true;
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el && el.dataset && el.dataset.bk) {
    let v = el.value;
    if (el.dataset.num != null) v = Number(String(v).replace(/[^0-9.-]/g, "")) || 0;
    bkSetPath(el.dataset.bk, v);
  }
});

function qeTotal() {

App.qeSave = async share => {
  if (!QE) return;
  if (!QE.customer.trim() && !QE.shareAnon) { toast("먼저 고객명을 입력하세요"); QE.step = 0; renderOverlays(); return; }
  if (QE.shareAnon && !QE.customer.trim()) QE.customer = "여행 고객";
  if (share && !await appConfirm("이 견적을 고객에게 보낼까요?\n고객에게 견적서 도착 알림톡이 발송되고, 보낼 링크가 만들어집니다.", { ok: "보내기" })) return;
  const q = qeBuild();
  try {
    let token = QE.reqToken, quoteNotification = null;
    if (QE.reqId && QE.reqToken) {
      const patch = share ? { quote: q, notifyQuote: true } : { quote: q, silentQuote: true };
      const totalNow = QE.pax || 0;
      if (totalNow > 0) {
        const o = QE.pax0 || {};
        const origTotal = (o.adult || 0) + (o.child || 0) + (o.infant || 0);
        Object.assign(patch, origTotal === totalNow ? { adult: o.adult || 0, child: o.child || 0, infant: o.infant || 0 } : { adult: totalNow, child: 0, infant: 0 });
      }
      const nN = nightsBetween(QE.depart, QE.return_);
      if (QE.depart && QE.return_) { patch.depart = QE.depart; patch.return_ = QE.return_; patch.nights = nN > 0 ? nN : null; }
      if (QE.destination) patch.destination = QE.destination;
      const tel = QE.phone.replace(/[^0-9]/g, "");
      if (tel) patch.phone = tel;
      const j = await apiPatch(QE.reqId, patch);
      const r = recById(QE.reqId);
      if (r) { applyPatchLocal(r, patch, j); r.quote = q; if (!r.quoteIssuedAt) r.quoteIssuedAt = new Date().toISOString(); }
      quoteNotification = (j.notifications || []).find(x => x.type === "quote") || null;
    } else {
      const nN = nightsBetween(QE.depart, QE.return_);
      const j = await apiPost({
        status: "진행중",
        name: QE.customer.trim(), phone: QE.phone.replace(/[^0-9]/g, ""),
        destination: QE.destination || "",
        depart: QE.depart || "", return_: QE.return_ || "",
        nights: nN > 0 ? nN : null,
        adult: QE.pax || 0, child: 0, infant: 0,
        receivedAt: new Date().toISOString(),
        source: QE.shareAnon ? "course-share" : "walkin", quote: q,
        silentQuote: !share,
      });
      quoteNotification = (j.notifications || []).find(x => x.type === "quote") || null;
      token = j.token || "";
      QE.reqId = j.id || QE.reqId; QE.reqToken = token;
      try { RECORDS = await apiList(); } catch (e) {}
    }
    if (!share) { toast("✓ 저장했어요 — 고객에게는 아직 보내지 않았어요"); renderTabbar(); return; }
    const link = location.origin + "/" + encodeURI("내견적.html") + "?t=" + token;
    await copyText(link);
    toast(quoteNotification && quoteNotification.status === "queued" ? "✓ 고객에게 보냈어요 · 알림톡 발송을 요청했어요" : "✓ 링크가 복사됐어요 (알림톡 설정·전화번호 확인)");
    renderTabbar();
  } catch (e) { toast("⚠ 저장 실패: " + (e.message || "서버 연결을 확인하세요")); }
};

function qeStep5() {

<script>
/* ═══ 관리 페이지 (코스·일정·명소·리소스) ═══ */
const PGS = {
  courseQuery: "", courseFilter: { days: "전체 일정", region: "전체 여행지" }, courseEdit: null,
  snipCat: "전체", planForm: null,
  spotCat: "전체", spotForm: null,
  resTab: "guides", resForm: null,
};
const PAGE_TITLES = { course: "코스 관리", plan: "일정 관리", spot: "명소 관리", res: "리소스 관리" };
App.openPage = p => { S.page = p; S.drawer = false; S.sheet = false; renderOverlays(); };
App.closePage = () => { S.page = null; PGS.courseEdit = null; PGS.planForm = null; PGS.spotForm = null; PGS.resForm = null; renderOverlays(); render(); };

function pageScreen() {
  const p = S.page;
  const body = p === "course" ? pgCourse() : p === "plan" ? pgPlan() : p === "spot" ? pgSpot() : p === "res" ? pgRes() : "";
  return `
  <div class="sheet-full z52" style="background:var(--g50);">
    <header style="flex:none; display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border-bottom:1px solid var(--g200);">
      <button type="button" style="flex:none; display:flex; align-items:center; justify-content:center; width:40px; height:40px; border:1px solid #cfeee4; border-radius:999px; background:#fff; font-size:17px; color:var(--brand-deep);" onclick="App.closePage()">←</button>
      <span style="flex:1; text-align:center; font-size:17px; font-weight:bold;">${PAGE_TITLES[p] || ""}</span>
      <span style="flex:none; width:40px;"></span>
    </header>
    <div class="sheet-body" style="padding:12px 12px 28px; display:flex; flex-direction:column; gap:12px;">${body}</div>
  </div>`;
}

/* ── 코스 관리 ── */
function nightsOf(c) { return c.nights || ((c.days || []).length ? (c.days.length - 1) + "박" + c.days.length + "일" : "-"); }
function pgCourse() {
  const courses = getCourses();
  const dayOpts = ["전체 일정", ...new Set(Object.values(courses).map(c => (c.days || []).length + "일 일정"))];
  const regionOpts = ["전체 여행지", ...new Set(Object.values(courses).map(c => c.destination).filter(Boolean))];
  const list = Object.entries(courses).filter(([name, c]) => {
    if (PGS.courseQuery.trim() && !(name + (c.highlights || []).join(" ")).includes(PGS.courseQuery.trim())) return false;
    if (PGS.courseFilter.days !== "전체 일정" && (c.days || []).length + "일 일정" !== PGS.courseFilter.days) return false;
    if (PGS.courseFilter.region !== "전체 여행지" && c.destination !== PGS.courseFilter.region) return false;
    return true;
  });
  return `
  <section style="padding:16px; border-radius:12px; background:#fff; display:flex; flex-direction:column; gap:10px;">
    <span style="font-size:12px; line-height:150%; color:var(--g600);">여기서 만든 코스가 <b>견적서 만들기 → 코스 불러오기</b>에 나타납니다. 클릭 한 번으로 일정·명소·기본가가 자동으로 채워져요.</span>
    <button type="button" class="btn mint" style="height:44px; font-size:14px;" onclick="App.courseNew()">＋ 새 코스 추가</button>
    <label class="searchbox" style="height:44px; border-radius:6px; padding:0 12px;">${icon("search", 18)}<input type="search" value="${esc(PGS.courseQuery)}" placeholder="명소 또는 코스명 검색" oninput="PGS.courseQuery=this.value; clearTimeout(window.__ct); window.__ct=setTimeout(()=>renderOverlays(),300);"></label>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <select style="height:42px; padding:0 8px; border:1px solid var(--g300); border-radius:6px; background:#fff; font-size:12px; color:var(--g700);" onchange="PGS.courseFilter.days=this.value; renderOverlays();">
        ${dayOpts.map(o => `<option ${PGS.courseFilter.days === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
      </select>
      <select style="height:42px; padding:0 8px; border:1px solid var(--g300); border-radius:6px; background:#fff; font-size:12px; color:var(--g700);" onchange="PGS.courseFilter.region=this.value; renderOverlays();">
        ${regionOpts.map(o => `<option ${PGS.courseFilter.region === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
      </select>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:12px; color:var(--g600);">전체 ${Object.keys(courses).length}개 중 ${list.length}개 코스</span>
      <button type="button" style="margin-left:auto; border:none; background:transparent; font-size:12px; color:var(--brand-deep);" onclick="PGS.courseQuery=''; PGS.courseFilter={days:'전체 일정',region:'전체 여행지'}; renderOverlays();">필터 초기화</button>
    </div>
  </section>
  ${list.map(([name, c]) => `
  <section style="display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-radius:12px; background:#fff;">
    <span style="flex:none; display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:8px; background:var(--brand-bg); color:var(--brand);">${icon("list", 18)}</span>
    <span style="flex:1; display:flex; flex-direction:column; gap:4px; min-width:0;">
      <span style="display:flex; align-items:center; gap:8px;" onclick="App.courseEdit('${esc(name).replace(/'/g, "\\'")}')">
        <span style="font-size:14px; font-weight:bold;">${esc(name)}</span>
        <span class="pill" style="margin-left:auto; flex:none;">${(c.days || []).length}일 일정</span>
      </span>
      <span style="font-size:12px; line-height:150%; color:var(--g600);" onclick="App.courseEdit('${esc(name).replace(/'/g, "\\'")}')">${esc(c.destination || "-")} · ${esc(nightsOf(c))} · 명소 ${(c.highlights || []).length}곳${c.price && c.price.deposit ? " · 예약금 " + won(c.price.deposit) : ""}</span>
      <span style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding-top:6px;">
        <button type="button" class="btn" style="height:38px; font-size:12px;" onclick="App.courseEdit('${esc(name).replace(/'/g, "\\'")}')">편집</button>
        <button type="button" class="btn" style="height:38px; font-size:12px;" onclick="App.courseClone('${esc(name).replace(/'/g, "\\'")}')">복제</button>
        <button type="button" class="btn mint" style="height:38px; font-size:12px;" onclick="App.courseShare('${esc(name).replace(/'/g, "\\'")}')">공유 견적</button>
      </span>
    </span>
  </section>`).join("") || `<p class="empty">코스가 없어요</p>`}`;
}
App.courseNew = () => { PGS.courseEdit = { orig: null, draft: { name: "", destination: "", nights: "", intensity: 3, vehicle: "", highlights: [], days: [], price: { deposit: 50000, options: [], balances: [] } } }; renderOverlays(); };
App.courseEdit = name => {
  const c = getCourses()[name]; if (!c) return;
  const draft = clone(c); draft.name = name;
  draft.price = draft.price || { deposit: 50000, options: [], balances: [] };
  draft.price.options = Array.isArray(draft.price.options) ? draft.price.options : [];
  draft.price.balances = Array.isArray(draft.price.balances) ? draft.price.balances : [];
  draft.highlights = Array.isArray(draft.highlights) ? draft.highlights : [];
  draft.days = Array.isArray(draft.days) ? draft.days : [];
  PGS.courseEdit = { orig: name, draft };
  renderOverlays();
};
App.courseClone = name => {
  const courses = getCourses(); const c = courses[name]; if (!c) return;
  let nn = name + " 복사"; let i = 2;
  while (courses[nn]) nn = name + " 복사" + i++;
  const next = { ...courses, [nn]: clone(c) };
  saveCourses(next); toast(`"${nn}"로 복제했어요`); renderOverlays();
};
App.courseShare = name => {
  sessionStorage.setItem("leaders_course_share", JSON.stringify({ course: name, anonymous: true }));
  S.page = null; PGS.courseEdit = null;
  openQuoteEditor(null);
  QE.shareAnon = true;
  applyCourse(name, { silent: true });
  renderOverlays();
  toast("코스를 불러왔어요 — 링크 공유를 누르면 공유 견적이 만들어져요");
};
App.courseDelete = async () => {
  const ce = PGS.courseEdit; if (!ce || !ce.orig) return;
  if (!await appConfirm(`"${ce.orig}" 코스를 삭제할까요?`, { ok: "삭제", danger: true })) return;
  const courses = { ...getCourses() }; delete courses[ce.orig];
  saveCourses(courses); PGS.courseEdit = null; renderOverlays(); toast("삭제했어요");
};
App.courseSave = () => {
  const ce = PGS.courseEdit; if (!ce) return;
  const d = ce.draft;
  const name = (d.name || "").trim();
  if (!name) { toast("코스 이름을 입력하세요"); return; }
  const courses = { ...getCourses() };

  </div>`;
}

/* ── 이미지 업로드 (WebP 변환 → R2) ── */
App.uploadImg = cb => {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    toast("사진 올리는 중…");
    try {
      const blob = await toWebp(f);
      const fd = new FormData();
      fd.append("file", new File([blob], (f.name.replace(/\.[^.]+$/, "") || "img") + ".webp", { type: "image/webp" }));
      const res = await fetch("/api/upload?folder=images", { method: "POST", body: fd, headers: { "x-admin-token": ADMIN_TOKEN } });
      const j = await res.json().catch(() => ({}));
      if (!res.ok || !j.ok || !j.url) throw new Error(j.error || "업로드 실패");
      cb(j.url);
      toast("사진을 올렸어요");
    } catch (e) { toast("업로드 실패: " + (e.message || e)); }
  };
  inp.click();
};
function toWebp(file, maxW = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error("변환 실패")), "image/webp", quality);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("이미지를 읽을 수 없어요"));
    img.src = URL.createObjectURL(file);
  });
}

/* ═══ 오버레이 렌더러 ═══ */
let PREV_OVL_KEY = "";
function renderOverlays() {
  let html = "";
  const keys = [];
  if (S.page === "quote" && QE) { html += quoteEditorScreen(); keys.push("quote"); }
  if (S.page && S.page !== "quote") { html += pageScreen(); keys.push("page:" + S.page); }
  if (PGS.courseEdit) { html += courseEditSheet(); keys.push("courseEdit"); }
  if (PGS.planForm) { html += planFormSheet(); keys.push("planForm"); }
  if (PGS.spotForm) { html += spotFormSheet(); keys.push("spotForm"); }
  if (PGS.resForm) { html += resFormSheet(); keys.push("resForm"); }
  if (S.assign && ASSIGN) { const r = recById(S.assign); if (r) { html += assignScreen(r); keys.push("assign:" + S.assign); } }
  if (S.inquiry) { const r = recById(S.inquiry); if (r) { html += inquirySheet(r); keys.push("inquiry:" + S.inquiry); } else S.inquiry = null; }
  if (S.timelineFull) { const r = recById(S.timelineFull); if (r) { html += timelineSheet(r); keys.push("timeline:" + S.timelineFull); } else S.timelineFull = null; }
  if (S.sheet) { html += moreSheetHtml(); keys.push("sheet"); }
  if (S.drawer) { html += drawerHtml(); keys.push("drawer"); }
  /* 열려 있는 오버레이 구성이 그대로면 단순 재렌더 — 등장 애니메이션을 다시 재생하지 않는다.
     (클래스를 innerHTML 교체 전에 걸어야 새 노드가 애니메이션 없이 생성된다) */
  const key = keys.join("|");
  const ovl = $("ovl");
  ovl.classList.toggle("noanim", key !== "" && key === PREV_OVL_KEY);
  PREV_OVL_KEY = key;
  ovl.innerHTML = html;
}

/* ═══ 로그인 · 부팅 ═══ */
async function tryLogin(pw) {
  const res = await fetch("/api/requests", { headers: { "x-admin-token": pw } });
  if (res.status === 401) return null;
  const j = await res.json().catch(() => null);
  if (j && j.ok && Array.isArray(j.items)) return j.items;
  return null;
}
function showLogin(msg) {
  $("login").classList.add("on"); $("app").classList.remove("on");
  $("loginMsg").textContent = msg || "";
}
async function enterApp(items) {
  $("login").classList.remove("on"); $("app").classList.add("on");
  RECORDS = items; LOADED = true;
  render();
  /* 콘텐츠 라이브러리 동기화 (관리자 토큰으로 다시 받아 민감 필드 포함) */
  try {
    await Promise.all(Object.keys(window.CLOUD_KEYS || {}).map(k => window.cloudPull ? window.cloudPull(k) : null));
    if (S.page || S.assign) renderOverlays();
  } catch (e) {}
}
$("loginBtn").onclick = async () => {
  const pw = $("loginPw").value.trim();
  if (!pw) { showLogin("비밀번호를 입력하세요"); return; }
  $("loginBtn").disabled = true; $("loginBtn").textContent = "확인 중…";
  try {
    const items = await tryLogin(pw);
    if (items) {
      ADMIN_TOKEN = pw; sessionStorage.setItem("leaders_admin_token", pw);
      await enterApp(items);
    } else showLogin("비밀번호가 맞지 않아요");
  } catch (e) { showLogin("서버에 연결할 수 없어요 — 배포 주소에서 열어 주세요"); }
  $("loginBtn").disabled = false; $("loginBtn").textContent = "로그인";
};
$("loginPw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("menuBtn").innerHTML = icon("menu", 22);
$("menuBtn").onclick = App.openDrawer;

(async function boot() {
  renderTabbar();
  if (ADMIN_TOKEN) {
    try {
      const items = await tryLogin(ADMIN_TOKEN);
      if (items) { await enterApp(items); return; }
      sessionStorage.removeItem("leaders_admin_token"); ADMIN_TOKEN = "";
    } catch (e) { showLogin("서버에 연결할 수 없어요"); return; }
  }
  showLogin("");
})();

/* 30초 폴링 — 편집 중에는 건너뜀 */
setInterval(async () => {
  if (!ADMIN_TOKEN || document.hidden) return;
  if (ASSIGN || QE || PGS.courseEdit || PGS.planForm || PGS.spotForm || PGS.resForm) return;
  try {
    const items = await apiList();
    RECORDS = items; LOADED = true;
    renderMain(); renderTabbar();
    if (S.inquiry || S.timelineFull) renderOverlays();
  } catch (e) {}
}, 30000);
</script>
