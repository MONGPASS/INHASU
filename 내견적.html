<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 견적 확인 · 몽골리아 은하수</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306c4a0'/%3E%3Cpath d='M20 42 30 24l7 12 5-7 8 13z' fill='white'/%3E%3C/svg%3E">
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
  :root { --accent:#06c4a0; --soft:#eaf7f3; --ink:#16261f; --sub:#6b7c78; --line:#e7eaee; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif; color:var(--ink);
    background:radial-gradient(125% 90% at 50% -5%, #DFF6EC 0%, #EFFBF6 42%, #FFFFFF 100%); min-height:100vh;
    border-top:3px solid var(--accent); display:flex; flex-direction:column; align-items:center; padding:26px 18px 40px; }
  .brand { display:inline-flex; align-items:center; gap:8px; margin-bottom:20px; }
  .brand svg { display:block; }
  .brand b { font-size:16px; font-weight:800; letter-spacing:-.02em; }
  .brand b i { font-style:normal; color:var(--accent); }
  .card { width:100%; max-width:440px; background:#fff; border:1px solid var(--line); border-radius:20px;
    box-shadow:0 12px 40px rgba(20,50,45,.07); padding:30px 24px 26px; text-align:center; }
  /* 히어로 — 아이콘 · 상태 칩 · 제목은 가운데, 설명 문구는 읽기 편하게 좌측 정렬 */
  .hero-ico { width:76px; height:76px; margin:0 auto 14px; display:block; }
  .hero-ico.emoji { font-size:58px; line-height:76px; text-align:center; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800;
    padding:6px 13px; border-radius:999px; background:var(--soft); color:#0a6a5e; }
  .chip.blue  { background:#e8effc; color:#2b5cc4; }
  .chip.amber { background:#fff4e2; color:#96631a; }
  h1 { font-size:23px; font-weight:800; letter-spacing:-.03em; margin:11px 0 0; line-height:1.35; }
  .desc { font-size:14px; color:var(--sub); line-height:1.65; text-align:left; margin-top:12px; }
  .divider { height:1px; background:var(--line); margin:20px 0 2px; }
  /* 여행 정보 — 점으로 잇는 타임라인 */
  .facts { text-align:left; position:relative; padding:6px 0 0 19px; }
  .facts::before { content:""; position:absolute; left:3.5px; top:18px; bottom:18px; width:1.5px; background:#dceee8; }
  .fact { position:relative; padding:9px 0; }
  .fact::before { content:""; position:absolute; left:-19px; top:13px; width:8px; height:8px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 3px #fff; }
  .fact .k { font-size:12px; color:#9AA0A6; font-weight:700; }
  .fact .v { font-size:15.5px; font-weight:800; margin-top:3px; letter-spacing:-.01em; word-break:keep-all; }
  .fact .s { font-size:12.5px; color:var(--sub); font-weight:600; margin-top:2px; }
  .validity { display:inline-flex; align-items:center; gap:6px; margin-top:16px; font-size:12.5px;
    font-weight:700; color:var(--sub); background:#F4F6F8; border-radius:999px; padding:7px 14px; }
  .validity svg { width:14px; height:14px; flex:none; }
  .btn { display:block; width:100%; margin-top:12px; padding:16px; border:none; border-radius:14px; font-family:inherit;
    font-size:15.5px; font-weight:800; cursor:pointer; text-decoration:none; text-align:center; }
  .btn.primary { background:var(--ink); color:#fff; }
  .btn.accent { background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(6,196,160,.26); }
  .btn.kakao { background:#FEE500; color:#3C1E1E; }
  .btn.ghost { background:#fff; color:var(--sub); border:1px solid var(--line); font-weight:700; box-shadow:none; }
  .steps { margin-top:18px; text-align:left; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .step { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); color:#9AA0A6; font-size:13px; font-weight:700; }
  .step:last-child { border-bottom:none; }
  .step .dot { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#eef1f3; color:#9AA0A6; font-size:11px; flex:none; }
  .step.done { color:var(--ink); }
  .step.done .dot { background:var(--accent); color:#fff; }
  .notice { margin-top:16px; padding:13px 14px; border-radius:12px; background:#fff7e8; color:#8a651e; font-size:13px; line-height:1.55; }
  .hint { margin-top:14px; font-size:12px; color:#9AA0A6; line-height:1.5; }
  .dep { margin-top:16px; text-align:left; border:1px solid #cdeee6; background:#f1faf7; border-radius:14px; padding:18px 16px; }
  .dep .amt { font-size:21px; font-weight:800; color:#0a6a5e; }
  .dep .amt small { display:block; margin-top:3px; font-size:12.5px; color:#6b7c78; font-weight:600; }
  .dep .acct { margin-top:12px; background:#fff; border:1px solid #d9eee9; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px; }
  .dep .acct .bank { font-size:12.5px; color:#6b7c78; margin-bottom:2px; }
  .dep .acct .no { font-size:15.5px; font-weight:800; letter-spacing:.01em; }
  .dep .copy { margin-left:auto; flex:none; border:1px solid var(--accent); background:#fff; color:#0a6a5e; border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .dep .tip { margin-top:10px; font-size:11.5px; color:#9AA0A6; line-height:1.5; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#06c4a0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.3 5.7L20 11l-5.7 2.3L12 19l-2.3-5.7L4 11l5.7-2.3z"></path></svg>
    <b>몽골리아 <i>은하수</i></b>
  </div>
  <div class="card" id="card">
    <div class="hero-ico emoji">⏳</div>
    <h1>불러오는 중…</h1>
  </div>

<script>
  const KAKAO = "https://pf.kakao.com/_BSLaxl";
  const IS_LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const card = document.getElementById("card");
  const token = new URLSearchParams(location.search).get("t");

  const paxTxt = r => {
    const p = [];
    if (r.adult) p.push(`성인 ${r.adult}`);
    if (r.child) p.push(`아동 ${r.child}`);
    if (r.infant) p.push(`유아 ${r.infant}`);
    return p.join(" · ") || "-";
  };
  const periodTxt = r => {
    if (!r.depart) return "-";
    const n = r.nights ? ` (${r.nights}박 ${r.nights + 1}일)` : "";
    return `${r.depart}${r.return_ ? " ~ " + r.return_ : ""}${n}`;
  };
  const destTxt = r => (r.destination || "-") + (r.destSpots && r.destSpots.length ? ` · ${r.destSpots.join(", ")}` : "");

  /* 견적 도착 화면의 축하 아이콘 — 평면 SVG (이모지 대신 또렷하게 보이도록) */
  const PARTY_SVG = `<svg class="hero-ico" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <path d="M7 57 22.5 28.5 35.5 41.5z" fill="#F58C82"/>
    <path d="M7 57 14.5 43.2 20.8 49.5z" fill="#E4655B"/>
    <path d="M25.5 25.5c3.4-3.7 8.2-3.4 11 .6" stroke="#3FBF97" stroke-width="3" stroke-linecap="round"/>
    <path d="M31 40.5c4.3-1.6 6.2 1.4 10.6-.4" stroke="#F5B841" stroke-width="3" stroke-linecap="round"/>
    <circle cx="45.5" cy="13.5" r="3.4" fill="#F5B841"/>
    <circle cx="56" cy="27" r="2.7" fill="#5AA9F0"/>
    <circle cx="34.5" cy="8.5" r="2.4" fill="#3FBF97"/>
    <circle cx="52.5" cy="45" r="2.4" fill="#F58C82"/>
    <rect x="45.5" y="34" width="6" height="6" rx="1.5" transform="rotate(22 45.5 34)" fill="#5AA9F0"/>
    <rect x="24.5" y="14" width="5.2" height="5.2" rx="1.4" transform="rotate(-28 24.5 14)" fill="#F5B841"/>
  </svg>`;
  const heroEmoji = e => `<div class="hero-ico emoji">${e}</div>`;
  const CLOCK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>`;

  /* 여행지·일정·인원을 점으로 잇는 타임라인으로 보여줍니다 */
  const factsHtml = r => {
    const period = r.depart ? `${r.depart}${r.return_ ? " ~ " + r.return_ : ""}` : "-";
    const nights = r.nights ? `${r.nights}박 ${r.nights + 1}일` : "";
    return `<div class="facts">
      <div class="fact"><div class="k">여행지</div><div class="v">${esc(destTxt(r))}</div></div>
      <div class="fact"><div class="k">일정</div><div class="v">${esc(period)}</div>${nights ? `<div class="s">${esc(nights)}</div>` : ""}</div>
      <div class="fact"><div class="k">인원</div><div class="v">${esc(paxTxt(r))}</div></div>
    </div>`;
  };
  const sumHtml = r => `<div class="divider"></div>${factsHtml(r)}`;

  const progressHtml = r => {
    const booking = r.booking || {};
    const accepted = r.decision && r.decision.status === "accepted";
    const depositPaid = !!(booking.contractInfo && booking.contractInfo.depositStatus === "입금완료");
    const confirmed = r.status === "예약확정";
    const published = booking.publishStatus === "published";
    return `<div class="steps">
      ${[["예약 접수",accepted],["예약금 입금",depositPaid],["예약 확정",confirmed],["일정표 공개",published]].map(([label,done]) =>
        `<div class="step ${done ? "done" : ""}"><span class="dot">${done ? "✓" : ""}</span>${label}</div>`).join("")}
    </div>`;
  };

  function showError(msg) {
    card.innerHTML = `${heroEmoji("🔗")}<h1>링크를 확인해 주세요</h1>
      <div class="desc">${esc(msg)}</div>
      <a class="btn kakao" href="${KAKAO}" target="_blank">💬 카카오톡으로 문의하기</a>`;
  }

  async function load() {
    if (!token) return showError("올바른 접속 링크가 아닙니다. 담당자에게 받은 링크로 접속해 주세요.");
    let r;
    try {
      if (IS_LOCAL) {
        const item = JSON.parse(localStorage.getItem("leaders_requests") || "[]").find(x => x.token === token);
        if (!item) return showError("존재하지 않거나 만료된 링크입니다.");
        r = { ok:true, ...item };
      } else {
        const res = await fetch("/api/my/" + encodeURIComponent(token), { cache: "no-store" });
        if (res.status === 404) return showError("존재하지 않거나 만료된 링크입니다.");
        if (!res.ok) throw new Error("http " + res.status);
        r = await res.json();
        if (!r.ok) throw new Error(r.error || "error");
      }
    } catch (e) {
      return showError("일시적으로 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.");
    }

    const nm = r.name ? `${esc(r.name)}님, ` : "";
    if (r.booking) {
      const signed = r.booking.contract && r.booking.contract.signedAt;
      const confirmed = r.status === "예약확정";
      const published = r.booking.publishStatus === "published";
      const travelerSubmission = r.booking.travelerSubmission || {};
      const travelersDone = travelerSubmission.status === "submitted";
      const ci = r.booking.contractInfo || {};
      const depositPaid = ci.depositStatus === "입금완료";
      const depositRequested = r.booking.depositRequest && r.booking.depositRequest.status === "requested";
      const contractRequested = r.booking.contractRequest && r.booking.contractRequest.status === "requested";
      const depositReport = r.booking.depositReport || {};
      const isReported = depositReport.status === "reported";
      const money = n => Number(n || 0) ? Number(n).toLocaleString("ko-KR") + "원" : "-";
      const title = confirmed ? "예약이 확정됐어요!" : signed ? "계약서 서명이 완료됐어요" : (depositPaid && contractRequested) ? "계약서를 확인해 주세요" : depositPaid ? "예약금 입금이 확인됐어요" : depositRequested ? (isReported ? "입금 내역을 확인하고 있어요" : "예약금 입금을 진행해 주세요") : "예약정보를 준비하고 있어요";
      const description = confirmed ? (published ? "확정일정표가 준비되었습니다." : "예약은 확정됐으며 세부 일정과 배정을 준비하고 있습니다.") : signed ? "서명이 접수되었습니다. 담당자가 확인 후 예약을 확정합니다." : (depositPaid && contractRequested) ? "예약금 확인이 완료되었습니다. 여행계약서를 확인하고 서명해 주세요." : depositPaid ? "예약금 확인이 완료되었습니다. 담당자가 계약서를 준비하고 있습니다." : depositRequested ? (isReported ? "고객님의 입금 완료 요청이 접수되었습니다. 담당자가 입금 확인 후 계약서 서명을 안내해 드립니다." : "아래 예약금과 입금 계좌를 확인해 주세요. 입금 완료 후 아래 버튼을 누르시면 담당자가 확인 후 예약을 진행합니다.") : "담당자가 예약정보와 예약금 안내를 준비하고 있습니다.";
      card.innerHTML = `
        ${heroEmoji(confirmed ? "🎫" : depositRequested && !depositPaid ? (isReported ? "⏳" : "💳") : "🧾")}
        <span class="chip ${confirmed ? "blue" : ""}">${confirmed ? "✓ 예약 확정" : isReported && !depositPaid ? "⏳ 입금 확인 중" : "⏳ 예약 진행 중"}</span>
        <h1>${title}</h1>
        <div class="desc">${nm}${description}</div>
        ${sumHtml(r)}
        ${progressHtml(r)}
        ${depositRequested && !depositPaid ? `<div class="dep">
          <div class="amt">예약금 ${esc(money(ci.depositAmount))}<small>입금이 확인되면 예약이 진행됩니다</small></div>
          <div class="acct">
            <div><div class="bank">${esc(ci.bankName || "은행 확인 필요")} · 예금주 ${esc(ci.accountHolder || "-")}</div><div class="no">${esc(ci.accountNumber || "계좌 확인 필요")}</div></div>
            <button class="copy" id="copyAcctBtn" type="button">📋 계좌번호 복사</button>
          </div>
          ${isReported ? `
            <div style="margin-top:14px; background:#eaf7f3; border:1px solid #9ccdbf; border-radius:12px; padding:12px 14px; text-align:left;">
              <div style="font-size:13.5px; font-weight:800; color:#0a6a5e; display:flex; align-items:center; gap:6px;">
                <span>✅</span><span>입금 확인 요청 완료</span>
              </div>
              <div style="font-size:12px; color:#40544f; margin-top:5px; line-height:1.5;">
                입금자명 <b>${esc(depositReport.name || r.name || "-")}</b>(으)로 입금 완료를 알렸습니다.<br>
                담당자가 입금 내역을 확인하는 대로 계약서 서명 안내를 진행해 드립니다.
              </div>
              <button id="reportDepositBtn" type="button" style="margin-top:8px; background:none; border:none; color:#0a6a5e; font-size:11.5px; font-weight:700; text-decoration:underline; cursor:pointer; padding:0;">입금자명이 다른가요? 다시 알리기</button>
            </div>` : `
            <div style="margin-top:14px;">
              <button class="btn accent" id="reportDepositBtn" type="button" style="margin-top:0; background:#06c4a0; color:#fff;">💳 예약금 입금 완료했어요</button>
            </div>
            <div class="tip">입금 후 위 버튼을 누르시면 담당자가 확인 후 계약서 서명을 안내해 드립니다. 카카오톡 상담으로 알려주셔도 됩니다.</div>`}
        </div>` : ""}
        ${signed
          ? `<a class="btn ghost" href="${esc("계약서.html?t=" + encodeURIComponent(token))}" target="_blank">📜 여행계약서 보기 (서명완료)</a>
             <a class="btn ghost" href="${esc("여행자정보.html?t=" + encodeURIComponent(token))}">👥 여행자 정보 + 항공권 정보 확인·수정</a>`
          : depositPaid && contractRequested
            ? `<a class="btn accent" href="${esc("계약서.html?t=" + encodeURIComponent(token))}">✍️ 여행계약서 확인·서명하기 (여행자·항공 정보 입력)</a>`
            : ""}
        ${depositPaid && !signed && !contractRequested ? `<div class="notice">담당자가 계약서를 준비하고 있습니다. 서명 요청 알림을 받으면 이 화면에서 진행할 수 있습니다.</div>` : ""}
        ${published ? `<a class="btn accent" style="background:#3d7ff0;" href="${esc("확정일정표.html?t=" + encodeURIComponent(token))}" target="_blank">🎫 확정일정표 보기</a>` : confirmed ? `<div class="notice">가이드·차량·숙소 배정이 끝나면 확정일정표가 공개됩니다.</div>` : ""}
        ${r.quote ? `<a class="btn ghost" href="${esc("견적서.html?t=" + encodeURIComponent(token))}" target="_blank">📄 견적서 보기</a>` : ""}
        ${published ? `<a class="btn ghost" href="${esc("일정지도.html?t=" + encodeURIComponent(token))}" target="_blank">🗺 일정 지도 보기</a>` : ""}
        <a class="btn kakao" href="${KAKAO}" target="_blank">💬 카카오톡 상담</a>`;
      const copyBtn = document.getElementById("copyAcctBtn");
      if (copyBtn) copyBtn.onclick = async () => {
        const no = String(ci.accountNumber || "");
        try { await navigator.clipboard.writeText(no); copyBtn.textContent = "✓ 복사됐어요"; }
        catch (e) { prompt("계좌번호를 길게 눌러 복사하세요", no); }
        setTimeout(() => { copyBtn.textContent = "📋 계좌번호 복사"; }, 1800);
      };
      const reportBtn = document.getElementById("reportDepositBtn");
      if (reportBtn) reportBtn.onclick = async () => {
        const currentName = depositReport.name || r.name || "";
        const name = prompt("입금자명을 입력해 주세요 (실제 계좌 이체 시 보낸 분 성함)", currentName);
        if (name === null) return;
        const trimmed = name.trim();
        if (!trimmed) { alert("입금자명을 입력해 주세요."); return; }

        reportBtn.disabled = true;
        reportBtn.textContent = "입금 확인 요청 중…";

        if (IS_LOCAL) {
          try {
            const list = JSON.parse(localStorage.getItem("leaders_requests") || "[]");
            const idx = list.findIndex(x => x.token === token);
            if (idx >= 0) {
              const now = new Date().toISOString();
              list[idx].booking = list[idx].booking || {};
              list[idx].booking.depositReport = { status: "reported", name: trimmed, reportedAt: now };
              list[idx].activities = list[idx].activities || [];
              list[idx].activities.push({ at: now, type: "deposit_reported", detail: `고객이 예약금 입금 완료를 알림 (입금자명: ${trimmed})` });
              localStorage.setItem("leaders_requests", JSON.stringify(list));
            }
          } catch(e) {}
          alert("✓ 입금 확인 요청이 전달되었습니다. 담당자가 확인 후 안내해 드립니다.");
          location.reload();
          return;
        }

        try {
          const res = await fetch("/api/deposit/" + encodeURIComponent(token), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: trimmed }),
          });
          const j = await res.json();
          if (!res.ok || !j.ok) throw new Error(j.error || "요청에 실패했습니다.");
          alert("✓ 입금 확인 요청이 전달되었습니다. 담당자가 확인 후 계약서 서명을 안내해 드립니다.");
          location.reload();
        } catch(e) {
          alert("오류: " + (e.message || "잠시 후 다시 시도해 주세요."));
          reportBtn.disabled = false;
          reportBtn.textContent = "💳 예약금 입금 완료했어요";
        }
      };
    } else if (r.quote) {
      const accepted = r.decision && r.decision.status === "accepted";
      const expired = !!r.quoteExpired && !accepted;
      const expireLabel = r.quoteExpiresAt ? new Date(r.quoteExpiresAt).toLocaleDateString("ko-KR") : "";
      card.innerHTML = `
        ${accepted ? heroEmoji("🧾") : PARTY_SVG}
        <span class="chip ${accepted ? "amber" : ""}">${accepted ? "⏳ 예약 준비 중" : "✓ 견적 완료"}</span>
        <h1>${accepted ? "예약 준비를 시작했어요" : "견적서가 도착했어요!"}</h1>
        <div class="desc">${nm}${accepted ? "예약 진행이 확인되었습니다. 담당자가 예약정보와 예약금 안내를 준비하고 있습니다." : "견적서를 확인하시고, 수정하고 싶은 부분이나 예약 진행 의사는 카카오톡으로 편하게 말씀해 주세요."}</div>
        ${sumHtml(r)}
        ${accepted ? progressHtml(r) : ""}
        ${expired ? `<div class="notice">이 견적의 유효기간이 만료되었습니다. 카카오톡으로 연장을 요청해 주세요.</div>`
          : (expireLabel ? `<div class="validity">${CLOCK_SVG}견적 유효기간: ${esc(expireLabel)}까지</div>` : "")}
        <a class="btn accent" href="${esc("견적서.html?t=" + encodeURIComponent(token))}" target="_blank">📄 견적서 보기</a>
        <a class="btn kakao" href="${KAKAO}" target="_blank">💬 카카오톡으로 예약 진행·수정 문의</a>`;
    } else {
      card.innerHTML = `
        ${heroEmoji("✅")}
        <span class="chip">⏳ ${esc(r.status || "확인 중")}</span>
        <h1>견적 요청이 접수됐어요</h1>
        <div class="desc">${nm}담당자가 확인 후 남겨주신 연락처로 연락드려요.<br>빠르게 견적서를 준비해 드릴게요.<br>견적서가 준비되면 이 화면에서 바로 확인할 수 있어요.</div>
        ${sumHtml(r)}
        <a class="btn kakao" href="${KAKAO}" target="_blank">💬 카카오톡으로 빠른 상담</a>
        <button class="btn ghost" onclick="location.reload()">새로고침</button>
        <div class="hint">이 링크를 저장해 두시면 언제든 진행 상황을 확인할 수 있어요.</div>`;
    }
  }
  load();
</script>
</body>
</html>
