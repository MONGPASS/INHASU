<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예약 관리 · 몽골리아 은하수</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306c4a0'/%3E%3Cpath d='M20 42 30 24l7 12 5-7 8 13z' fill='white'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root { --accent:#06c4a0; --deep:#06c4a0; --soft:#edf5f2; --ink:#0f2e27; --sub:#5a716b; --gray:#8aa39c; --line:#eaf0ee; --bg:#f6faf9; --book:#3d7ff0; --warn:#e0913a; --red:#d96a5e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Pretendard, system-ui, "Malgun Gothic", sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  svg { display:block; }
  .shell { display:flex; min-height:100vh; }
  .side { width:232px; flex:0 0 232px; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; }
  .side-brand { display:flex; align-items:center; gap:10px; padding:4px 8px 20px; }
  .side-brand .logo { width:38px; height:38px; border-radius:11px; background:linear-gradient(150deg,#06c4a0,#037a64); color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 6px 14px rgba(6,196,160,.3); }
  .side-brand b { font-size:15px; font-weight:800; display:block; line-height:1.2; }
  .side-brand small { font-size:11.5px; color:var(--gray); font-weight:600; }
  .mi { display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:11px; color:var(--sub); font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; margin-bottom:2px; border:none; background:none; width:100%; font-family:inherit; transition:.12s; }
  .mi:hover { background:var(--soft); color:var(--deep); }
  .mi.on { background:var(--deep); color:#fff; box-shadow:0 6px 14px rgba(6,196,160,.24); }
  .content { flex:1; min-width:0; width:calc(100vw - 232px); padding:26px 24px 60px; max-width:none; }
  .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .page-head h1 { font-size:22px; font-weight:800; }
  .page-head p { color:var(--sub); font-size:13px; margin-top:5px; }
  .head-meta { color:var(--gray); font-size:12px; font-weight:700; white-space:nowrap; }
  .btn { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:10px 14px; font:800 13px Pretendard; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .btn.primary { background:var(--deep); color:#fff; border-color:var(--deep); }
  /* 통계 카드 — 옅은 틴트 배경 + 원형 아이콘 + 상태 배지 + 실제 데이터 미니 차트 */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:12px; }
  .stat { background:var(--cs,#eaf7f3); border:1px solid var(--cb,#d9efe8); border-radius:16px; padding:14px 16px 13px; cursor:pointer; transition:.12s; text-align:left; font-family:inherit; display:block; width:100%; }
  .stat:hover { border-color:var(--c,#06c4a0); }
  .stat.on { border-color:var(--c,#06c4a0); box-shadow:0 0 0 1px var(--c,#06c4a0) inset; }
  .stat-top { display:flex; align-items:center; gap:9px; margin-bottom:13px; }
  .stat-ico { width:30px; height:30px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; color:var(--c,#06c4a0); }
  .stat-ico svg { width:16px; height:16px; }
  .stat-k { color:var(--ink); font-weight:800; font-size:13.5px; }
  .stat-pill { margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:4px 9px; border-radius:99px; background:#fff; color:var(--c,#06c4a0); white-space:nowrap; }
  .stat-pill i { width:5px; height:5px; border-radius:50%; background:currentColor; display:block; flex:none; }
  .stat-bot { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .stat-v { font-size:30px; font-weight:800; line-height:1; display:flex; align-items:baseline; gap:3px; color:var(--ink); }
  .stat-v .unit { font-size:12.5px; font-weight:800; color:var(--gray); }
  .stat-sub { color:var(--gray); font-size:11.5px; font-weight:700; margin-top:9px; }
  .stat-chart { flex:none; display:block; margin-bottom:2px; }
  .stat.c-teal  { --c:#06c4a0; --cs:#eaf7f3; --cb:#cfeae1; }
  .stat.c-red   { --c:#d96a5e; --cs:#fdeeed; --cb:#f4d8d4; }
  .stat.c-amber { --c:#d9932f; --cs:#fdf5e8; --cb:#f1e0c2; }
  .stat.c-green { --c:#1f9d76; --cs:#eaf6f1; --cb:#d0e8dd; }
  /* 검색·정렬·상태 필터를 한 카드로 통합 */
  .toolcard { background:#fff; border:1px solid var(--line); border-radius:16px; padding:11px 13px; margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .search { flex:1 1 300px; min-width:220px; position:relative; display:flex; align-items:center; }
  .search .ico { position:absolute; left:12px; width:15px; height:15px; color:var(--gray); pointer-events:none; }
  .search input { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px 10px 34px; font:600 13.5px Pretendard; outline:none; background:#fff; color:var(--ink); }
  .search input:focus { border-color:var(--accent); }
  .sortbox { display:flex; align-items:center; gap:7px; }
  .sortbox select, .sortbox button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:9px 11px; font:800 12.5px Pretendard; cursor:pointer; }
  .sortbox select:focus { outline:none; border-color:var(--accent); }
  .seg { display:flex; gap:2px; background:#f1f6f4; border-radius:11px; padding:3px; flex-wrap:wrap; }
  .chip { border:none; background:none; color:var(--sub); border-radius:9px; padding:7px 11px; font:800 12.5px Pretendard; cursor:pointer; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .chip b { font-size:11px; font-weight:800; color:var(--gray); }
  .chip:hover { color:var(--ink); }
  .chip.on { background:var(--deep); color:#fff; box-shadow:0 2px 6px rgba(6,196,160,.26); }
  .chip.on b { color:rgba(255,255,255,.82); }
  /* 월별 예약 필터 — 연도 이동 + 12개월 고정 그리드 (연도가 늘어도 폭이 일정) */
  .mbar { display:flex; align-items:center; gap:11px; flex-wrap:wrap; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 13px; margin:0 0 14px; box-shadow:0 4px 14px rgba(15,46,39,.04); }
  .mbar-label { display:inline-flex; align-items:center; gap:6px; color:var(--sub); font-size:12.5px; font-weight:800; white-space:nowrap; }
  .mbar-label svg { width:15px; height:15px; }
  .mbar-div { width:1px; height:24px; background:var(--line); flex:none; }
  .mpill { border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:99px; padding:7px 12px; font:800 12.5px Pretendard; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .mpill:hover { border-color:#cfd9d6; background:#fbfdfc; }
  .mpill b { font-size:11px; font-weight:900; color:var(--gray); background:#f0f4f3; border-radius:99px; padding:2px 7px; }
  .mpill.on { background:var(--deep); border-color:var(--deep); color:#fff; }
  .mpill.on b { background:rgba(255,255,255,.24); color:#fff; }
  .yrnav { display:inline-flex; align-items:center; gap:2px; flex:none; }
  .yrbtn { border:1px solid var(--line); background:#fff; color:var(--sub); width:27px; height:27px; border-radius:8px; font:900 15px Pretendard; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .yrbtn:hover:not(:disabled) { border-color:#cfd9d6; background:#fbfdfc; color:var(--ink); }
  .yrbtn:disabled { opacity:.28; cursor:not-allowed; }
  .yrname { border:none; background:none; font:900 14px Pretendard; color:var(--ink); cursor:pointer; padding:5px 9px; border-radius:8px; white-space:nowrap; }
  .yrname small { font-size:11px; font-weight:800; color:var(--gray); margin-left:1px; }
  .yrname:hover { background:var(--soft); }
  .yrname.on { background:var(--deep); color:#fff; }
  .yrname.on small { color:rgba(255,255,255,.72); }
  /* 12개월은 남은 폭을 균등 분할 — 화면 폭이 달라져도 항상 한 줄에 12칸 */
  .mcells { flex:1 1 430px; display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:4px; }
  .mcell { border:1px solid var(--line); background:#fff; border-radius:10px; padding:5px 2px 6px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0; }
  .mcell .m { font-size:12px; font-weight:800; color:var(--ink); line-height:1.3; }
  .mcell .n { font-size:10.5px; font-weight:800; color:var(--accent); line-height:1.3; }
  .mcell:hover:not(:disabled) { border-color:var(--accent); background:#f6fdfb; }
  .mcell.on { background:var(--deep); border-color:var(--deep); box-shadow:0 4px 10px rgba(6,196,160,.26); }
  .mcell.on .m, .mcell.on .n { color:#fff; }
  .mcell:disabled { background:#fbfcfc; cursor:default; }
  .mcell:disabled .m { color:#bbc8c4; font-weight:700; }
  .mcell:disabled .n { color:#d5dedb; }
  /* 폭이 모자라면 6칸 2줄로 접되, 칸이 과하게 넓어지지 않도록 폭을 묶어둔다 */
  @media (max-width:900px){ .mcells { grid-template-columns:repeat(6,minmax(0,1fr)); flex:1 1 260px; max-width:360px; } }
  .bulkbar { display:flex; align-items:center; gap:8px; margin:0 0 14px; flex-wrap:wrap; }
  .bulkbar .count { color:var(--sub); font-size:12.5px; font-weight:800; margin-right:4px; }
  .bulkbtn { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:8px 11px; font:800 12.5px Pretendard; cursor:pointer; }
  .bulkbtn:hover:not(:disabled) { border-color:#cfd9d6; background:#fbfdfc; }
  .bulkbtn.primary { background:var(--deep); border-color:var(--deep); color:#fff; }
  .bulkbtn.danger { background:#fff5f4; border-color:#f2d1cc; color:#b84e44; }
  .bulkbtn:disabled { opacity:.45; cursor:not-allowed; }
  .rowcheck { width:16px; height:16px; accent-color:var(--deep); cursor:pointer; }
  .col-receipt { text-align:left; }
  /* 진행 타임라인 — 표에는 마지막 단계만, 누르면 전체를 패널로 */
  .tl-cell { width:100%; border:none; background:none; font-family:inherit; text-align:left; cursor:pointer;
    padding:4px 6px; border-radius:9px; display:block; }
  .tl-cell:hover { background:#f4f9f7; }
  .tl-cell .step { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:#04836b; line-height:1.35; }
  .tl-cell .step i { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; display:block; }
  .tl-cell .step.bad { color:#e5484d; }
  .tl-cell .step.bad i { background:#e5484d; }
  .tl-cell .step span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tl-cell .meta { font-size:11px; font-weight:700; color:var(--gray); margin-top:3px; padding-left:13px; white-space:nowrap; }
  .tl-cell .none { font-size:12px; font-weight:700; color:var(--gray); }
  .tl-mask { position:fixed; inset:0; background:rgba(15,46,39,.34); display:none; align-items:center; justify-content:center; z-index:90; padding:20px; }
  .tl-mask.on { display:flex; }
  .tl-panel { background:#fff; border-radius:16px; width:100%; max-width:440px; max-height:82vh; overflow:auto; box-shadow:0 20px 50px rgba(15,46,39,.25); }
  .tl-head { position:sticky; top:0; background:#fff; z-index:1; display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px; padding:20px 22px 15px; border-bottom:1px solid #eef1f0; }
  .tl-head b { font-size:17px; font-weight:800; display:block; letter-spacing:-.02em; }
  .tl-head small { font-size:13px; color:#8b9a96; font-weight:600; display:block; margin-top:4px; }
  .tl-close { border:none; background:none; font-size:21px; line-height:1; color:#9aa8a4; cursor:pointer; padding:0 2px; flex:none; }
  .tl-close:hover { color:var(--ink); }
  .tl-body { padding:2px 22px 20px; }
  /* 날짜로 묶고, 지난 날짜는 흐리게 — 최근 흐름이 먼저 눈에 들어오도록 */
  .tl-date { display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:800; color:#3f4b48; padding:16px 0 6px; }
  .tl-date::after { content:""; flex:1; height:1px; background:#eef1f0; }
  .tl-group.past { opacity:.5; }
  .tl-item { position:relative; padding:7px 0 7px 26px; }
  /* 점은 회색(기본)·검정(사람이 한 일)·빨강(실패) 세 가지만 씁니다 */
  .tl-dot { position:absolute; left:2px; top:11px; width:10px; height:10px; border-radius:50%;
    background:#fff; border:1.5px solid #cfd6d4; box-sizing:border-box; }
  .tl-item.person .tl-dot { background:#25302d; border-color:#25302d; }
  .tl-item.bad .tl-dot { background:#e5484d; border-color:#e5484d; }
  .tl-item b { display:block; font-size:13.5px; font-weight:600; color:#6c7a76; line-height:1.5; }
  .tl-item.person b { color:#1c2b27; font-weight:700; }
  .tl-item.bad b { color:#e5484d; font-weight:700; }
  .tl-meta { display:flex; align-items:center; gap:8px; margin-top:4px; }
  .tl-meta time { font-size:11.5px; color:#9aa8a4; font-weight:600; }
  .tl-meta i { width:1px; height:10px; background:#e3e8e6; display:block; flex:none; }
  .tl-meta span { font-size:11px; font-weight:700; color:#7c8a86; background:#f1f4f3; border-radius:5px; padding:2px 6px; }
  .tl-empty { padding:26px 0 30px; text-align:center; color:var(--gray); font-size:13px; font-weight:700; }
  .col-actions { text-align:right; }
  .pay-sel { border:none; background:none; color:inherit; font:inherit; cursor:pointer; padding:0 0 0 1px; margin:0; appearance:none; -webkit-appearance:none; }
  .pay-sel:focus { outline:none; }
  .table-card { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; max-width:100%; box-shadow:0 4px 14px rgba(15,46,39,.04); }
  table { width:100%; border-collapse:collapse; }
  th { background:#fafbfc; text-align:left; color:var(--sub); font-size:12.5px; font-weight:800; padding:13px 16px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:14px 16px; border-bottom:1px solid #f2f5f4; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:#fbfdfc; }
  .mini { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:7px 10px; font:800 12px Pretendard; text-decoration:none; cursor:pointer; }
  .mini.green { border-color:var(--deep); color:#fff; background:var(--deep); }
  .empty { text-align:center; padding:70px 20px; color:var(--gray); line-height:1.6; }
  .empty b { color:var(--ink); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#123a33; color:#fff; padding:12px 22px; border-radius:12px; font-size:14px; font-weight:700; opacity:0; transition:.25s; z-index:80; pointer-events:none; }
  .toast.on { opacity:1; }

  /* ── 예약 표: 가로 스크롤 + 밀도 ── */
  .table-card { overflow:auto; }
  .table-card table { min-width:1286px; table-layout:fixed; }
  .table-card th { padding:13px 12px; font-size:12px; overflow:hidden; text-overflow:ellipsis; }
  .table-card td { padding:13px 12px; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .table-card td.td-wrap { white-space:normal; overflow:visible; text-overflow:clip; }
  .table-card::-webkit-scrollbar { height:12px; }
  .table-card::-webkit-scrollbar-track { background:#f2f5f4; border-radius:999px; }
  .table-card::-webkit-scrollbar-thumb { background:#cbd8d4; border-radius:999px; border:3px solid #f2f5f4; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--ink); }
  .num { color:var(--gray); font-weight:800; }
  .contract-badge { display:inline-flex; align-items:center; justify-content:center; min-width:62px; border-radius:9px; padding:8px 10px; font-weight:900; font-size:12px; }
  .contract-badge.signed { background:#e8f7f2; color:#0a6a5e; }
  .contract-badge.unsigned { background:#fbeceb; color:#b84e44; }
  /* 배정 상태 — 진행 바 + 요약 */
  .assign-status { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .assign-bar { display:flex; align-items:center; gap:9px; }
  .assign-track { flex:1; height:6px; border-radius:99px; background:#eef1f0; overflow:hidden; min-width:56px; max-width:118px; }
  .assign-track > span { display:block; height:100%; border-radius:99px; background:#e0913a; transition:width .2s; }
  .assign-track.ok > span { background:var(--accent); }
  .assign-count { font-size:11.5px; font-weight:900; color:#b76d14; white-space:nowrap; }
  .assign-count.ok { color:#0a6a5e; }
  .assign-detail { font-size:11.5px; font-weight:700; color:var(--gray); line-height:1.35; white-space:normal; }
  /* 결제 — 예약금·잔금 통합 (금액 + 인라인 상태 텍스트, 클릭 시 편집) */
  .pay-two { display:flex; flex-direction:column; gap:6px; }
  .pay-line { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .pay-label { font-size:11px; font-weight:800; color:var(--gray); width:30px; flex:none; }
  .pay-line .amount { font-weight:800; font-size:12px; }
  .pay-stat { display:inline-flex; align-items:center; font-weight:800; font-size:11.5px; cursor:pointer; }
  .pay-stat[data-v="입금완료"] { color:#0a6a5e; }
  .pay-stat[data-v="현지현금전달"], .pay-stat[data-v="현장현금전달"], .pay-stat[data-v="계좌입금"], .pay-stat[data-v="카드결제"] { color:#b76d14; }
  .pay-stat[data-v="미입금"], .pay-stat[data-v="미수령"] { color:#b84e44; }
  .pay-stat select { color:inherit; }
  /* 여행 기간·지역 */
  .period { display:flex; flex-direction:column; gap:3px; }
  .period .range { font-weight:700; font-size:12px; white-space:nowrap; }
  .period .arrow { color:var(--gray); margin:0 4px; }
  .period .sub { color:var(--gray); font-size:11.5px; font-weight:700; }
  .dday { display:inline-block; margin-left:6px; font-size:10.5px; font-weight:900; color:#b76d14; background:#fff3df; border-radius:6px; padding:1px 6px; vertical-align:middle; }
  /* 고객명 + 인원 */
  .cust-name b { font-size:13px; font-weight:800; display:block; }
  .cust-name .pax { color:var(--gray); font-size:11.5px; font-weight:700; }
  /* 관리 액션 */
  .row-actions { display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .mini.wide { width:100%; text-align:center; padding:9px 8px; }
  .row-sub-actions { display:flex; gap:6px; }
  .row-sub-actions .mini { flex:1; text-align:center; padding:7px 6px; }

  @media (max-width:900px){ .stats{grid-template-columns:repeat(2,1fr)} .hide-sm{display:none} }
  @media (max-width:760px){ .shell{display:block} .side{display:none} .content{width:100%;padding:20px 14px} .stats{grid-template-columns:1fr 1fr} th.hide-xs,td.hide-xs{display:none} }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-brand"><span class="logo">▲</span><div><b>몽골리아 은하수</b><small>몽골리아 관리자</small></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ADMIN_TOKEN = sessionStorage.getItem("leaders_admin_token") || "";
const IS_LOCAL = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
/* monthFilter: "전체" | "미정" | "YYYY"(연 단위) | "YYYY-MM"(월 단위), viewYear: 월 그리드에 표시 중인 연도 */
let RECORDS = [], filter = "전체", query = "", monthFilter = "전체", viewYear = "";
let SELECTED = new Set();
let toastT;
function toast(m){ $("toast").textContent = m; $("toast").classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>$("toast").classList.remove("on"), 2400); }
const dateOnly = s => s ? String(s).slice(0, 10) : "";
const paxSum = r => (Number(r.adult)||0) + (Number(r.child)||0) + (Number(r.infant)||0);
const period = r => `${dateOnly(r.depart) || "?"} ~ ${dateOnly(r.return_) || "?"}${r.nights ? ` (${r.nights}박 ${Number(r.nights) + 1}일)` : ""}`;
const dDay = r => {
  if (!r.depart) return null;
  const a = new Date(dateOnly(r.depart) + "T00:00:00");
  const b = new Date(new Date().toISOString().slice(0,10) + "T00:00:00");
  return Math.ceil((a - b) / 86400000);
};
const lodges = r => (((r.booking || {}).assign || {}).lodges || []).filter(l => l && l.name);
const vehicle = r => (((r.booking || {}).assign || {}).vehicle || {});
const guide = r => (((r.booking || {}).assign || {}).guide || {});
const signed = r => !!(((r.booking || {}).contract || {}).signedAt);
const hasVehicle = r => !!vehicle(r).model;
const hasLodges = r => lodges(r).length > 0;
const isReservation = r => (r.status === "예약확정") || !!r.booking;
const assignDone = r => !!guide(r).name && hasVehicle(r) && hasLodges(r);
const reservationOrder = r => {
  const bk = r.booking || {};
  return bk.confirmedAt || r.receivedAt || r.id || "";
};
/* ── 목록 파생값 ── */
const bookDate = r => dateOnly((r.booking || {}).confirmedAt || r.receivedAt);   // 예약일
const monthOf = s => { const d = dateOnly(s); return d ? `${Number(d.slice(5, 7))}월` : "-"; };
const ymOf = r => { const d = dateOnly(r.depart); return d ? d.slice(0, 7) : ""; };   // 출발 연-월 (YYYY-MM)
const nightsTxt = r => r.nights != null && r.nights !== "" ? (Number(r.nights) === 0 ? "당일" : `${r.nights}박${Number(r.nights) + 1}일`) : "-";
const TODAY = new Date().toISOString().slice(0, 10);
const progressAuto = r => {                                    // 진행상황 자동 판단
  const ret = dateOnly(r.return_);
  if (r.status === "보류") return "계약대기";
  if (ret && ret < TODAY) return "투어종료";
  if (signed(r)) return "계약완료";
  return "계약대기";
};
const progressOf = r => r.progress || progressAuto(r);
/* 인라인 편집 필드 옵션 */
const FIELD_OPTS = {
  joinType:   ["조인x", "조인1차", "조인2차"],
  flightIncl: ["불포함", "포함"],
  progress:   ["계약대기", "계약완료", "투어종료", "예약취소"],
  pkgTier:    ["풀패키지", "실속", "최고급"],
};
const PAY_OPTS = {
  depositStatus: ["미입금", "입금완료"],
  balanceStatus: ["미수령", "입금완료", "현지현금전달", "계좌입금", "카드결제"],
};
/* ── 통계 카드 미니 차트 ──
   수치는 모두 실제 예약에서 집계한 값입니다 (임의의 예시값을 그리지 않습니다).
   추이는 영역 스파크라인, 시점별 건수는 막대로 구분합니다. */
const ymKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const monthSpan = (count, offset) => {
  const now = new Date(), out = [];
  for (let i = 0; i < count; i++) out.push(ymKey(new Date(now.getFullYear(), now.getMonth() + offset + i, 1)));
  return out;
};
const countByMonth = (list, monthOfRec, months) => months.map(m => list.filter(r => monthOfRec(r) === m).length);
const sparkArea = (vals, color) => {
  const w = 78, h = 34, pad = 3, n = vals.length;
  if (!n) return "";
  const max = Math.max(...vals, 1);
  const x = i => (n === 1 ? w - pad : pad + (i / (n - 1)) * (w - pad * 2));
  const y = v => h - pad - (v / max) * (h - pad - 5);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="stat-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon points="${x(0).toFixed(1)},${h - pad} ${pts} ${x(n - 1).toFixed(1)},${h - pad}" fill="${color}" opacity=".15"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(n - 1).toFixed(1)}" cy="${y(vals[n - 1]).toFixed(1)}" r="2.4" fill="${color}"/>
  </svg>`;
};
const barChart = (vals, color) => {
  const w = 78, h = 34, pad = 3, n = vals.length;
  if (!n) return "";
  const max = Math.max(...vals, 1);
  const gap = 3;
  const bw = Math.max(3, (w - pad * 2 - (n - 1) * gap) / n);
  const bars = vals.map((v, i) => {
    const bh = v > 0 ? Math.max(3, (v / max) * (h - pad * 2)) : 2;
    return `<rect x="${(pad + i * (bw + gap)).toFixed(1)}" y="${(h - pad - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.6" fill="${color}" opacity="${v === 0 ? .16 : i === n - 1 ? 1 : .38}"/>`;
  }).join("");
  return `<svg class="stat-chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${bars}</svg>`;
};
/* 마지막 새로고침 시각 — "3분 전 업데이트" */
let LOADED_AT = null;
function renderUpdatedAt() {
  const el = $("updatedAt");
  if (!el) return;
  if (!LOADED_AT) { el.textContent = ""; return; }
  const min = Math.floor((Date.now() - LOADED_AT) / 60000);
  el.textContent = min < 1 ? "방금 업데이트" : min < 60 ? `${min}분 전 업데이트` : `${Math.floor(min / 60)}시간 전 업데이트`;
}
setInterval(renderUpdatedAt, 30000);

/* 정렬 상태 — 기본: 예약일 오름차순 (번호가 위→아래 증가) */
let sortKey = "book", sortDir = 1;
const SORT_VALS = {
  book: bookDate, name: r => r.name || "", depart: r => dateOnly(r.depart),
  return: r => dateOnly(r.return_), pax: paxSum, progress: progressOf, status: progressOf,
  balance: r => Number((((r.booking || {}).contractInfo) || {}).balanceAmount || 0), month: r => dateOnly(r.depart),
};

async function load() {
  if (!ADMIN_TOKEN && !IS_LOCAL) {
    $("list").innerHTML = `<div class="empty"><b>관리자 로그인이 필요합니다.</b><br>대시보드에서 로그인한 뒤 다시 열어주세요.<br><br><a class="btn primary" href="/admin">대시보드로 이동</a></div>`;
    $("stats").innerHTML = "";
    $("chips").innerHTML = "";
    return;
  }
  try {
    if (IS_LOCAL) {
      RECORDS = JSON.parse(localStorage.getItem("leaders_requests") || "[]");
    } else {
      const res = await fetch("/api/requests", { headers:{ "x-admin-token": ADMIN_TOKEN }, cache:"no-store" });
      if (res.status === 401) throw new Error("관리자 인증이 만료됐어요. 대시보드에서 다시 로그인해 주세요.");
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "목록을 불러오지 못했어요");
      RECORDS = j.items || [];
    }
    LOADED_AT = Date.now();
    render();
  } catch (e) {
    $("list").innerHTML = `<div class="empty">⚠ ${esc(e.message)}</div>`;
  }
}

function rows() {
  const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return RECORDS.filter(isReservation).filter(r => {
    const dd = dDay(r);
    const missing = !assignDone(r);
    if (monthFilter !== "전체") {
      const ym = ymOf(r);
      if (monthFilter === "미정") { if (ym) return false; }
      else if (monthFilter.length === 4) { if (ym.slice(0, 4) !== monthFilter) return false; }
      else if (ym !== monthFilter) return false;
    }
    if (filter === "계약미서명" && signed(r)) return false;
    if (filter === "배정미완료" && !missing) return false;
    if (filter === "출발임박" && !(dd !== null && dd >= 0 && dd <= 14)) return false;
    if (!terms.length) return true;
    const c = (((r.booking || {}).contractInfo) || {});
    const fl = (((r.booking || {}).flight) || {});
    const travelers = Array.isArray(((r.booking || {}).travelers)) ? r.booking.travelers : [];
    const text = [
      r.id, r.token, r.name, r.phone, r.destination, r.tripType, r.vehicle, vehicle(r).model, guide(r).name, guide(r).phone,
      progressOf(r), signed(r) ? "서명완료 계약완료" : "미서명", r.joinType, r.pkgTier,
      bookDate(r), dateOnly(r.depart), dateOnly(r.return_), monthOf(r.depart), nightsTxt(r), String(paxSum(r) || ""),
      c.productName, c.region, c.depositStatus, c.balanceStatus, c.cashReceipt, fl.inNo, fl.outNo, fl.inTime, fl.outTime,
      ...lodges(r).map(l => `${l.name} ${l.grade || ""}`),
      ...travelers.map(t => `${t.nameKo || ""} ${t.passportName || ""} ${t.phone || ""} ${t.passportNo || ""}`),
    ].join(" ").toLowerCase();
    return terms.every(t => text.includes(t));
  }).sort((a, b) => {
    const f = SORT_VALS[sortKey] || bookDate;
    const av = f(a), bv = f(b);
    const c = typeof av === "number" ? av - bv : String(av).localeCompare(String(bv));
    return c * sortDir;
  });
}
/* 번호: 전체 예약을 예약일 오름차순으로 세운 고정 번호 (정렬·필터와 무관하게 유지) */
function rowNumbers() {
  const map = {};
  RECORDS.filter(isReservation)
    .slice().sort((a, b) => String(bookDate(a)).localeCompare(String(bookDate(b))))
    .forEach((r, i) => { map[String(r.id)] = i + 1; });
  return map;
}
/* ── 고객 진행 타임라인 — 레코드에 남은 기록으로 "누가 · 언제 · 무엇을" 재구성
   (대시보드 admin.html의 customerTimeline과 같은 기준입니다) ── */
function customerTimeline(r) {
  const ev = [];
  const b = r.booking || {};
  const acts = Array.isArray(r.activities) ? r.activities : [];
  if (r.receivedAt) ev.push({ at:r.receivedAt, who:"고객", label:"견적 문의 접수" });
  const quoteSent = r.quoteIssuedAt || (r.notify && r.notify.quoteSentAt);
  if (r.quote && quoteSent) ev.push({ at:quoteSent, who:"관리자", label:"견적서 발행" });
  const NOTI = {
    quote_notification_queued:"견적 확인 알림톡 발송 요청",
    quote_notification_skipped:"견적 알림톡 미발송 · 설정/전화번호 확인",
    itinerary_notification_queued:"확정일정표 확인 알림톡 발송 요청",
    itinerary_notification_skipped:"일정표 알림톡 미발송 · 설정/전화번호 확인",
    contract_notification_queued:"계약서 서명 안내 발송 요청",
    contract_notification_skipped:"계약서 안내 미발송 · 설정/전화번호 확인",
    travel_notice_sent:"여행 주의사항 발송",
    travel_notice_failed:"여행 주의사항 발송 실패",
  };
  acts.filter(a => a && NOTI[a.type]).forEach(a =>
    ev.push({ at:a.at, who:"자동", label:NOTI[a.type], bad:/skipped|failed/.test(a.type) }));
  if (r.decision && r.decision.status === "accepted" && r.decision.acceptedAt) {
    ev.push(r.decision.source === "customer"
      ? { at:r.decision.acceptedAt, who:"고객", label:"'이 견적으로 예약 진행하기' 클릭" }
      : { at:r.decision.acceptedAt, who:"관리자", label:"전화·카톡 수락 기록" });
  }
  if (b.depositRequest && b.depositRequest.status === "requested" && b.depositRequest.requestedAt)
    ev.push({ at:b.depositRequest.requestedAt, who:"자동", label:"예약금·입금 계좌 안내 표시" });
  if (b.depositReport && b.depositReport.status === "reported" && b.depositReport.reportedAt)
    ev.push({ at:b.depositReport.reportedAt, who:"고객", label:`입금 완료 신고 (입금자명 ${b.depositReport.name || "-"})` });
  const paidAct = acts.filter(a => a && a.type === "deposit_confirmed").pop();
  if (paidAct) ev.push({ at:paidAct.at, who:"관리자", label:"예약금 입금 확인" });
  if (b.contractRequest && b.contractRequest.status === "requested" && b.contractRequest.requestedAt)
    ev.push({ at:b.contractRequest.requestedAt, who:"자동", label:"계약서 서명·여행자 정보 요청 발송" });
  if (b.contract && b.contract.signedAt) ev.push({ at:b.contract.signedAt, who:"고객", label:"계약서 서명 완료" });
  if (b.travelerSubmission && b.travelerSubmission.submittedAt)
    ev.push({ at:b.travelerSubmission.submittedAt, who:"고객", label:`여행자 정보 제출 (${b.travelerSubmission.submittedCount || 0}명)` });
  (Array.isArray(r.changeRequests) ? r.changeRequests : []).forEach(x => {
    const at = x && (x.at || x.requestedAt);
    if (at) ev.push({ at, who:"고객", label:`일정 변경 요청${x.status === "resolved" ? " · 처리됨" : ""}` });
  });
  if (b.confirmedAt) ev.push({ at:b.confirmedAt, who:"관리자", label:"예약 확정" });
  if (b.publishedAt) ev.push({ at:b.publishedAt, who:"관리자", label:"확정 일정표 공개" });
  return ev.filter(e => e.at && !isNaN(new Date(e.at))).sort((a, b2) => new Date(a.at) - new Date(b2.at));
}
const tlDate = t => {
  const d = new Date(t);
  return `${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
};
const tlClock = t => {
  const d = new Date(t);
  return String(t).length > 10 ? `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` : "";
};
const tlTime = t => `${tlDate(t)}${tlClock(t) ? " " + tlClock(t) : ""}`;
/* 표 안에는 마지막 단계만 요약해서 보여주고, 누르면 전체를 패널로 펼칩니다 */
function timelineCell(r) {
  const ev = customerTimeline(r);
  if (!ev.length) return `<span class="none" style="font-size:12px;color:var(--gray);font-weight:700">기록 없음</span>`;
  const last = ev[ev.length - 1];
  return `<button type="button" class="tl-cell" data-tl="${esc(r.id)}" title="눌러서 전체 진행 기록 보기">
    <span class="step ${last.bad ? "bad" : ""}"><i></i><span>${esc(last.label)}</span></span>
    <span class="meta">${tlTime(last.at)} · ${esc(last.who)} · 총 ${ev.length}단계</span>
  </button>`;
}
/* 전체 기록 — 날짜로 묶고, 마지막 날짜만 진하게 (지난 날짜는 흐리게) */
function openTimeline(id) {
  const r = RECORDS.find(x => String(x.id) === String(id));
  if (!r) return;
  const ev = customerTimeline(r);
  const groups = [];
  ev.forEach(e => {
    const day = tlDate(e.at);
    const g = groups.length && groups[groups.length - 1].day === day ? groups[groups.length - 1] : (groups.push({ day, items:[] }), groups[groups.length - 1]);
    g.items.push(e);
  });
  $("tlBody").innerHTML = groups.length
    ? groups.map((g, gi) => `<div class="tl-group ${gi < groups.length - 1 ? "past" : ""}">
        <div class="tl-date">${g.day}</div>
        ${g.items.map(e => `<div class="tl-item ${e.bad ? "bad" : e.who !== "자동" ? "person" : ""}">
          <span class="tl-dot"></span>
          <b>${esc(e.label)}</b>
          <span class="tl-meta"><time>${tlClock(e.at) || g.day}</time><i></i><span>${esc(e.who)}</span></span>
        </div>`).join("")}
      </div>`).join("")
    : `<div class="tl-empty">아직 남은 진행 기록이 없습니다.</div>`;
  $("tlWho").textContent = `${r.name || "고객"} · ${r.destination || "여행지 미정"}`;
  $("tlMask").classList.add("on");
  $("tlPanel").scrollTop = $("tlPanel").scrollHeight;   // 최근 기록이 먼저 보이도록
}
const closeTimeline = () => $("tlMask").classList.remove("on");

const selectedRecords = () => RECORDS.filter(r => SELECTED.has(String(r.id)));
function cleanupSelection() {
  const ids = new Set(RECORDS.filter(isReservation).map(r => String(r.id)));
  SELECTED = new Set([...SELECTED].filter(id => ids.has(id)));
}
function renderBulkbar(data) {
  const visible = data.map(r => String(r.id));
  const selected = selectedRecords();
  const allVisibleSelected = visible.length > 0 && visible.every(id => SELECTED.has(id));
  $("bulkbar").innerHTML = `
    <span class="count">선택 ${selected.length}건</span>
    <button class="bulkbtn" id="bulkVisible">${allVisibleSelected ? "현재 목록 선택 해제" : "현재 목록 전체 선택"}</button>
    <button class="bulkbtn" id="bulkClear" ${selected.length ? "" : "disabled"}>선택 해제</button>
    <button class="bulkbtn primary" id="bulkClone" ${selected.length ? "" : "disabled"}>선택 예약 복제</button>
    <button class="bulkbtn danger" id="bulkDelete" ${selected.length ? "" : "disabled"}>선택 영구 삭제</button>
  `;
  $("bulkVisible").onclick = () => {
    if (allVisibleSelected) visible.forEach(id => SELECTED.delete(id));
    else visible.forEach(id => SELECTED.add(id));
    render();
  };
  $("bulkClear").onclick = () => { SELECTED.clear(); render(); };
  $("bulkClone").onclick = cloneSelected;
  $("bulkDelete").onclick = deleteSelected;
}

function render() {
  cleanupSelection();
  const sortSel = $("sortSelect");
  const sortBtn = $("sortDirBtn");
  if (sortSel) sortSel.value = SORT_VALS[sortKey] ? sortKey : "book";
  if (sortBtn) sortBtn.textContent = sortDir > 0 ? "오름차순" : "내림차순";
  const all = RECORDS.filter(isReservation);
  const unsigned = all.filter(r => !signed(r)).length;
  const incomplete = all.filter(r => !assignDone(r)).length;
  const soon = all.filter(r => { const dd = dDay(r); return dd !== null && dd >= 0 && dd <= 14; }).length;
  const ICO = {
    clip:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 15l2 2 5-5"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    pen:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`,
    users: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
    clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>`,
  };
  /* 카드별 미니 차트 데이터 — 모두 현재 예약에서 집계한 실제 값 */
  const past6 = monthSpan(6, -5);          // 지난 5개월 + 이번 달
  const next6 = monthSpan(6, 0);           // 이번 달 + 앞으로 5개월
  const bookMonth = r => bookDate(r).slice(0, 7);
  const soonBuckets = [0, 0, 0, 0, 0, 0, 0];   // 향후 14일을 2일 단위로
  all.forEach(r => { const dd = dDay(r); if (dd !== null && dd >= 0 && dd <= 13) soonBuckets[Math.floor(dd / 2)] += 1; });
  const statDefs = [
    { c:"c-teal", ico:ICO.clip, pill:"전체", dot:false, k:"예약 확정", v:all.length, sub:"전체 확정 고객", f:"전체",
      chart:sparkArea(countByMonth(all, bookMonth, past6), "#06c4a0"), tip:"최근 6개월 예약 확정 추이" },
    { c:"c-red", ico:ICO.pen, pill:"조치 필요", dot:true, k:"계약 미서명", v:unsigned, sub:"서명 요청 필요", f:"계약미서명",
      chart:barChart(countByMonth(all.filter(r => !signed(r)), ymOf, next6), "#d96a5e"), tip:"출발월별 미서명 건수 (이번 달부터 6개월)" },
    { c:"c-amber", ico:ICO.users, pill:"조치 필요", dot:true, k:"배정 미완료", v:incomplete, sub:"가이드·차량·숙소 확인", f:"배정미완료",
      chart:sparkArea(countByMonth(all.filter(r => !assignDone(r)), ymOf, next6), "#d9932f"), tip:"출발월별 배정 미완료 건수 (이번 달부터 6개월)" },
    { c:"c-green", ico:ICO.clock, pill:"임박", dot:true, k:"14일 내 출발", v:soon, sub:"출발 전 최종 점검", f:"출발임박",
      chart:barChart(soonBuckets, "#1f9d76"), tip:"향후 14일 출발 건수 (2일 단위)" },
  ];
  $("stats").innerHTML = statDefs.map(s => `<button type="button" class="stat ${s.c} ${filter === s.f ? "on" : ""}" data-f="${s.f}" title="${esc(s.tip)} · 눌러서 ${esc(s.k)}만 보기">
    <div class="stat-top">
      <span class="stat-ico">${s.ico}</span>
      <span class="stat-k">${s.k}</span>
      <span class="stat-pill">${s.dot ? "<i></i>" : ""}${s.pill}</span>
    </div>
    <div class="stat-bot">
      <span>
        <span class="stat-v">${s.v}<span class="unit">건</span></span>
        <span class="stat-sub" style="display:block">${s.sub}</span>
      </span>
      ${s.chart}
    </div>
  </button>`).join("");
  $("stats").querySelectorAll(".stat").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  const chipDefs = [["전체", all.length], ["계약미서명", unsigned], ["배정미완료", incomplete], ["출발임박", soon]];
  $("chips").innerHTML = chipDefs.map(([k, n]) => `<button class="chip ${filter===k?"on":""}" data-f="${k}">${k}<b>${n}</b></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  renderUpdatedAt();

  /* 월별 필터 — 출발월 기준. 연도는 ‹ › 로 넘기고 12개월은 항상 고정 그리드로 표시해
     예약 연도가 몇 년치로 늘어나도 필터 영역의 폭·높이가 그대로 유지된다. */
  const monthCounts = {};
  let undated = 0;
  all.forEach(r => { const ym = ymOf(r); if (ym) monthCounts[ym] = (monthCounts[ym] || 0) + 1; else undated++; });
  const years = [...new Set(Object.keys(monthCounts).map(k => k.slice(0, 4)))].sort();
  const yearCount = y => Object.keys(monthCounts).reduce((s, k) => s + (k.startsWith(y) ? monthCounts[k] : 0), 0);
  /* 선택값이 더 이상 존재하지 않는 기간이면 전체로 되돌린다 */
  if (monthFilter === "미정" && !undated) monthFilter = "전체";
  else if (monthFilter.length === 7 && !monthCounts[monthFilter]) monthFilter = "전체";
  else if (monthFilter.length === 4 && !years.includes(monthFilter)) monthFilter = "전체";
  /* 표시 연도: 선택된 기간의 연도 → 올해 → 올해 이후 가장 가까운 해 → 마지막 해 */
  const thisYear = String(new Date().getFullYear());
  if (monthFilter.length === 4 || monthFilter.length === 7) viewYear = monthFilter.slice(0, 4);
  else if (!viewYear || !years.includes(viewYear)) {
    viewYear = years.includes(thisYear) ? thisYear : (years.find(y => y > thisYear) || years[years.length - 1] || thisYear);
  }
  const yi = years.indexOf(viewYear);
  const prevYear = yi > 0 ? years[yi - 1] : (years.filter(y => y < viewYear).pop() || "");
  const nextYear = yi >= 0 ? (years[yi + 1] || "") : (years.find(y => y > viewYear) || "");
  const calIco = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
  const cells = Array.from({ length: 12 }, (_, i) => {
    const ym = `${viewYear}-${String(i + 1).padStart(2, "0")}`;
    const n = monthCounts[ym] || 0;
    return `<button class="mcell ${monthFilter === ym ? "on" : ""}" data-m="${ym}" ${n ? "" : "disabled"} title="${viewYear}년 ${i + 1}월 출발 ${n}건">
      <span class="m">${i + 1}월</span><span class="n">${n ? n + "건" : "–"}</span></button>`;
  }).join("");
  $("monthTabs").innerHTML = `
    <span class="mbar-label">${calIco}출발월</span>
    <button class="mpill ${monthFilter === "전체" ? "on" : ""}" data-m="전체">전체<b>${all.length}</b></button>
    ${undated ? `<button class="mpill ${monthFilter === "미정" ? "on" : ""}" data-m="미정">날짜 미정<b>${undated}</b></button>` : ""}
    <span class="mbar-div"></span>
    <div class="yrnav">
      <button class="yrbtn" data-y-go="${prevYear}" ${prevYear ? "" : "disabled"} title="${prevYear ? prevYear + "년으로" : "이전 예약 없음"}">‹</button>
      <button class="yrname ${monthFilter === viewYear ? "on" : ""}" data-m="${viewYear}" title="${viewYear}년 전체 ${yearCount(viewYear)}건 보기">${viewYear}<small>년</small></button>
      <button class="yrbtn" data-y-go="${nextYear}" ${nextYear ? "" : "disabled"} title="${nextYear ? nextYear + "년으로" : "다음 예약 없음"}">›</button>
    </div>
    <div class="mcells">${cells}</div>`;
  $("monthTabs").querySelectorAll("[data-m]").forEach(b => b.onclick = () => { monthFilter = b.dataset.m; render(); });
  $("monthTabs").querySelectorAll("[data-y-go]").forEach(b => b.onclick = () => {
    if (!b.dataset.yGo) return;
    viewYear = b.dataset.yGo;
    if (monthFilter.length === 4 || monthFilter.length === 7) monthFilter = "전체";   // 연도만 넘길 때는 선택 해제
    render();
  });

  const data = rows();
  renderBulkbar(data);
  if (!data.length) {
    $("list").innerHTML = `<div class="empty">조건에 맞는 예약이 없습니다.</div>`;
    return;
  }
  const contractCell = r => {
    const accepted = !!(r.decision && r.decision.status === "accepted") || r.status === "예약확정";
    if (!accepted) return `<span class="contract-badge unsigned">수락대기</span>`;
    return signed(r)
      ? `<span class="contract-badge signed">서명완료</span>`
      : `<span class="contract-badge unsigned">서명대기</span>`;
  };
  const assignCell = r => {
    const checks = [
      ["가이드", !!guide(r).name],
      ["차량", hasVehicle(r)],
      ["숙소", hasLodges(r)],
    ];
    const total = checks.length;
    const done = checks.filter(([, ok]) => ok).length;
    const allOk = done === total;
    const pct = Math.round((done / total) * 100);
    const doneLabels = checks.filter(([, ok]) => ok).map(([l]) => l);
    const pendLabels = checks.filter(([, ok]) => !ok).map(([l]) => l);
    const detail = allOk ? "가이드·차량·숙소 모두 배정"
      : `${doneLabels.length ? `${doneLabels.join("·")} 배정 · ` : ""}${pendLabels.join("·")} 대기`;
    return `<div class="assign-status">
      <div class="assign-bar">
        <div class="assign-track ${allOk ? "ok" : ""}"><span style="width:${pct}%"></span></div>
        <span class="assign-count ${allOk ? "ok" : ""}">${allOk ? "배정 완료" : `${done}/${total} 완료`}</span>
      </div>
      <div class="assign-detail">${esc(detail)}</div>
    </div>`;
  };
  /* 결제 상태는 예약의 contractInfo를 기준으로 표시 */
  const payStatus = (r, field) => {
    const c = (((r.booking || {}).contractInfo) || {});
    const ck = (((r.booking || {}).checklist) || {});
    if (field === "depositStatus") return c.depositStatus || (ck.deposit ? "입금완료" : "미입금");
    return c.balanceStatus || (ck.balance ? "입금완료" : "미수령");
  };
  const paySelect = (r, statusField) => {
    const cur = payStatus(r, statusField);
    return `<span class="pay-stat" data-v="${esc(cur)}">·<select class="pay-sel" data-status="${statusField}" data-id="${esc(r.id)}" data-v="${esc(cur)}">
      ${PAY_OPTS[statusField].map(o => `<option value="${o}" ${cur === o ? "selected" : ""}>${o}</option>`).join("")}
    </select></span>`;
  };
  const payCell = r => {
    const ci = (((r.booking || {}).contractInfo) || {});
    const deposit = Number(ci.depositAmount) || 0;
    const balance = Number(ci.balanceAmount) || 0;
    return `<div class="pay-two">
      <div class="pay-line"><span class="pay-label">예약금</span><span class="amount">${moneyTxt(deposit)}</span>${paySelect(r, "depositStatus")}</div>
      <div class="pay-line"><span class="pay-label">잔금</span><span class="amount">${moneyTxt(balance)}</span>${paySelect(r, "balanceStatus")}</div>
    </div>`;
  };
  const nameCell = r => `<div class="cust-name"><b>${esc(r.name || "-")}</b><span class="pax">${paxSum(r) ? `${paxSum(r)}명` : "인원 미정"}</span></div>`;
  const periodCell = r => {
    const dep = dateOnly(r.depart), ret = dateOnly(r.return_);
    const dd = dDay(r);
    const ddChip = (dd !== null && dd >= 0 && dd <= 14) ? `<span class="dday">${dd === 0 ? "D-DAY" : "D-" + dd}</span>` : "";
    const nt = nightsTxt(r);
    const sub = [nt !== "-" ? nt : "", r.destination || ""].filter(Boolean).join(" · ");
    return `<div class="period">
      <div class="range">${esc(dep || "?")}<span class="arrow">→</span>${esc(ret || "?")}${ddChip}</div>
      <div class="sub">${esc(sub || "-")}</div>
    </div>`;
  };
  const actionsCell = (r, token) => `<div class="row-actions">
    <button class="mini green wide" data-open="${esc(r.id)}">배정 관리</button>
    <div class="row-sub-actions">
      ${token ? `<a class="mini" href="확정일정표.html?t=${encodeURIComponent(token)}&v=assign3" target="_blank">일정표</a>` : ""}
      ${token ? `<a class="mini" href="계약서.html?t=${encodeURIComponent(token)}&adminId=${encodeURIComponent(r.id)}&return=list">${signed(r) ? "서명 원본" : "계약서"}</a>` : ""}
      <button class="mini" data-guide-sheet="${esc(r.id)}">가이드 시트 PDF</button>
    </div>
  </div>`;
  const arrow = k => sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : "";
  const nums = rowNumbers();
  const visibleIds = data.map(r => String(r.id));
  const allChecked = visibleIds.length > 0 && visibleIds.every(id => SELECTED.has(id));

  $("list").innerHTML = `<table>
    <colgroup>
      <col style="width:38px"><col style="width:40px"><col style="width:92px"><col style="width:120px">
      <col style="width:180px"><col style="width:72px"><col style="width:170px">
      <col style="width:214px"><col style="width:168px"><col style="width:172px">
    </colgroup>
    <thead><tr>
      <th><input class="rowcheck" type="checkbox" id="checkAllRows" ${allChecked ? "checked" : ""} title="현재 목록 전체 선택"></th>
      <th>번호</th>
      <th class="sortable" data-k="book">예약일${arrow("book")}</th>
      <th class="sortable" data-k="name">고객명${arrow("name")}</th>
      <th class="sortable" data-k="depart">여행 기간·지역${arrow("depart")}</th>
      <th>계약</th>
      <th>배정 상태</th>
      <th>결제</th>
      <th class="col-receipt">진행 상황</th>
      <th class="col-actions">관리</th>
    </tr></thead>
    <tbody>${data.map(r => {
      const token = r.token || "";
      const ci = (((r.booking || {}).contractInfo) || {});
      return `<tr data-id="${esc(r.id)}">
        <td><input class="rowcheck row-select" type="checkbox" data-select="${esc(r.id)}" ${SELECTED.has(String(r.id)) ? "checked" : ""} title="예약 선택"></td>
        <td class="num">${nums[String(r.id)] || "-"}</td>
        <td>${esc(bookDate(r) || "-")}</td>
        <td>${nameCell(r)}</td>
        <td class="td-wrap">${periodCell(r)}</td>
        <td>${contractCell(r)}</td>
        <td class="td-wrap">${assignCell(r)}</td>
        <td class="td-wrap col-pay">${payCell(r)}</td>
        <td class="col-receipt">${timelineCell(r)}</td>
        <td class="col-actions">${actionsCell(r, token)}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
  $("checkAllRows").onchange = e => {
    visibleIds.forEach(id => e.target.checked ? SELECTED.add(id) : SELECTED.delete(id));
    render();
  };
  $("list").querySelectorAll("[data-select]").forEach(cb => {
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => {
      if (cb.checked) SELECTED.add(String(cb.dataset.select));
      else SELECTED.delete(String(cb.dataset.select));
      render();
    };
  });
  $("list").querySelectorAll("[data-tl]").forEach(btn => btn.onclick = e => { e.stopPropagation(); openTimeline(btn.dataset.tl); });
  $("list").querySelectorAll("[data-open]").forEach(btn => btn.onclick = () => openBooking(btn.dataset.open));
  $("list").querySelectorAll("[data-guide-sheet]").forEach(btn => btn.onclick = () => openGuideSheet(btn.dataset.guideSheet));
  $("list").querySelectorAll("th.sortable").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
    render();
  });
  $("list").querySelectorAll("select.pay-sel").forEach(sel => {
    sel.onclick = e => e.stopPropagation();
    sel.onchange = () => savePaymentStatus(sel.dataset.id, sel.dataset.status, sel.value);
  });
}

async function savePaymentStatus(id, field, value) {
  const r = RECORDS.find(x => String(x.id) === String(id));
  if (!r) return;
  const prevBooking = deepClone(r.booking || {});
  const booking = { ...(r.booking || {}) };
  booking.contractInfo = { ...(booking.contractInfo || {}), [field]: value };
  booking.checklist = { ...(booking.checklist || {}) };
  if (field === "depositStatus") booking.checklist.deposit = value === "입금완료";
  if (field === "balanceStatus") booking.checklist.balance = value === "입금완료" || value === "현지현금전달" || value === "현장현금전달";
  r.booking = booking;
  try {
    if (IS_LOCAL) {
      const arr = JSON.parse(localStorage.getItem("leaders_requests") || "[]");
      const t = arr.find(x => String(x.id) === String(id));
      if (t) {
        t.booking = booking;
        localStorage.setItem("leaders_requests", JSON.stringify(arr));
      }
    } else {
      const res = await fetch(`/api/requests/${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", "x-admin-token": ADMIN_TOKEN },
        body: JSON.stringify({ booking }),
      });
      if (res.status === 401) throw new Error("관리자 인증이 만료됐어요");
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "저장 실패");
      if (j.status) r.status = j.status;
    }
    toast("✓ 입금 상태가 저장됐어요");
  } catch (e) {
    r.booking = prevBooking;
    toast("⚠ " + e.message);
  }
  render();
}
const deepClone = obj => JSON.parse(JSON.stringify(obj || {}));
const cloneRecord = (r, i, stamp) => {
  const rec = deepClone(r);
  rec.id = `clone_${stamp}_${i}`;
  rec.token = newToken();
  rec.receivedAt = new Date().toISOString();
  rec.source = "reservation-clone";
  rec.name = rec.name || "복제 예약";
  rec.memo = rec.memo || "";
  if (rec.booking) {
    rec.booking = deepClone(rec.booking);
    rec.booking.contract = null;
    rec.booking.checklist = { ...(rec.booking.checklist || {}), contract: false };
    if (!rec.booking.confirmedAt) rec.booking.confirmedAt = TODAY;
  }
  if (rec.quote && rec.quote.quoteNo) rec.quote.quoteNo = `${rec.quote.quoteNo}-COPY`;
  return rec;
};
async function cloneSelected() {
  const picked = selectedRecords();
  if (!picked.length) return toast("복제할 예약을 선택해 주세요");
  if (!confirm(`선택한 ${picked.length}건을 복제할까요?\n고객명과 일정은 그대로 복사되고, 고객 링크 토큰은 새로 생성됩니다.`)) return;
  const stamp = Date.now();
  let ok = 0, fail = 0;
  for (let i = 0; i < picked.length; i++) {
    const rec = cloneRecord(picked[i], i, stamp);
    try {
      if (IS_LOCAL) {
        const arr = JSON.parse(localStorage.getItem("leaders_requests") || "[]");
        arr.push(rec);
        localStorage.setItem("leaders_requests", JSON.stringify(arr));
      } else {
        const res = await fetch("/api/requests", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-token": ADMIN_TOKEN },
          body: JSON.stringify(rec),
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || "복제 실패");
      }
      ok++;
    } catch (e) { fail++; }
  }
  SELECTED.clear();
  await load();
  toast(`✓ ${ok}건 복제 완료${fail ? ` · 실패 ${fail}건` : ""}`);
}
async function deleteSelected() {
  const picked = selectedRecords();
  if (!picked.length) return toast("삭제할 예약을 선택해 주세요");
  const names = picked.slice(0, 5).map(r => r.name || r.id).join(", ");
  const more = picked.length > 5 ? ` 외 ${picked.length - 5}건` : "";
  if (!confirm(`선택한 ${picked.length}건을 영구 삭제할까요?\n${names}${more}\n\n삭제 후에는 복구할 수 없습니다.`)) return;
  let ok = 0, fail = 0;
  for (const r of picked) {
    try {
      if (IS_LOCAL) {
        const arr = JSON.parse(localStorage.getItem("leaders_requests") || "[]");
        localStorage.setItem("leaders_requests", JSON.stringify(arr.filter(x => String(x.id) !== String(r.id))));
      } else {
        const res = await fetch(`/api/requests/${encodeURIComponent(r.id)}`, {
          method: "DELETE",
          headers: { "x-admin-token": ADMIN_TOKEN },
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || "삭제 실패");
      }
      ok++;
    } catch (e) { fail++; }
  }
  SELECTED.clear();
  await load();
  toast(`✓ ${ok}건 삭제 완료${fail ? ` · 실패 ${fail}건` : ""}`);
}

/* 목록에서 바로 가이드 시트(담당 가이드 전달용 인쇄 페이지) 열기 —
   목록 레코드 전체를 전달 payload로 저장 후 새 창에서 인쇄 대화상자까지 자동 실행 */
function openGuideSheet(id) {
  const r = RECORDS.find(x => String(x.id) === String(id));
  if (!r) return;
  if (!r.booking) return toast("아직 예약 확정 정보가 없어요 — 배정 관리에서 먼저 저장해 주세요");
  localStorage.setItem("leaders_guide_sheet_print", JSON.stringify(r));
  window.open("가이드시트.html?adminPrint=1&print=1", "_blank");
}

function openBooking(id) {
  const r = RECORDS.find(x => String(x.id) === String(id));
  if (!r) return;
  localStorage.setItem("leaders_booking_prefill", JSON.stringify({
    id: r.id, token: r.token || "", adminToken: ADMIN_TOKEN, status: r.status || "예약확정",
    name: r.name, phone: r.phone || "", depart: r.depart || "", return_: r.return_ || "",
    adult: r.adult || 0, child: r.child || 0, infant: r.infant || 0,
    destination: r.destination || "", vehicle: r.vehicle || "",
    joinType: r.joinType || "", flightIncl: r.flightIncl || "", progress: r.progress || "", pkgTier: r.pkgTier || "",
    decision: r.decision || null, notify: r.notify || null,
    quote: r.quote || null, booking: r.booking || null,
  }));
  window.open("예약관리.html", "_blank");
}

const newToken = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
const moneyTxt = n => n ? `₩${Number(n).toLocaleString("ko-KR")}` : "-";

$("q").addEventListener("input", e => { query = e.target.value; render(); });
$("sortSelect").addEventListener("change", e => { sortKey = e.target.value; sortDir = 1; render(); });
$("sortDirBtn").onclick = () => { sortDir = -sortDir; render(); };
$("tlClose").onclick = closeTimeline;
$("tlMask").onclick = e => { if (e.target === $("tlMask")) closeTimeline(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTimeline(); });
$("refreshBtn").onclick = () => load().then(() => toast("예약 목록을 새로고침했습니다"));
load();
</script>
