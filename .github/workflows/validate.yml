name: Validate platform

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Automated tests
        run: node --test tests/*.test.mjs
      - name: Admin image integration
        run: node scripts/check-admin-media.mjs
      - name: App type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: npm run build
      - name: Compile Pages Functions
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler pages functions build functions --outdir=work/ci-functions
      - name: Function syntax
        shell: bash
        run: |
          find functions -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
