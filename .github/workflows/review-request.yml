name: Send post-tour review requests

on:
  schedule:
    # GitHub cron uses UTC. 00:00 UTC is 09:00 KST.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-tour-review-request
  cancel-in-progress: false

jobs:
  send-review-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the review-request endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://mongolia-milkyway.com/api/cron/review-request
