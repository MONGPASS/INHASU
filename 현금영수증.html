<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현금영수증 · 몽골리아 은하수</title>
<style>
  :root { --mint:#0bb7ad; --mint-deep:#078b84; --mint-soft:#edf9f8; --ink:#202326; --sub:#697078; --line:#d9dfe2; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:#eef1f2; color:var(--ink); font-family:Pretendard,"Malgun Gothic",Arial,sans-serif; }
  .toolbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px; background:#fff; border-bottom:1px solid #dde3e5; box-shadow:0 3px 14px rgba(25,45,43,.07); }
  .toolbar button { border:0; border-radius:10px; padding:11px 18px; font:800 13px inherit; cursor:pointer; }
  .toolbar .back { background:#edf1f2; color:#4d555b; }
  .toolbar .print { background:var(--mint-deep); color:#fff; }
  .toolbar span { color:#727b80; font-size:12px; }
  .paper { width:210mm; min-height:297mm; margin:18px auto; padding:9mm 11mm; background:#fff; box-shadow:0 10px 35px rgba(29,45,43,.15); display:flex; flex-direction:column; gap:3mm; }
  .receipt { height:132mm; border:1.2px solid var(--mint); border-radius:2mm; padding:4mm 5mm 3.3mm; display:flex; flex-direction:column; gap:2.3mm; overflow:hidden; }
  .receipt-head { display:flex; align-items:flex-end; justify-content:space-between; border-bottom:1.3px solid var(--mint); padding-bottom:2.5mm; }
  .brand { display:flex; align-items:center; gap:3mm; }
  .logo { width:13mm; height:13mm; border-radius:50%; background:#101516; display:flex; align-items:center; justify-content:center; flex:none; }
  .logo img { width:11mm; height:11mm; object-fit:contain; }
  .brand-name { color:var(--mint); font-size:9px; font-weight:900; }
  .brand-sub { margin-top:1mm; color:var(--sub); font-size:7px; }
  .receipt-title { text-align:right; }
  .copy-label { display:inline-block; margin-bottom:1.2mm; color:var(--mint-deep); font-size:7px; font-weight:900; letter-spacing:.03em; }
  .receipt-title h1 { margin:0; color:var(--mint); font-size:19px; line-height:1; letter-spacing:.28em; }
  .receipt-title small { color:#788187; font-size:6.5px; letter-spacing:.18em; }
  .summary { display:grid; grid-template-columns:1fr 1fr; background:#f5f8f8; }
  .summary-block { min-height:16mm; padding:2.3mm 3mm; }
  .summary-block + .summary-block { border-left:1.2px solid var(--mint); }
  .eyebrow { margin-bottom:1.4mm; color:var(--mint-deep); font-size:6.5px; font-weight:900; letter-spacing:.035em; }
  .summary-row { display:grid; grid-template-columns:17mm 1fr; gap:2mm; margin-top:.8mm; font-size:7.2px; align-items:end; }
  .summary-row .key { color:#6e777c; }
  .summary-row .value { min-height:3.5mm; padding:0 1mm .5mm; border-bottom:1px solid #bcc7ca; font-weight:800; text-align:right; white-space:nowrap; }
  .summary-row .value.left { text-align:left; }
  .amount { border:1.2px solid var(--mint); border-radius:2mm; background:var(--mint-soft); padding:2.2mm 4mm 1.8mm; text-align:center; }
  .amount .eyebrow { color:#374347; letter-spacing:.28em; }
  .amount-line { display:flex; align-items:baseline; justify-content:center; gap:2mm; color:var(--mint); }
  .amount-line b { font-size:16px; letter-spacing:.04em; }
  .amount-line span { font-size:8px; font-weight:800; }
  .amount-note { margin-top:1mm; color:#3f494d; font-size:6.8px; }
  .details { display:grid; grid-template-columns:27mm 1fr; border-top:1px solid var(--line); font-size:7px; }
  .details > div { min-height:5.1mm; display:flex; align-items:center; padding:1mm 2mm; border-bottom:1px solid var(--line); }
  .details .key { background:#f7faf9; color:var(--mint-deep); font-weight:800; }
  .details .value { font-weight:700; }
  .description { min-height:13mm; padding:1.6mm 2mm; background:#f7f9f9; }
  .description .value { margin-top:1.6mm; color:#3e464b; font-size:7px; font-weight:700; }
  .signatures { margin-top:auto; display:grid; grid-template-columns:1fr 1fr; gap:3mm; }
  .signature { min-height:13mm; border:1px solid #c9d0d2; border-radius:1.3mm; padding:2mm 2.6mm; display:flex; flex-direction:column; justify-content:space-between; }
  .signature .title { color:#4f595e; font-size:6.8px; font-weight:900; }
  .signature .line { display:flex; justify-content:space-between; gap:2mm; padding-top:1mm; border-top:1px dashed #bec6c8; color:#697277; font-size:6.7px; }
  .signature .person { color:#30383c; font-weight:800; }
  .footer { display:flex; justify-content:space-between; align-items:center; gap:3mm; padding-top:1.3mm; border-top:1px solid var(--line); color:#667176; font-size:5.8px; white-space:nowrap; }
  .footer b { color:var(--mint-deep); font-size:6.4px; }
  .cut { height:7mm; display:flex; align-items:center; gap:3mm; color:#9ba5a8; font-size:6px; letter-spacing:.14em; }
  .cut::before, .cut::after { content:""; flex:1; border-top:1px dashed #9ba5a8; }
  .error { max-width:620px; margin:80px auto; padding:28px; background:#fff; border-radius:16px; text-align:center; box-shadow:0 10px 35px rgba(20,40,36,.12); }
  .error h1 { font-size:20px; }
  .error p { color:var(--sub); line-height:1.7; }
  @page { size:A4 portrait; margin:0; }
  @media print {
    html, body { width:210mm; height:297mm; background:#fff; }
    .toolbar { display:none !important; }
    .paper { height:297mm; min-height:0; margin:0; box-shadow:none; overflow:hidden; page-break-after:avoid; }
  }
  @media screen and (max-width:850px) {
    .paper { transform-origin:top left; margin:10px 0; box-shadow:none; }
    .toolbar span { display:none; }
  }
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <button class="back" type="button" onclick="window.close()">← 닫기</button>
  <button class="print" type="button" onclick="window.print()">⬇ PDF 다운로드 / 인쇄</button>
  <span>인쇄 창에서 프린터 또는 ‘PDF로 저장’을 선택하세요.</span>
</div>
<main class="paper" id="paper" hidden>
  <section class="receipt" data-copy="고객용 / CUSTOMER COPY"></section>
  <div class="cut">✂ 절취선 / CUT HERE</div>
  <section class="receipt" data-copy="회사 보관용 / COMPANY COPY"></section>
</main>
<div class="error" id="error" hidden>
  <h1>영수증 정보를 불러올 수 없습니다</h1>
  <p>예약관리 화면에서 ‘현금영수증’ 버튼을 다시 눌러 주세요.</p>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const dateKo = value => {
  const m = String(value || "").match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  return m ? `${m[1]}년 ${Number(m[2])}월 ${Number(m[3])}일` : (value || "-");
};
const won = value => `₩ ${Number(value || 0).toLocaleString("ko-KR")}`;

let data = null;
const params = new URLSearchParams(location.search);
const storageKey = params.get("key") || "";
if (/^leaders_cash_receipt_print_[a-z0-9-]+$/i.test(storageKey)) {
  try { data = JSON.parse(localStorage.getItem(storageKey) || "null"); } catch (e) {}
  localStorage.removeItem(storageKey);
}

function receiptHtml(copy) {
  const guide = [data.guideName, data.guideNameEn].filter(Boolean).join(" / ");
  return `
    <div class="receipt-head">
      <div class="brand">
        <div class="logo"><img src="img/brand/mongolia-milkyway-logo.png" alt="몽골리아 은하수"></div>
        <div><div class="brand-name">몽골리아 은하수 여행</div><div class="brand-sub">Mongolia Milky Way · 몽골 현지 전문 여행사</div></div>
      </div>
      <div class="receipt-title"><div class="copy-label">${esc(copy)}</div><h1>현금영수증</h1><small>CASH RECEIPT</small></div>
    </div>
    <div class="summary">
      <div class="summary-block">
        <div class="eyebrow">고객 정보 / CLIENT</div>
        <div class="summary-row"><span class="key">성명</span><span class="value">${esc(data.customerName)} 님</span></div>
        <div class="summary-row"><span class="key">인원</span><span class="value">${esc(data.pax)} 명</span></div>
      </div>
      <div class="summary-block">
        <div class="eyebrow">영수증 정보 / RECEIPT INFO</div>
        <div class="summary-row"><span class="key">영수증 번호</span><span class="value left">${esc(data.receiptNo)}</span></div>
        <div class="summary-row"><span class="key">발행일</span><span class="value left">${esc(dateKo(data.issueDate))}</span></div>
      </div>
    </div>
    <div class="amount"><div class="eyebrow">영수 금액 / AMOUNT RECEIVED</div><div class="amount-line"><b>${esc(won(data.amount))}</b><span>원</span></div><div class="amount-note">위 금액을 현금으로 정히 영수하였습니다</div></div>
    <div class="details">
      <div class="key">상품명</div><div class="value">${esc(data.productName)}</div>
      <div class="key">투어 기간</div><div class="value">${esc(dateKo(data.depart))} ~ ${esc(dateKo(data.returnDate))}</div>
      <div class="key">결제 방법</div><div class="value">현금 (대한민국 원화 / KRW)</div>
      <div class="key">결제 장소</div><div class="value">몽골 현지</div>
    </div>
    <div class="description"><div class="eyebrow">■ 적요 / DESCRIPTION</div><div class="value">${esc(data.description)}</div></div>
    <div class="signatures">
      <div class="signature"><div class="title">고객 서명 / CLIENT SIGNATURE</div><div class="line"><span>서명일: ${esc(dateKo(data.issueDate))}</span><span>(서명)</span></div></div>
      <div class="signature"><div class="title">수령인 서명 / RECEIVED BY</div><div class="line"><span>담당 가이드: <span class="person">${esc(guide)}</span></span><span>(서명)</span></div></div>
    </div>
    <div class="footer"><b>몽골리아 은하수 여행 / Mongolia Milky Way</b><span>https://mongoliasky.co.kr</span><span>bolor1@hanmail.net</span><span>Tel: +976 8010 7766</span></div>`;
}

if (!data || !data.customerName || !(Number(data.amount) > 0)) {
  document.getElementById("toolbar").hidden = true;
  document.getElementById("error").hidden = false;
} else {
  document.querySelectorAll(".receipt").forEach(el => { el.innerHTML = receiptHtml(el.dataset.copy); });
  document.getElementById("paper").hidden = false;
  document.title = `현금영수증_${data.customerName}_${data.issueDate || ""}`;
  if (params.get("print") === "1") {
    window.addEventListener("load", () => requestAnimationFrame(() => window.print()));
  }
}
</script>
</body>
</html>
